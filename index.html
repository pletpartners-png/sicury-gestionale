<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sicury Turni</title>
<style>@page{size:landscape;margin:12mm}</style>
<style>
/* =========================================================
   Sicury Turni \2014  impianto visivo
   Chiaro di giorno in ufficio, scuro di notte e sul campo.
   ========================================================= */

/* ---------- tema chiaro (predefinito) ---------- */
:root{
  --fondo:#F1F5FB;
  --superficie:#FFFFFF;
  --superficie2:#F7FAFE;
  --rilievo:0 1px 2px rgba(13,24,38,.06), 0 6px 18px -8px rgba(13,24,38,.14);
  --rilievo-alto:0 2px 6px rgba(13,24,38,.08), 0 18px 40px -14px rgba(13,24,38,.26);

  --inchiostro:#0A1326;
  --smorzato:#5A6B86;
  --tenue:#8294AE;
  --linea:#DAE2EF;
  --linea-tenue:#E9EFF8;

  /* stesso impianto del sito: cobalto dello smalto per le azioni, cromo per i dettagli */
  --marchio:#3D6CF5;
  --marchio-cont:#FFFFFF;
  --oro:#2A50C9;
  --oro-pieno:#3D6CF5;
  --oro-velo:#EAF0FE;

  --ok:#0F7A50;    --ok-velo:#E4F4EC;
  --att:#8F5C05;   --att-velo:#FCF0DC;
  --all:#B3352C;   --all-velo:#FBE9E7;   --all-cont:#FFFFFF;

  --display:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --testo:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --mono:Arial, "Helvetica Neue", Helvetica, sans-serif;
}

/* ---------- tema scuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-tema="chiaro"]){
    --fondo:#070D1E;
    --superficie:#0E1A33;
    --superficie2:#142242;
    --rilievo:0 1px 2px rgba(0,0,0,.4);
    --rilievo-alto:0 20px 50px -16px rgba(0,0,0,.7);

    --inchiostro:#EEF2F8;
    --smorzato:#93A4C4;
    --tenue:#6B7E9E;
    --linea:#1E2E50;
    --linea-tenue:#17243F;

    --marchio:#3D6CF5;
    --marchio-cont:#FFFFFF;
    --oro:#C9D3E0;
    --oro-pieno:#3D6CF5;
    --oro-velo:#15233F;

    --ok:#54C795;    --ok-velo:#10251C;
    --att:#EAA53F;   --att-velo:#26200F;
    --all:#E97268;   --all-velo:#2A1614;   --all-cont:#2A1614;
  }
}
:root[data-tema="scuro"]{
  --fondo:#070D1E;
  --superficie:#0E1A33;
  --superficie2:#142242;
  --rilievo:0 1px 2px rgba(0,0,0,.4);
  --rilievo-alto:0 20px 50px -16px rgba(0,0,0,.7);
  --inchiostro:#EEF2F8;
  --smorzato:#93A4C4;
  --tenue:#6B7E9E;
  --linea:#1E2E50;
  --linea-tenue:#17243F;
  --marchio:#3D6CF5;
  --marchio-cont:#FFFFFF;
  --oro:#C9D3E0;
  --oro-pieno:#3D6CF5;
  --oro-velo:#15233F;
  --ok:#54C795;    --ok-velo:#10251C;
  --att:#EAA53F;   --att-velo:#26200F;
  --all:#E97268;   --all-velo:#2A1614;   --all-cont:#2A1614;
}

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }

body{
  margin:0; background:var(--fondo); color:var(--inchiostro);
  font-family:var(--testo); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:var(--display); font-weight:700;
  margin:0; letter-spacing:-.022em; line-height:1.12; }
h1{ font-size:1.65rem; letter-spacing:-.03em; }
h2{ font-size:1rem; }
h3{ font-size:.94rem; }
p{ margin:0; }
button,input,select{ font-family:inherit; font-size:inherit; color:inherit; }
:where(button,a,input,select):focus-visible{ outline:2px solid var(--oro-pieno); outline-offset:2px; }

/* ---------- fascia di avviso ---------- */
.avviso{
  background:var(--marchio); color:#fff; text-align:center; padding:6px 16px;
  font-family:var(--mono); font-size:.66rem; letter-spacing:.11em; text-transform:uppercase;
}

/* ---------- marchio ---------- */
.marchio{ display:flex; align-items:center; gap:11px; }
.marchio img{ width:32px; height:auto; display:block; flex:none; }
.marchio strong{ display:block; font-family:var(--display);
  font-size:.98rem; line-height:1.15; letter-spacing:-.015em; }
.marchio em{ display:block; font-style:normal; font-family:var(--mono); font-size:.58rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--smorzato); margin-top:2px; }

/* ---------- accesso ---------- */
.accesso{ min-height:calc(100vh - 30px); display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(60% 55% at 50% 0%, var(--oro-velo), transparent 70%),
    var(--fondo); }
.accesso__box{ width:min(430px,100%); background:var(--superficie); border:1px solid var(--linea);
  border-radius:10px; box-shadow:var(--rilievo-alto); padding:32px 28px;
  display:flex; flex-direction:column; gap:8px; }
.accesso__stemma{ width:74px; height:auto; display:block; margin:0 auto 6px; }
.accesso__box h2{ text-align:center; font-size:1.2rem; }
.accesso__nota{ text-align:center; color:var(--smorzato); font-size:.88rem; margin-bottom:14px; }
.accesso__scelte{ display:flex; flex-direction:column; gap:6px; }
.utenza{ display:flex; align-items:center; gap:12px; padding:10px 12px; cursor:pointer;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:7px; text-align:left;
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
.utenza:hover{ border-color:var(--oro-pieno); transform:translateY(-1px); box-shadow:var(--rilievo); }
.utenza__t{ display:flex; flex-direction:column; line-height:1.3; }
.utenza__t b{ font-weight:650; font-size:.92rem; }
.utenza__t span{ font-family:var(--mono); font-size:.62rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--smorzato); }

/* ---------- pastiglia iniziali ---------- */
.ini{ width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:.68rem; font-weight:500; color:#fff; letter-spacing:.02em; }
.ini--g{ width:38px; height:38px; font-size:.76rem; }

/* ---------- impianto ---------- */
.app{ display:grid; grid-template-columns:224px 1fr; min-height:calc(100vh - 30px); }
.lato{ background:var(--superficie); border-right:1px solid var(--linea);
  padding:20px 16px; display:flex; flex-direction:column; gap:22px; position:relative; }
.lato__stemma{ position:absolute; left:50%; bottom:74px; transform:translateX(-50%);
  width:150px; opacity:.05; pointer-events:none; }
.menu{ display:flex; flex-direction:column; gap:2px; position:relative; z-index:1; }
.menu button{ background:none; border:0; color:var(--smorzato); text-align:left; cursor:pointer;
  padding:9px 12px; border-radius:9px; font-size:.9rem; font-weight:500;
  display:flex; align-items:center; gap:10px;
  transition:background .15s ease, color .15s ease; }
.menu__et{ flex:1; min-width:0; }
.ic--testa{ width:17px; height:17px; color:var(--marchio); flex:none; }
.ic{ width:19px; height:19px; flex:none; opacity:.9; }
.menu button[aria-current="true"] .ic{ opacity:1; }
.menu button:hover{ background:var(--superficie2); color:var(--inchiostro); }
.menu button[aria-current="true"]{ background:var(--marchio); color:var(--marchio-cont); font-weight:600; }
.menu .conta{ font-family:var(--mono); font-size:.68rem; opacity:.85; }
.piede{ margin-top:auto; display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
.tema{ display:flex; gap:3px; padding:3px; background:var(--superficie2);
  border:1px solid var(--linea); border-radius:8px; }
.tema button{ flex:1; background:none; border:0; cursor:pointer; padding:7px 4px; border-radius:6px;
  font-family:var(--mono); font-size:.6rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--smorzato); transition:background .15s ease, color .15s ease; }
.tema button[aria-pressed="true"]{ background:var(--superficie); color:var(--inchiostro); box-shadow:var(--rilievo); }
.esci{ background:none; border:1px solid var(--linea); color:var(--smorzato); border-radius:7px;
  padding:9px; cursor:pointer; font-size:.85rem; }
.esci:hover{ border-color:var(--all); color:var(--all); }

.tela{ padding:24px clamp(16px,2.6vw,32px) 60px; min-width:0; }
.testa{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
  margin-bottom:22px; flex-wrap:wrap; }
.testa__sub{ color:var(--smorzato); font-size:.9rem; margin-top:4px; }
.utente{ display:flex; align-items:center; gap:10px; background:var(--superficie);
  border:1px solid var(--linea); border-radius:99px; padding:5px 14px 5px 5px; box-shadow:var(--rilievo); }
.utente span{ font-size:.85rem; font-weight:600; }

/* ---------- impianto da telefono ----------
   La colonna di sinistra sparisce: la navigazione passa in basso, dove arriva
   il pollice, e tutto lo schermo resta al contenuto. */
.navtel{ display:none; }

@media (max-width:860px){
  .app{ grid-template-columns:1fr; }
  .lato{ display:none; }

  .navtel{
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--superficie); border-top:1px solid var(--linea);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px -14px rgba(13,24,38,.5);
  }
  .navtel button{
    position:relative; background:none; border:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 2px 6px; min-height:52px; border-radius:11px;
    color:var(--smorzato); font-family:var(--testo); font-size:.64rem; letter-spacing:.015em;
    transition:color .15s ease, background .15s ease;
  }
  .navtel button .ic{ width:22px; height:22px; }
  .navtel button span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .navtel button[aria-current="true"]{ color:var(--marchio); background:var(--oro-velo); font-weight:700; }
  .navtel__conta{
    position:absolute; top:3px; left:calc(50% + 7px);
    min-width:16px; height:16px; padding:0 4px; border-radius:99px;
    background:var(--marchio); color:var(--marchio-cont);
    font-size:.58rem; line-height:16px; font-weight:700; }
  .navtel__conta:empty{ display:none; }

  /* lo spazio in fondo serve a non far finire i contenuti sotto la barra */
  .tela{ padding:16px 16px calc(84px + env(safe-area-inset-bottom)); }
  .testa{ margin-bottom:16px; }

  /* il pannello del menu sale dal basso come in un'app */
  .menu-sheet{ display:grid; gap:4px; margin-bottom:6px; }
  .menu-sheet button{ display:flex; align-items:center; gap:12px; width:100%;
    background:var(--superficie2); border:1px solid var(--linea); border-radius:11px;
    padding:13px 14px; cursor:pointer; color:var(--inchiostro);
    font-family:var(--testo); font-size:.94rem; text-align:left; }
  .menu-sheet button:hover{ border-color:var(--marchio); color:var(--marchio); }
  .menu-sheet .ic{ width:20px; height:20px; }
  .tema--sheet button{ padding:11px 4px; text-transform:capitalize; font-size:.78rem; letter-spacing:0; }
}

/* ---------- schede numeriche ---------- */
.riquadri{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px; }
.riq{ background:var(--superficie); border:1px solid var(--linea); border-radius:14px;
  transition:transform .16s ease, box-shadow .16s ease;
  padding:16px 18px 18px; box-shadow:var(--rilievo); position:relative; overflow:hidden; }
.riq::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tenue);
  border-radius:14px 0 0 14px; }
.riq:hover{ transform:translateY(-2px); box-shadow:var(--rilievo-alto); }
.riq b{ display:block; font-family:var(--display); font-weight:800;
  font-size:2rem; line-height:1; letter-spacing:-.035em; font-variant-numeric:tabular-nums; }
.riq span{ display:block; margin-top:7px; font-family:var(--mono); font-size:.62rem;
  letter-spacing:.13em; text-transform:uppercase; color:var(--smorzato); }
.riq--ok::before{ background:var(--ok); } .riq--ok b{ color:var(--ok); }
.riq--att::before{ background:var(--att); } .riq--att b{ color:var(--att); }
.riq--all::before{ background:var(--all); } .riq--all b{ color:var(--all); }

/* ---------- blocchi ---------- */
.blocco{ background:var(--superficie); border:1px solid var(--linea); border-radius:14px;
  box-shadow:var(--rilievo); margin-bottom:20px; overflow:hidden;
  transition:box-shadow .2s ease, border-color .2s ease; }
.blocco:hover{ box-shadow:var(--rilievo-alto); }
.blocco__testa{ display:flex; justify-content:space-between; align-items:center; gap:14px;
  padding:15px 18px; border-bottom:1px solid var(--linea-tenue); flex-wrap:wrap;
  background:linear-gradient(180deg, var(--superficie2) 0%, var(--superficie) 100%); }
.blocco__testa h2{ display:flex; align-items:center; gap:9px; font-size:1rem; letter-spacing:-.01em; }
.tabellone{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; min-width:540px; }
th,td{ text-align:left; padding:10px 18px; border-bottom:1px solid var(--linea-tenue);
  font-size:.88rem; vertical-align:middle; }
th{ font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--tenue); font-weight:400; background:var(--superficie2); }
tbody tr:last-child td{ border-bottom:0; }
tbody tr:hover{ background:var(--superficie2); }
td b{ font-weight:650; }
td small{ display:block; color:var(--smorzato); font-size:.78rem; }
.num{ font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:.82rem; }
.vuoto{ padding:36px 18px; text-align:center; color:var(--smorzato); font-size:.9rem; }
.vuoto img{ width:52px; opacity:.16; display:block; margin:0 auto 12px; }

/* persona in tabella */
.persona{ display:flex; align-items:center; gap:10px; }
.persona .ini{ width:28px; height:28px; font-size:.62rem; }

/* ---------- pastiglie ---------- */
.p{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:.62rem;
  letter-spacing:.07em; text-transform:uppercase; padding:4px 9px; border-radius:99px; white-space:nowrap;
  font-weight:500; }
.p::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.p--ok{ background:var(--ok-velo); color:var(--ok); }
.p--att{ background:var(--att-velo); color:var(--att); }
.p--all{ background:var(--all-velo); color:var(--all); }
.p--neutro{ background:var(--superficie2); color:var(--smorzato); border:1px solid var(--linea); }
.p--oro{ background:var(--oro-velo); color:var(--oro); }
.p--vuota::before{ display:none; }

/* ---------- pulsanti ---------- */
.b{ display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  padding:8px 15px; border-radius:7px; border:1px solid transparent; font-size:.86rem; font-weight:600;
  transition:background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease; }
.b--pri{ background:var(--marchio); color:var(--marchio-cont); }
.b--pri:hover{ transform:translateY(-1px); box-shadow:var(--rilievo); }
.b--sec{ background:var(--superficie); border-color:var(--linea); color:var(--inchiostro); }
.b--sec:hover{ border-color:var(--tenue); }
.b--min{ padding:5px 11px; font-size:.79rem; font-weight:500; border-radius:6px; }
.b:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- diagramma della giornata ---------- */
.giorno{ margin-bottom:20px; }
.assi{ display:grid; grid-template-columns:150px 1fr; align-items:end; padding:0 18px 6px;
  font-family:var(--mono); font-size:.6rem; color:var(--tenue); letter-spacing:.06em; }
.assi__ore{ display:grid; grid-template-columns:repeat(8,1fr); }
.assi__ore span{ border-left:1px solid var(--linea-tenue); padding-left:5px; }
.corsia{ display:grid; grid-template-columns:150px 1fr; align-items:center;
  border-top:1px solid var(--linea-tenue); }
.corsia__et{ padding:11px 12px 11px 18px; font-size:.8rem; line-height:1.3; }
.corsia__et b{ display:block; font-weight:650; }
.corsia__et small{ color:var(--smorzato); font-size:.73rem; }
.corsia__pista{ position:relative; height:56px; margin-right:18px; border-radius:8px;
  background:repeating-linear-gradient(90deg, var(--linea-tenue) 0 1px, transparent 1px 12.5%); }
.corsia:hover{ background:var(--superficie2); }
.barra{ position:absolute; top:9px; bottom:9px; border-radius:6px; padding:0 9px;
  display:flex; align-items:center; gap:7px; overflow:hidden; cursor:pointer;
  border:1px solid; font-size:.75rem; min-width:56px;
  transition:transform .12s ease, box-shadow .12s ease; }
.barra:hover{ transform:translateY(-1px); box-shadow:var(--rilievo); z-index:2; }
.barra b{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.barra .ini{ width:19px; height:19px; font-size:.53rem; }
.barra--ok{ background:var(--ok-velo); border-color:var(--ok); color:var(--ok); }
.barra--pian{ background:var(--oro-velo); border-color:var(--oro-pieno); color:var(--oro); }
.barra--att{ background:var(--att-velo); border-color:var(--att); color:var(--att); }
.barra--scoperta{ background:transparent; border-style:dashed; border-color:var(--all); color:var(--all); }
@media (max-width:760px){
  .assi, .corsia{ grid-template-columns:1fr; }
  .assi__ore{ display:none; }
  .corsia__pista{ margin:0 18px 12px; }
  .corsia__et{ padding-bottom:2px; }
}

/* ---------- barra di copertura ---------- */
.copertura{ display:flex; align-items:center; gap:12px; padding:14px 18px; }
.copertura__barra{ flex:1; height:7px; border-radius:99px; background:var(--superficie2);
  border:1px solid var(--linea); overflow:hidden; }
.copertura__pieno{ height:100%; background:var(--ok); }
.copertura__et{ font-family:var(--mono); font-size:.7rem; color:var(--smorzato); white-space:nowrap; }

/* ---------- turni del dipendente ---------- */
.turni{ display:flex; flex-direction:column; gap:12px; }
.turno{ background:var(--superficie); border:1px solid var(--linea); border-radius:14px;
  transition:border-color .16s ease, box-shadow .16s ease;
  box-shadow:var(--rilievo); padding:15px 18px; display:grid;
  grid-template-columns:66px 1fr auto; gap:16px; align-items:center;
  border-left:3px solid var(--tenue); }
.turno--oggi{ border-left-color:var(--oro-pieno); }
.turno--fatto{ border-left-color:var(--ok); }
.turno__q{ text-align:center; }
.turno__q b{ display:block; font-family:var(--display);
  font-weight:800; font-size:1.6rem; line-height:1; letter-spacing:-.03em; }
.turno__q span{ font-family:var(--mono); font-size:.6rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--smorzato); }
.turno__c h3{ margin-bottom:2px; }
.turno__c p{ color:var(--smorzato); font-size:.84rem; }
.turno__c .ora{ font-family:var(--mono); color:var(--oro); font-size:.8rem; margin-top:3px; }
.turno__a{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.turno:hover{ border-color:var(--marchio); box-shadow:var(--rilievo); }
.turno__c .ora{ color:var(--marchio); font-weight:650; }
@media (max-width:620px){
  .turno__a{ align-items:stretch; width:100%; }
  .turno__a .b{ width:100%; justify-content:center; padding:11px; }
}
@media (max-width:620px){
  .turno{ grid-template-columns:56px 1fr; }
  .turno__a{ grid-column:1/-1; flex-direction:row; align-items:center; }
}

/* ---------- foglio modale ---------- */
.velo{ position:fixed; inset:0; background:rgba(8,15,25,.55); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:20px; z-index:50; }
.foglio{ width:min(540px,100%); max-height:88vh; overflow:auto; background:var(--superficie);
  border:1px solid var(--linea); border-radius:12px; box-shadow:var(--rilievo-alto); padding:26px; }
.foglio h2{ margin-bottom:5px; font-size:1.15rem; }
.foglio__nota{ color:var(--smorzato); font-size:.86rem; margin-bottom:20px; }
.campo{ display:flex; flex-direction:column; gap:6px; margin-bottom:15px; }
.campo > span{ font-family:var(--mono); font-size:.62rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); }
.campo input, .campo select{ background:var(--superficie2); border:1px solid var(--linea);
  padding:9px 12px; border-radius:7px; }
.spunte{ display:flex; flex-wrap:wrap; gap:7px; }
.spunta{ display:flex; align-items:center; gap:7px; border:1px solid var(--linea);
  padding:6px 11px; border-radius:99px; cursor:pointer; font-size:.83rem; background:var(--superficie2); }
.spunta input{ accent-color:var(--oro-pieno); }
.spunta:has(input:checked){ border-color:var(--oro-pieno); color:var(--oro); background:var(--oro-velo); }
.azioni{ display:flex; gap:9px; justify-content:flex-end; margin-top:22px;
  padding-top:18px; border-top:1px solid var(--linea-tenue); }
.errore{ background:var(--all-velo); border-left:3px solid var(--all); border-radius:0 7px 7px 0;
  padding:11px 14px; font-size:.85rem; margin-bottom:12px; }
.errore b{ color:var(--all); }

/* ---------- rilevazione in corso ---------- */
.radar{ display:grid; place-items:center; padding:26px 0 8px; }
.radar__cerchio{ width:78px; height:78px; border-radius:50%; border:2px solid var(--oro-pieno);
  position:relative; display:grid; place-items:center; }
.radar__cerchio::after{ content:""; position:absolute; inset:-14px; border-radius:50%;
  border:1px solid var(--oro-pieno); opacity:.5; animation:onda 1.6s ease-out infinite; }
.radar__cerchio img{ width:34px; }
@keyframes onda{ from{ transform:scale(.75); opacity:.7; } to{ transform:scale(1.25); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .radar__cerchio::after{ animation:none; } }

/* ---------- indicatore dell'ora corrente ---------- */
.adesso{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--all); z-index:3;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--all) 18%, transparent); }
.adesso::before{ content:"adesso"; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:.53rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--all); white-space:nowrap; }

/* ---------- orologio operativo ---------- */
.ora-viva{ font-family:var(--mono); font-size:.78rem; font-variant-numeric:tabular-nums;
  color:var(--smorzato); letter-spacing:.04em; padding-right:4px; }

/* ---------- pianta di prossimita' ---------- */
.pianta__box{ display:grid; grid-template-columns:190px 1fr; gap:20px; align-items:center;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:10px;
  padding:16px; margin-bottom:16px; }
.pianta{ width:100%; height:auto; display:block; }
.pianta__dati{ display:grid; gap:12px; }
.pianta__dati div{ display:flex; flex-direction:column; gap:1px; }
.pianta__dati span{ font-family:var(--mono); font-size:.58rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); }
.pianta__dati b{ font-family:var(--display); font-weight:700;
  font-size:1.05rem; letter-spacing:-.02em; }
@media (max-width:520px){ .pianta__box{ grid-template-columns:1fr; } .pianta{ max-width:200px; margin:0 auto; } }

/* ---------- comparsa progressiva ---------- */
.entra{ animation:sali .45s cubic-bezier(.2,.7,.3,1) both; }
@keyframes sali{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .entra{ animation:none; } }

/* la barra del diagramma e' un pulsante: azzero gli stili nativi */
.barra{ font-family:inherit; color:inherit; text-align:left; }

/* ---------- campi affiancati ---------- */
.duecol{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:480px){ .duecol{ grid-template-columns:1fr; gap:0; } }

/* ---------- griglia di pianificazione ---------- */
.griglia{ min-width:1182px; table-layout:fixed; }
.griglia th{ position:sticky; top:0; z-index:2; }
.griglia thead th.oggi{ color:var(--marchio); background:var(--oro-velo);
  box-shadow:inset 0 -2px 0 var(--marchio); }
.griglia thead th.festivo{ color:var(--tenue); background:var(--superficie2); }
.griglia tbody td.oggi{ background:color-mix(in srgb, var(--oro-velo) 55%, transparent); }
/* La colonna dei nomi eredita lo stile delle intestazioni: va riportata a
   testo normale, altrimenti il maiuscoletto spaziato spezza i cognomi. */
.griglia tbody th{ position:sticky; left:0; z-index:1; background:var(--superficie);
  border-right:1px solid var(--linea); text-align:left; padding:11px 14px;
  font-family:var(--testo); font-weight:400; font-size:.84rem;
  text-transform:none; letter-spacing:normal; color:var(--inchiostro);
  width:196px; min-width:196px; max-width:196px; }
.griglia tbody th b{ font-weight:700; font-size:.86rem; display:block; line-height:1.3;
  text-transform:none; letter-spacing:normal; overflow-wrap:break-word; hyphens:auto; }
.griglia tbody th small{ color:var(--smorzato); font-size:.72rem; display:block; margin-top:3px;
  text-transform:none; letter-spacing:normal; font-family:var(--testo); }
.griglia td{ padding:6px; vertical-align:top; width:142px; min-width:142px; max-width:142px; position:relative;
  border-left:1px solid var(--linea-tenue); }
.griglia tbody tr:hover th{ background:var(--superficie2); }
.riga-scoperti th{ background:var(--all-velo) !important; }
.riga-scoperti td{ background:color-mix(in srgb, var(--all) 4%, transparent); }

.gettone{ display:flex; width:100%; max-width:100%; box-sizing:border-box; text-align:left;
  cursor:pointer; margin-bottom:5px; padding:7px 8px; border-radius:7px; border:1px solid;
  background:var(--superficie2); overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease; }
.gettone{ transition:transform .14s ease, box-shadow .14s ease; }
.gettone:hover{ box-shadow:var(--rilievo); transform:translateY(-1px); }
.gettone b{ display:block; font-family:var(--mono); font-size:.7rem; font-weight:500; letter-spacing:.02em; }
.gettone span{ display:block; font-size:.76rem; font-weight:600; line-height:1.25; margin-top:1px; }
.gettone small{ display:block; font-size:.68rem; opacity:.75; }
.gettone--ok{ border-color:var(--ok); color:var(--ok); background:var(--ok-velo); }
.gettone--pian{ border-color:var(--oro-pieno); color:var(--oro); background:var(--oro-velo); }
.gettone--att{ border-color:var(--att); color:var(--att); background:var(--att-velo); }
.gettone--scoperta{ border-color:var(--all); color:var(--all); background:transparent; border-style:dashed; }

.piu{ width:100%; padding:5px; border:1px dashed var(--linea); background:none; color:var(--tenue);
  border-radius:6px; cursor:pointer; font-size:.9rem; line-height:1; opacity:0;
  transition:opacity .15s ease, border-color .15s ease, color .15s ease; }
.griglia td:hover .piu{ opacity:1; }
.piu:hover{ border-color:var(--oro-pieno); color:var(--oro); }
.piu:focus-visible{ opacity:1; }

/* ---------- schede ---------- */
.schede{ display:inline-flex; gap:3px; padding:3px; background:var(--superficie2);
  border:1px solid var(--linea); border-radius:9px; margin-bottom:18px; }
.schede button{ background:none; border:0; cursor:pointer; padding:8px 18px; border-radius:6px;
  font-size:.87rem; font-weight:600; color:var(--smorzato);
  transition:background .15s ease, color .15s ease; }
.schede button[aria-pressed="true"]{ background:var(--marchio); color:var(--marchio-cont); }
.schede--min{ margin:0; }
.schede--min button{ padding:6px 13px; font-size:.79rem; font-weight:500; }
.schede--min button[aria-pressed="true"]{ background:var(--superficie); color:var(--inchiostro); box-shadow:var(--rilievo); }

/* ---------- pannello generatore ---------- */
.genera{ position:relative; overflow:hidden; border:1px solid var(--oro-pieno); border-radius:14px;
  padding:18px; margin-bottom:16px; box-shadow:var(--rilievo);
  background:var(--superficie);
  background-image:linear-gradient(135deg, var(--oro-velo) 0%, transparent 62%); }
.genera::after{ content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px;
  border-radius:50%; background:var(--marchio); opacity:.07; pointer-events:none; }
.genera__t b{ display:block; font-family:var(--display);
  font-size:.98rem; letter-spacing:-.015em; }
.genera__t span{ display:block; color:var(--smorzato); font-size:.83rem; margin:3px 0 13px; }
.genera__r{ display:flex; gap:10px; }
.genera__r input{ flex:1; background:var(--superficie); border:1px solid var(--linea);
  border-radius:8px; padding:11px 14px; font-size:.88rem; }
@media (max-width:620px){ .genera__r{ flex-direction:column; } }

/* ---------- comandi del periodo ---------- */
.comandi{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  background:var(--superficie); border:1px solid var(--linea); border-radius:13px;
  padding:9px 12px; box-shadow:var(--rilievo); }
.comandi__nav{ display:flex; gap:4px; }
.comandi__et{ font-family:var(--testo); font-size:.86rem; font-weight:650; color:var(--inchiostro); }
.comandi__dx{ margin-left:auto; display:flex; gap:6px; }
@media (max-width:620px){
  .comandi{ gap:8px; padding:10px; }
  .comandi__et{ order:-1; width:100%; font-size:.92rem; }
  .comandi__dx{ margin-left:0; width:100%; }
  .comandi__dx .b{ flex:1; }
}

/* ---------- legenda dei codici ---------- */
.legenda{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.cod{ display:inline-flex; align-items:center; gap:7px; background:var(--superficie);
  border:1px solid var(--linea); border-radius:8px; padding:7px 12px; font-size:.8rem; }
.cod i{ width:9px; height:9px; border-radius:2px; flex:none; }
.cod b{ font-family:var(--mono); font-weight:500; }
.cod small{ color:var(--smorzato); font-family:var(--mono); font-size:.72rem; }

/* ---------- intestazioni dei giorni ---------- */
.griglia thead th span{ display:block; font-family:var(--mono); font-size:.6rem;
  letter-spacing:.1em; text-transform:uppercase; color:var(--tenue); }
.griglia thead th b{ display:block; font-family:var(--display);
  font-size:1.2rem; font-weight:700; letter-spacing:-.03em; margin-top:1px; }
.griglia thead th.festivo{ color:var(--all); }
.griglia thead th.festivo span, .griglia thead th.festivo b{ color:var(--all); }

/* ---------- gettone con codice ---------- */
.gettone{ align-items:flex-start; gap:7px; }
.gettone__c{ width:20px; height:20px; flex:none; margin-top:1px; border-radius:5px; color:#fff;
  font-family:var(--mono); font-size:.7rem; font-weight:500; display:grid; place-items:center; }
.gettone__t{ min-width:0; flex:1; }
.gettone__t b{ display:block; font-size:.74rem; font-weight:700; line-height:1.25;
  overflow-wrap:anywhere; }
.gettone__t small{ display:block; font-size:.66rem; opacity:.85; margin-top:1px; overflow-wrap:anywhere; }

/* ---------- area di esportazione ---------- */
.csv{ width:100%; height:210px; font-family:var(--mono); font-size:.72rem; line-height:1.7;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:8px;
  padding:12px; resize:vertical; white-space:pre; }

/* ---------- documenti da stampare ----------
   Vivono in un contenitore a parte: a video non compaiono mai, in stampa
   sostituiscono l'intera pagina. Impaginati in bianco e nero, su A4. */
.stampato{ display:none; }

@media print{
  @page{ size:A4; margin:14mm 12mm 16mm; }
  .avviso, .app, .velo, .navtel{ display:none !important; }
  .stampato{ display:block !important; }
  html, body{ background:#fff !important; color:#000 !important; }
  body{ font-family:Arial, Helvetica, sans-serif; font-size:9.5pt; line-height:1.35; }

  .carta__t{ display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; padding-bottom:9px; border-bottom:1.6pt solid #0A1326; margin-bottom:14px; }
  .carta__t img{ width:46px; height:auto; }
  .carta__n h1{ font-size:15pt; margin:0 0 2px; letter-spacing:-.2pt; }
  .carta__n p{ margin:0; font-size:8.5pt; color:#444; }
  .carta__d{ text-align:right; font-size:8pt; color:#444; line-height:1.5; }
  .carta__d b{ display:block; font-size:9pt; color:#000; }

  .stampato table{ width:100%; border-collapse:collapse; margin-bottom:12px; }
  .stampato th, .stampato td{ border:.6pt solid #9aa3ad; padding:4pt 5pt; text-align:left;
    vertical-align:top; font-size:8.5pt; }
  .stampato thead th{ background:#eef2f8; font-size:7.6pt; letter-spacing:.4pt;
    text-transform:uppercase; }
  .stampato tbody tr:nth-child(even) td{ background:#f7f9fc; }
  .stampato td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stampato small{ display:block; color:#555; font-size:7.6pt; }
  .stampato h2{ font-size:11pt; margin:16px 0 7px; padding-bottom:3px; border-bottom:.8pt solid #ccd3dc; }
  .stampato .nulla{ color:#666; font-style:italic; padding:6pt 0; }
  .stampato .totali td{ background:#eef2f8 !important; font-weight:700; }
  .stampato .fuori{ font-weight:700; }
  .stampato .piede-doc{ position:fixed; bottom:4mm; left:0; right:0;
    font-size:7.4pt; color:#666; border-top:.5pt solid #ccd3dc; padding-top:3pt; }
  .stampato .sezione{ page-break-inside:avoid; }
  .stampato .nuova-pagina{ page-break-before:always; }
}

/* ---------- configurazione ---------- */
.postilla{ padding:12px 18px 16px; color:var(--smorzato); font-size:.82rem;
  border-top:1px solid var(--linea-tenue); }
.gio{ display:inline-block; font-family:var(--mono); font-size:.62rem; letter-spacing:.05em;
  padding:3px 6px; border-radius:4px; margin-right:3px;
  background:var(--superficie2); color:var(--tenue); border:1px solid var(--linea); }
.gio--on{ background:var(--marchio); color:var(--marchio-cont); border-color:var(--marchio); }
.campo input[type="color"]{ height:40px; padding:4px; cursor:pointer; }

/* ---------- modulo di accesso ---------- */
.login{ display:flex; flex-direction:column; gap:2px; margin-top:6px; }
.login .campo input{ padding:11px 13px; }
.demo{ margin-top:16px; border-top:1px solid var(--linea-tenue); padding-top:12px; }
.demo summary{ cursor:pointer; font-family:var(--mono); font-size:.64rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); list-style:none; }
.demo summary::before{ content:"\25B8  "; }
.demo[open] summary::before{ content:"\25BE  "; }
.demo__t{ width:100%; min-width:0; margin:10px 0 12px; font-size:.76rem; }
.demo__t td{ padding:5px 4px; border-bottom:1px solid var(--linea-tenue); }
.demo__t code{ font-family:var(--mono); font-size:.72rem; background:var(--superficie2);
  padding:2px 6px; border-radius:4px; border:1px solid var(--linea); }
.demo__r{ display:flex; flex-direction:column; gap:5px; }
.demo__r .utenza{ padding:7px 10px; }
.demo__r .utenza .ini{ width:26px; height:26px; font-size:.58rem; }

/* ---------- voce riservata allo sviluppatore ---------- */
.menu__dev{ margin-top:10px; border-top:1px dashed var(--linea); padding-top:14px !important;
  border-radius:0 0 7px 7px !important; }
.menu__dev::before{ content:"\2699  "; opacity:.7; }
.menu__dev[aria-current="true"]{ border-radius:7px !important; }

/* ---------- campi di rinomina ---------- */
.rinomina{ width:100%; background:var(--superficie2); border:1px solid var(--linea);
  padding:7px 10px; border-radius:6px; font-size:.86rem; }
.rinomina:focus{ border-color:var(--oro-pieno); }

/* ---------- telefono: le tabelle strette si adattano invece di scorrere ----------
   Solo la griglia di pianificazione resta scorrevole: e' larga per natura. */
@media (max-width:620px){
  .tabellone:not(.tabellone--griglia){ overflow-x:visible; }
  .tabellone table:not(.griglia){ min-width:0; width:100%; border:0; }
  .tabellone table:not(.griglia) thead{ position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tabellone table:not(.griglia) tbody tr{
    display:block; padding:12px 0; border-bottom:1px solid var(--linea-tenue); }
  .tabellone table:not(.griglia) tbody tr:last-child{ border-bottom:0; }
  .tabellone table:not(.griglia) tbody td,
  .tabellone table:not(.griglia) tbody th{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:5px 0; border:0; text-align:right; white-space:normal; word-break:break-word; }
  .tabellone table:not(.griglia) tbody td[data-etichetta]::before,
  .tabellone table:not(.griglia) tbody th[data-etichetta]::before{
    content:attr(data-etichetta); flex:0 0 42%; text-align:left;
    font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--tenue); font-weight:700; }
  /* celle di sole azioni: il pulsante prende tutta la riga */
  .tabellone table:not(.griglia) tbody td:not([data-etichetta]),
  .tabellone table:not(.griglia) tbody th:not([data-etichetta]),
  .tabellone table:not(.griglia) tbody td[data-etichetta=""]{
    justify-content:flex-start; padding-top:9px; }
  .tabellone table:not(.griglia) tbody td[data-etichetta=""]::before{ content:none; }
  .tabellone table:not(.griglia) .b--min{ padding:7px 12px; font-size:.78rem; white-space:nowrap; }
  .tabellone table.senza-intestazioni tbody td,
  .tabellone table.senza-intestazioni tbody th{ justify-content:flex-start; text-align:left; }
  /* celle con gettoni o pulsanti: vanno a capo invece di uscire dalla cella */
  .tabellone table:not(.griglia) tbody td.cella--gettoni{
    flex-wrap:wrap; row-gap:6px; column-gap:5px; justify-content:flex-end; }
  .tabellone table:not(.griglia) tbody td.cella--gettoni .gio{ margin:0; }
  .p{ font-size:.58rem; padding:3px 7px; }
}

/* ---------- il turno di oggi, da timbrare ---------- */
.turnoggi{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  background:linear-gradient(135deg, var(--marchio) 0%, var(--oro) 100%);
  color:#fff; border-radius:16px; padding:20px 22px; margin-bottom:20px;
  box-shadow:0 14px 34px -18px rgba(61,108,245,.9); }
.turnoggi__t{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.turnoggi__t span{ font-size:.66rem; letter-spacing:.17em; text-transform:uppercase; opacity:.78; }
.turnoggi__t b{ font-size:1.14rem; }
.turnoggi__t small{ font-size:.86rem; opacity:.9; }
.turnoggi__b{ display:flex; align-items:center; gap:9px; flex:none;
  background:#fff; border-color:#fff; color:var(--marchio); font-weight:700;
  padding:13px 22px; border-radius:11px; }
.turnoggi__b:hover{ background:#fff; filter:brightness(.97); }
.turnoggi__b .ic{ width:19px; height:19px; }
@media (max-width:620px){
  .turnoggi{ flex-direction:column; align-items:stretch; gap:14px; padding:18px; }
  .turnoggi__b{ justify-content:center; padding:15px; font-size:1rem; }
}

/* ---------- scelta del documento e moduli ---------- */
.scelte{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; padding:16px; }
.scelta{ display:flex; flex-direction:column; gap:5px; text-align:left; cursor:pointer;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:12px;
  padding:14px 16px; color:var(--inchiostro); font-family:var(--testo); }
.scelta:hover{ border-color:var(--marchio); }
.scelta b{ font-size:.95rem; }
.scelta small{ color:var(--smorzato); font-size:.78rem; line-height:1.45; }
.scelta--on{ border-color:var(--marchio); background:var(--oro-velo); box-shadow:inset 0 0 0 1px var(--marchio); }
.scelta--on b{ color:var(--marchio); }
.modulo{ padding:0 16px 4px; }
.modulo__az{ display:flex; flex-wrap:wrap; gap:10px; padding:12px 16px 18px; }
.modulo__az .b{ display:flex; align-items:center; gap:8px; }
.modulo__az .ic{ width:17px; height:17px; }
.rapidi{ display:flex; gap:6px; flex-wrap:wrap; }
.anteprima{ padding:18px; overflow-x:auto; background:#fff; color:#111; }
.anteprima table{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:.78rem; }
.anteprima th, .anteprima td{ border:1px solid #c3ccd6; padding:5px 7px; text-align:left; vertical-align:top; }
.anteprima thead th{ background:#eef2f8; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; }
.anteprima td.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.anteprima small{ display:block; color:#556; font-size:.68rem; }
.anteprima h1{ font-size:1.15rem; margin:0 0 2px; }
.anteprima h2{ font-size:.96rem; margin:16px 0 7px; padding-bottom:3px; border-bottom:1px solid #ccd3dc; }
.anteprima .carta__t{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding-bottom:10px; border-bottom:2px solid #0A1326; margin-bottom:14px; }
.anteprima .carta__t img{ width:48px; height:auto; }
.anteprima .carta__n p{ margin:0; font-size:.78rem; color:#556; }
.anteprima .carta__d{ text-align:right; font-size:.72rem; color:#556; line-height:1.5; }
.anteprima .carta__d b{ display:block; font-size:.8rem; color:#111; }
.anteprima .totali td{ background:#eef2f8; font-weight:700; }
.anteprima .fuori{ font-weight:700; color:#B3352C; }
.anteprima .nulla{ color:#667; font-style:italic; font-size:.78rem; }
@media (max-width:620px){
  .scelte{ grid-template-columns:1fr; padding:14px; }
  .modulo__az{ flex-direction:column; }
  .modulo__az .b{ justify-content:center; }
}

/* ---------- riga di nota dentro una finestra ---------- */
.nota-riga{ background:var(--att-velo); border-left:3px solid var(--att); border-radius:0 8px 8px 0;
  padding:11px 14px; margin-bottom:16px; font-size:.88rem; color:var(--inchiostro); }
.nota-riga--ok{ background:var(--ok-velo); border-left-color:var(--ok); }

/* ---------- istruzioni passo passo ---------- */
.passi{ margin:0 0 18px; padding-left:22px; display:grid; gap:9px; color:var(--smorzato); font-size:.92rem; line-height:1.5; }
.passi b{ color:var(--inchiostro); }

/* ---------- controlli automatici ---------- */
.blocco--all{ border-color:var(--all); }
.blocco--att{ border-color:var(--att); }
.blocco--ok{ border-color:var(--ok); }
.avvisi{ display:grid; gap:6px; padding:14px 16px 16px; }
.avv{ display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--superficie2); border:1px solid var(--linea); border-left-width:3px;
  border-radius:10px; padding:12px 14px; color:var(--inchiostro); font-family:var(--testo); }
.avv:hover, .avv:focus-visible{ background:var(--oro-velo); border-color:var(--marchio); border-left-color:var(--marchio); }
.avv .ic{ width:18px; height:18px; flex:none; margin-top:1px; }
.avv--all{ border-left-color:var(--all); } .avv--all .ic{ color:var(--all); }
.avv--att{ border-left-color:var(--att); } .avv--att .ic{ color:var(--att); }
.avv__t{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.avv__t b{ font-size:.9rem; }
.avv__t small{ color:var(--smorzato); font-size:.8rem; line-height:1.45; }

/* ---------- ricerca rapida ---------- */
.testa__az{ display:flex; align-items:center; gap:10px; }
.cerca-b{ display:flex; align-items:center; gap:8px; cursor:pointer;
  background:var(--superficie); border:1px solid var(--linea); border-radius:99px;
  padding:8px 14px; color:var(--smorzato); font-family:var(--testo); font-size:.86rem;
  box-shadow:var(--rilievo); transition:border-color .15s, color .15s; }
.cerca-b:hover{ border-color:var(--marchio); color:var(--marchio); }
.cerca-b .ic{ width:17px; height:17px; }
.cerca-b kbd{ font-family:var(--mono); font-size:.66rem; padding:2px 6px; border-radius:5px;
  background:var(--superficie2); border:1px solid var(--linea); color:var(--tenue); }
.campana{ position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;
  width:40px; height:40px; border-radius:11px; color:var(--smorzato);
  background:var(--superficie); border:1px solid var(--linea); box-shadow:var(--rilievo);
  transition:border-color .15s, color .15s; }
.campana:hover{ border-color:var(--marchio); color:var(--marchio); }
.campana .ic{ width:19px; height:19px; }
.campana__n{ position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px;
  border-radius:99px; background:var(--all); color:#fff; font-family:var(--testo);
  font-size:.62rem; line-height:18px; font-weight:700; }
.campana__n--vuota{ display:none; }
.avvisi--sheet{ padding:0; max-height:52vh; overflow-y:auto; margin-bottom:6px; }

.cerca__esiti{ max-height:46vh; overflow-y:auto; display:grid; gap:4px; margin-bottom:6px; }
.cerca__e{ display:flex; align-items:center; gap:12px; width:100%; cursor:pointer; text-align:left;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:10px;
  padding:11px 13px; color:var(--inchiostro); font-family:var(--testo); }
.cerca__e:hover, .cerca__e:focus-visible{ border-color:var(--marchio); background:var(--oro-velo); }
.cerca__e .ic{ width:18px; height:18px; color:var(--marchio); flex:none; }
.cerca__t{ flex:1; min-width:0; display:flex; flex-direction:column; }
.cerca__t b{ font-size:.92rem; }
.cerca__t small{ color:var(--smorzato); font-size:.76rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:860px){
  .cerca-b span, .cerca-b kbd{ display:none; }
  .cerca-b{ padding:9px; border-radius:11px; }
  .cerca-b .ic{ width:19px; height:19px; }
  .cerca__esiti{ max-height:54vh; }
}

/* ---------- fascicolo del dipendente ---------- */
/* la X di eliminazione: discreta finche' non ci passi sopra */
.ics{ width:28px; height:28px; flex:none; border-radius:7px; cursor:pointer;
  border:1px solid var(--linea); background:var(--superficie); color:var(--tenue);
  font-size:1.05rem; line-height:1; font-family:var(--testo);
  transition:background .14s, color .14s, border-color .14s; }
.ics:hover, .ics:focus-visible{ background:var(--all-velo); border-color:var(--all); color:var(--all); }
.b--all{ background:var(--all); border-color:var(--all); color:var(--all-cont); }
.b--all:hover{ filter:brightness(1.08); }
.fasc__testa{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.avviso-riga{ background:var(--att-velo); border-left:3px solid var(--att); border-radius:0 7px 7px 0;
  padding:12px 16px; margin-bottom:18px; font-size:.9rem; color:var(--inchiostro); }
.foglio__sez{ font-family:var(--display); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--tenue); margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--linea-tenue); }
.foglio__sez:first-of-type{ border-top:0; padding-top:0; margin-top:16px; }

.due{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.due .blocco{ margin-bottom:0; }
@media (max-width:860px){ .due{ grid-template-columns:1fr; gap:0; } .due .blocco{ margin-bottom:20px; } }

.dati{ padding:4px 18px 10px; display:flex; flex-direction:column; }
.dati > div{ padding:11px 0; border-bottom:1px solid var(--linea-tenue); }
.dati > div:last-child{ border-bottom:0; }
.dati span{ display:block; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--tenue); }
.dati b{ display:block; font-size:.92rem; font-weight:700; margin-top:2px; overflow-wrap:anywhere; }

.nota-box{ padding:4px 18px 18px; border-top:1px solid var(--linea-tenue); margin-top:4px; }
.nota-box textarea{ width:100%; background:var(--superficie2); border:1px solid var(--linea);
  border-radius:7px; padding:9px 12px; font-family:inherit; font-size:.9rem; color:inherit; resize:vertical; }
.nota-box textarea:focus{ border-color:var(--oro-pieno); outline:none; }

.campo input[type="file"]{ background:var(--superficie2); border:1px dashed var(--linea);
  padding:14px 12px; border-radius:7px; cursor:pointer; font-size:.85rem; }
.campo input[type="file"]:hover{ border-color:var(--marchio); }

</style>
</head>

/* ============ cassaforte ============
   L'archivio non sta piu' in chiaro nel browser. Funziona cosi':

   - una chiave d'archivio (DEK) casuale cifra tutti i dati e tutti i file;
   - quella chiave non si salva mai in chiaro: viene avvolta con una seconda
     chiave (KEK) ricavata dalla password di ciascun account con PBKDF2;
   - entrare vuol dire riuscire ad aprire l'involucro con la propria password.
     Non esiste un'impronta della password da rubare: o la password apre la
     busta, o non si entra.

   Resta vero che tutto questo protegge i dati sul dispositivo. Non sostituisce
   un archivio centrale: vedi la nota in testa al file. */

var CHIAVE_ARCHIVIO = 'sicury:archivio:v3';
var CHIAVE_UTENZE   = 'sicury:utenze:v3';
var CHIAVE_VECCHIA  = 'sicury:turni:v1';
var GIRI_PBKDF2     = 310000;   // raccomandazione OWASP per PBKDF2-SHA256

var sub = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
var CRITTOGRAFIA_DISPONIBILE = !!sub;

function caso(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function b64(buf){
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function daB64(t){
  var s = atob(t), a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

/* KEK: dalla password, con sale e molti giri, cosi un tentativo a forza bruta costa */
function chiaveDaPassword(pw, sale, giri){
  return sub.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return sub.deriveKey(
        { name:'PBKDF2', salt:daB64(sale), iterations:giri || GIRI_PBKDF2, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
    });
}
function chiaveNuova(){
  return sub.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt', 'decrypt']);
}
function cifra(chiave, bytes){
  var iv = caso(12);
  return sub.encrypt({ name:'AES-GCM', iv:iv }, chiave, bytes)
    .then(function(c){ return { iv:b64(iv), dato:b64(c) }; });
}
function decifra(chiave, pacco){
  return sub.decrypt({ name:'AES-GCM', iv:daB64(pacco.iv) }, chiave, daB64(pacco.dato));
}
function cifraTesto(chiave, testo){ return cifra(chiave, new TextEncoder().encode(testo)); }
function decifraTesto(chiave, pacco){
  return decifra(chiave, pacco).then(function(b){ return new TextDecoder().decode(b); });
}

/* avvolge e riapre la chiave d'archivio */
function avvolgi(kek, dek){
  return sub.exportKey('raw', dek).then(function(raw){ return cifra(kek, raw); });
}
function sfila(kek, busta){
  return decifra(kek, busta).then(function(raw){
    return sub.importKey('raw', raw, { name:'AES-GCM' }, true, ['encrypt', 'decrypt']);
  });
}

/* --- indice delle utenze: l'unica cosa in chiaro, e il minimo indispensabile --- */
function leggiUtenze(){
  try { return JSON.parse(localStorage.getItem(CHIAVE_UTENZE)) || []; } catch (e) { return []; }
}
function scriviUtenze(u){
  try { localStorage.setItem(CHIAVE_UTENZE, JSON.stringify(u)); } catch (e) {}
}
function utenzaDi(email){
  var e = String(email || '').toLowerCase();
  return leggiUtenze().filter(function(x){ return x.email === e; })[0];
}
/* crea o aggiorna la busta di un account */
function registraUtenza(email, pw, dek, deveCambiare){
  var sale = b64(caso(16));
  return chiaveDaPassword(pw, sale, GIRI_PBKDF2).then(function(kek){
    return avvolgi(kek, dek).then(function(busta){
      var tutte = leggiUtenze().filter(function(x){ return x.email !== String(email).toLowerCase(); });
      tutte.push({ email:String(email).toLowerCase(), sale:sale, giri:GIRI_PBKDF2,
                   busta:busta, cambia: !!deveCambiare });
      scriviUtenze(tutte);
    });
  });
}
function togliUtenza(email){
  scriviUtenze(leggiUtenze().filter(function(x){ return x.email !== String(email).toLowerCase(); }));
}

var DEK = null;            // vive solo in memoria, sparisce con l'uscita
var sbloccato = false;

/* le aggiunte di versione in versione si applicano a qualunque archivio */
function completa(d){
  if (!d || !d.turni) d = semi();
  if (!d.esigenze)  d.esigenze = semi().esigenze;
  if (!d.codici)    d.codici = codiciDiPartenza();

    if (!x.cf)        x.cf = '';

  });

}

/* Le scritture si accodano: cifrare e' asincrono, ma l'ordine resta quello
   delle chiamate e l'ultima versione vince. */
var codaScrittura = Promise.resolve();
var scritturePendenti = 0;

function salva(){
  if (!sbloccato) return;
  registraOperazione();
  if (!CRITTOGRAFIA_DISPONIBILE) {
    try { localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify({ v:0, chiaro:D })); } catch (e) {}
    return;
  }
  var istantanea = JSON.stringify(D);
  scritturePendenti++;
  codaScrittura = codaScrittura.then(function(){
    return cifraTesto(DEK, istantanea).then(function(pacco){
      try { localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify({ v:3, iv:pacco.iv, dato:pacco.dato })); }
      catch (e) { avvisaSpazio(e); }
    });
  }).catch(function(){}).then(function(){ scritturePendenti--; });
  return codaScrittura;
}

function avvisaSpazio(e){
  console.warn('Archivio non salvato:', e && e.message);
}

/* apre l'archivio con la chiave appena ricavata */
function apriArchivio(dek){
  var grezzo = localStorage.getItem(CHIAVE_ARCHIVIO);
  if (!grezzo) return Promise.resolve(completa(null));
  var pacco;
  try { pacco = JSON.parse(grezzo); } catch (e) { return Promise.resolve(completa(null)); }
  if (pacco.v === 0) return Promise.resolve(completa(pacco.chiaro));
  return decifraTesto(dek, pacco).then(function(t){ return completa(JSON.parse(t)); });
}

/* ============ conservazione dei file ============
   I documenti e le buste paga non restano un nome su una riga: il file vero
   viene cifrato con la stessa chiave dell'archivio e messo in IndexedDB, che
   regge decine di megabyte. Si riapre solo da chi ha la password. */

var DB_NOME = 'sicury-archivio';
var DB_VERSIONE = 1;
var dbAperto = null;

function db(){
  if (dbAperto) return Promise.resolve(dbAperto);
  if (!window.indexedDB) return Promise.reject(new Error('archivio file non disponibile'));
  return new Promise(function(ris, no){
    var r = indexedDB.open(DB_NOME, DB_VERSIONE);
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains('file')) d.createObjectStore('file', { keyPath:'id' });
    };
    r.onsuccess = function(){ dbAperto = r.result; ris(dbAperto); };
    r.onerror = function(){ no(r.error); };
  });
}
function conStore(modo, lavoro){
  return db().then(function(d){
    return new Promise(function(ris, no){
      var t = d.transaction('file', modo), st = t.objectStore('file'), esito;
      esito = lavoro(st);
      t.oncomplete = function(){ ris(esito && esito.result !== undefined ? esito.result : esito); };
      t.onerror = function(){ no(t.error); };
      t.onabort = function(){ no(t.error || new Error('operazione interrotta')); };
    });
  });
}

var LIMITE_FILE = 12 * 1024 * 1024;   // 12 MB a documento

function salvaFile(id, file){
  if (!CRITTOGRAFIA_DISPONIBILE) return Promise.reject(new Error('crittografia non disponibile'));
  if (file.size > LIMITE_FILE) return Promise.reject(new Error('file troppo grande'));
  return file.arrayBuffer().then(function(buf){
    return cifra(DEK, buf).then(function(pacco){
      return conStore('readwrite', function(st){
        return st.put({ id:id, iv:pacco.iv, dato:pacco.dato,
                        nome:file.name, tipo:file.type || 'application/octet-stream',
                        peso:file.size, quando:new Date().toISOString() });
      });
    });
  });
}
function leggiFile(id){
  return conStore('readonly', function(st){ return st.get(id); }).then(function(r){
    var rec = r && r.id ? r : (r && r.result);
    if (!rec) return null;
    return decifra(DEK, rec).then(function(buf){
      return { blob:new Blob([buf], { type:rec.tipo }), nome:rec.nome, tipo:rec.tipo, peso:rec.peso };
    });
  });
}
function eliminaFile(id){ return conStore('readwrite', function(st){ return st.delete(id); }); }
function pesoArchivioFile(){
  return conStore('readonly', function(st){ return st.getAll(); }).then(function(r){
    var tutti = Array.isArray(r) ? r : (r && r.result) || [];
    return tutti.reduce(function(n, x){ return n + (x.peso || 0); }, 0);
  }).catch(function(){ return 0; });
}

/* apre il file in una scheda nuova, o lo scarica se il browser non sa mostrarlo */
function apriFileSalvato(id){
  return leggiFile(id).then(function(f){
    if (!f) { apri('<h2>File non trovato</h2><p class="foglio__nota">Il documento non ha un file allegato, ' +
      'oppure e&rsquo; stato caricato su un altro dispositivo.</p>' +
      '<div class="azioni"><button class="b b--pri" id="ok">Chiudi</button></div>');
      document.getElementById('ok').onclick = chiudi; return; }
    var u = URL.createObjectURL(f.blob);
    var a = document.createElement('a');
    a.href = u; a.download = f.nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 20000);
  });
}

function pesoLeggibile(b){
  if (!b) return '';
  return b < 1024*1024 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1).replace('.', ',') + ' MB';
}

/* Al primissimo avvio nasce l'archivio dimostrativo con le sue utenze.
   Un archivio vecchio in chiaro viene cifrato e poi cancellato. */
function preparaPrimoAvvio(){
  if (!CRITTOGRAFIA_DISPONIBILE) return Promise.resolve();
  if (leggiUtenze().length) return Promise.resolve();

  var vecchio = null;
  try { vecchio = JSON.parse(localStorage.getItem(CHIAVE_VECCHIA)); } catch (e) {}
  var base = completa(vecchio && vecchio.turni ? vecchio : null);

  return chiaveNuova().then(function(dek){
    var conti = base.accessi.map(function(a){ return { email:a.email, pw:PASSWORD_INIZIALI[a.email] || null }; })
      .concat(base.dipendenti.map(function(d){ return { email:d.email, pw:PASSWORD_DIPENDENTE }; }))
      .filter(function(c){ return c.pw; });
    var catena = Promise.resolve();
    conti.forEach(function(c){
      catena = catena.then(function(){ return registraUtenza(c.email, c.pw, dek, false); });
    });
    return catena.then(function(){
      return cifraTesto(dek, JSON.stringify(base)).then(function(pacco){
        localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify({ v:3, iv:pacco.iv, dato:pacco.dato }));
        try { localStorage.removeItem(CHIAVE_VECCHIA); } catch (e) {}
      });
    });
  });
}

function applicaTema(t){
  if (t === 'auto') { document.documentElement.removeAttribute('data-tema'); }
  else { document.documentElement.setAttribute('data-tema', t); }
  try { localStorage.setItem(CHIAVE_TEMA, t); } catch (e) {}
  document.querySelectorAll('.tema button').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tema === t));
  });
  coloraBarraSistema();
}
/* la barra di sistema del telefono prende il colore dell'app */
function coloraBarraSistema(){
  var m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = getComputedStyle(document.body).backgroundColor || '#070D1E';
}
(function(){
  var t = 'auto';
  try { t = localStorage.getItem(CHIAVE_TEMA) || 'auto'; } catch (e) {}
  addEventListener('DOMContentLoaded', function(){
    applicaTema(t);
    document.querySelectorAll('.tema button').forEach(function(b){
      b.addEventListener('click', function(){ applicaTema(b.dataset.tema); });
    });
  });
  if (t !== 'auto') document.documentElement.setAttribute('data-tema', t);
})();

/* stato di un'abilitazione rispetto a oggi */
function statoAbil(scadenza){
  var g = giorniA(scadenza);
  if (g < 0)  return { cl:'all', et:'scaduta', g:g };
  if (g <= 60) return { cl:'att', et:'in scadenza', g:g };
  return { cl:'ok', et:'valida', g:g };
}

/* l'operatore puo' coprire questa mansione? */
function verifica(dipendente, mansioneId){
  var m = mansione(mansioneId);
  if (!dipendente.mansioni.includes(mansioneId)) {
    return { ok:false, motivo:'Non ha questa mansione fra quelle assegnate.' };
  }
  if (!m.abil) return { ok:true };
  var a = dipendente.abil.find(function(x){ return x.t === m.abil; });
  if (!a) return { ok:false, motivo:'Manca l\u2019abilitazione richiesta: ' + ABILITAZIONI[m.abil] + '.' };
  var s = statoAbil(a.s);
  if (s.g < 0) return { ok:false, motivo:ABILITAZIONI[m.abil] + ' scaduta da ' + Math.abs(s.g) + ' giorni.' };
  return { ok:true, avviso: s.g <= 60 ? ABILITAZIONI[m.abil] + ' scade fra ' + s.g + ' giorni.' : null };
}

/* distanza in metri fra due coordinate */
function distanza(a, b, c, d){
  var R = 6371000, p = Math.PI/180;
  var dl = (c-a)*p, dg = (d-b)*p;
  var x = Math.sin(dl/2)*Math.sin(dl/2) + Math.cos(a*p)*Math.cos(c*p)*Math.sin(dg/2)*Math.sin(dg/2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)));
}

var tentativi = {};   // rallenta chi prova a indovinare

function accedi(email, pw){
  var err = document.getElementById('l-err');
  function nega(testo){
    if (err) { err.hidden = false; err.innerHTML = testo; }
    return Promise.reject(new Error('accesso negato'));
  }
  if (!CRITTOGRAFIA_DISPONIBILE) return nega('<b>Crittografia non disponibile.</b> Apri il gestionale da un indirizzo https.');

  var e = String(email || '').toLowerCase();
  var t = tentativi[e] || { n:0, fino:0 };
  if (Date.now() < t.fino) {
    return nega('<b>Troppi tentativi.</b> Riprova fra ' + Math.ceil((t.fino - Date.now())/1000) + ' secondi.');
  }
  var u = utenzaDi(e);
  if (!u) return nega('<b>Accesso negato.</b> Email o password non corrispondono.');

  return chiaveDaPassword(pw, u.sale, u.giri)
    .then(function(kek){ return sfila(kek, u.busta); })
    .then(function(dek){
      DEK = dek; sbloccato = true;
      tentativi[e] = { n:0, fino:0 };
      return apriArchivio(dek);
    })
    .then(function(archivio){
      D = archivio;
      var rec = D.accessi.filter(function(x){ return x.email.toLowerCase() === e; })[0];
      var dd  = !rec && D.dipendenti.filter(function(x){ return x.email.toLowerCase() === e; })[0];
      if (!rec && !dd) { DEK = null; sbloccato = false; return nega('<b>Utenza non in archivio.</b> Avvisa l&rsquo;amministratore.'); }
      if (err) err.hidden = true;
      annota(e, 'accesso');
      entra(rec || dd, rec ? rec.ruolo : 'dipendente');
      if (u.cambia) setTimeout(function(){ fogliaCambiaPassword(true); }, 400);
    })
    .catch(function(x){
      if (x && x.message === 'accesso negato') throw x;
      DEK = null; sbloccato = false;
      t.n++; if (t.n >= 5) { t.fino = Date.now() + 30000; t.n = 0; }
      tentativi[e] = t;
      return nega('<b>Accesso negato.</b> Email o password non corrispondono.');
    });
}

/* Sotto l'icona ci sta una parola sola: queste sono le parole giuste.
   Se l'amministratore rinomina una voce, si usa la sua prima parola lunga. */
var ETICHETTE_BREVI = {
  cruscotto:'Cruscotto', pianifica:'Personale', fascicoli:'Fascicoli', turni:'Giornata',
  richieste:'Richieste', mierichieste:'Richieste', stampe:'Stampe', sicurezza:'Sicurezza',
  scadenze:'Scadenze', commesse:'Commesse', config:'Impostazioni', cedolini:'Buste paga',
  personalizza:'Personalizza', mieiturni:'Turni', profilo:'Profilo', miecedolini:'Buste paga'
};
function etichettaBreve(v){
  var difetto = VOCI_ADMIN.concat(VOCI_DIP).filter(function(x){ return x.id === v.id; })[0];
  // etichetta di serie: uso la parola scelta a mano
  if (!difetto || v.et === difetto.et) return ETICHETTE_BREVI[v.id] || v.et;
  // l'ha rinominata l'amministratore: tengo la sua, accorciata a una parola
  var suo = v.et.split(' ').filter(function(p){ return p.length > 3; })[0];
  return suo || v.et;
}

         (ICONE[id] || ICONE.altro) + '</svg>';
}

             '<span>'+esc(etichettaBreve(v))+'</span>' +

];
function icone(radice){
  radice.querySelectorAll('.blocco__testa h2').forEach(function(h){
    if (h.querySelector('.ic')) return;
    var t = h.textContent;
    for (var i = 0; i < ICONE_TESTATA.length; i++) {
      if (ICONE_TESTATA[i][0].test(t)) {
        h.insertAdjacentHTML('afterbegin', icona(ICONE_TESTATA[i][1], 'ic--testa'));
        return;
      }
    }
  });
}

/* ============ copia di sicurezza ============
   Senza un archivio centrale la copia la fa l'amministratore, quando vuole.
   Il file contiene tutto: schede, turni, documenti e buste paga, e resta
   cifrato con la stessa chiave dell'archivio. Si riapre solo da qui. */

/* La copia deve poter rinascere altrove: su un telefono nuovo, dopo un guasto,
   su un computer che non ha mai visto questo archivio. Per questo non si cifra
   con la chiave del dispositivo, ma con una parola che sceglie chi la fa. E si
   porta dentro anche le chiavi d'accesso, altrimenti al ripristino nessuno
   potrebbe piu' entrare. */

function fogliaEsporta(){
  apri('<h2>Scarica la copia di sicurezza</h2>' +
    '<p class="foglio__nota">La copia contiene tutto: schede, turni, documenti, buste paga e le ' +
      'utenze di accesso. Viene cifrata con una parola che scegli ora, e con quella si riapre ' +
      'su qualunque dispositivo.</p>' +
    '<label class="campo"><span>Parola di protezione della copia</span>' +
      '<input type="password" id="ex-pw" autocomplete="new-password"></label>' +
    '<label class="campo"><span>Ripetila</span>' +
      '<input type="password" id="ex-due" autocomplete="new-password"></label>' +
    '<div class="nota-riga">Annotala e conservala separatamente dal file. ' +
      'Senza quella parola la copia non si apre: non esiste un recupero.</div>' +
    '<div class="errore" id="ex-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--pri" id="ex-ok">Scarica la copia</button></div>');
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('ex-ok').onclick = function(){
    var pw = document.getElementById('ex-pw').value;
    var due = document.getElementById('ex-due').value;
    var err = document.getElementById('ex-err');
    if (pw.length < LUNGHEZZA_MINIMA) {
      err.hidden = false;
      err.innerHTML = '<b>Troppo corta.</b> Servono almeno ' + LUNGHEZZA_MINIMA + ' caratteri.'; return; }
    if (pw !== due) { err.hidden = false; err.innerHTML = '<b>Le due parole non coincidono.</b>'; return; }
    var b = document.getElementById('ex-ok');
    b.disabled = true; b.textContent = 'Preparo la copia\u2026';
    esportaArchivio(pw).then(chiudi, function(e){
      b.disabled = false; b.textContent = 'Scarica la copia';
      err.hidden = false; err.innerHTML = '<b>Copia non riuscita.</b> ' + esc(e.message || '');
    });
  };
}

function esportaArchivio(parola){
  var sale = b64(caso(16));
  return conStore('readonly', function(st){ return st.getAll(); }).catch(function(){ return []; })
    .then(function(r){
      var file = Array.isArray(r) ? r : (r && r.result) || [];
      return sub.exportKey('raw', DEK).then(function(chiaveGrezza){
        return { file:file, chiave:b64(chiaveGrezza) };
      });
    })
    .then(function(x){
      var pacchetto = {
        tipo:'sicury-copia', versione:4, quando:new Date().toISOString(), da:utente.email,
        chiave:x.chiave,        // la chiave d'archivio, per riaprire i file
        utenze:leggiUtenze(),   // le buste di accesso, altrimenti nessuno rientra
        dati:D, file:x.file
      };
      return chiaveDaPassword(parola, sale, GIRI_PBKDF2).then(function(k){
        return cifraTesto(k, JSON.stringify(pacchetto));
      });
    })
    .then(function(pacco){
      var nome = 'sicury-copia-' + oggiISO() + '.sicury';
      var fatto = scaricaFile(nome, JSON.stringify({
        tipo:'sicury-copia-cifrata', versione:4, sale:sale, giri:GIRI_PBKDF2,
        iv:pacco.iv, dato:pacco.dato
      }), 'application/octet-stream');
      if (!fatto) throw new Error('Il browser non ha permesso il salvataggio del file.');
      annota(utente.email, 'copia di sicurezza esportata');
      return salva();
    });
}

function fogliaRipristina(){
  apri('<h2>Ripristina da una copia</h2>' +
    '<div class="errore">Il ripristino <b>sostituisce tutto</b> l&rsquo;archivio di questo dispositivo, ' +
      'comprese le utenze di accesso. Scarica prima una copia di quello che c&rsquo;&egrave; adesso.</div>' +
    '<label class="campo"><span>File della copia</span>' +
      '<input type="file" id="rp-file" accept=".sicury,application/octet-stream"></label>' +
    '<label class="campo"><span>Parola di protezione della copia</span>' +
      '<input type="password" id="rp-pw" autocomplete="off"></label>' +
    '<p class="foglio__nota">Al termine si torna alla schermata di accesso: si rientra con le ' +
      'password che erano in uso quando la copia &egrave; stata fatta.</p>' +
    '<div class="errore" id="rp-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--all" id="rp-ok">Ripristina</button></div>');
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('rp-ok').onclick = function(){
    var f = document.getElementById('rp-file').files[0];
    var pw = document.getElementById('rp-pw').value;
    var err = document.getElementById('rp-err');
    if (!f)  { err.hidden = false; err.innerHTML = '<b>Scegli il file</b> della copia.'; return; }
    if (!pw) { err.hidden = false; err.innerHTML = '<b>Manca la parola</b> con cui &egrave; stata protetta.'; return; }
    var b = document.getElementById('rp-ok');
    b.disabled = true; b.textContent = 'Ripristino\u2026';

    f.text().then(function(t){ return JSON.parse(t); })
      .then(function(busta){
        if (busta.tipo !== 'sicury-copia-cifrata') throw new Error('Non sembra una copia di Sicury Turni.');
        return chiaveDaPassword(pw, busta.sale, busta.giri).then(function(k){
          return decifraTesto(k, busta);
        });
      })
      .then(function(t){
        var pacchetto = JSON.parse(t);
        if (pacchetto.tipo !== 'sicury-copia') throw new Error('Il contenuto non e\u0300 una copia valida.');
        // la chiave d'archivio torna quella della copia, insieme alle sue utenze
        return sub.importKey('raw', daB64(pacchetto.chiave), { name:'AES-GCM' }, true, ['encrypt','decrypt'])
          .then(function(dek){
            DEK = dek;
            scriviUtenze(pacchetto.utenze || []);
            D = completa(pacchetto.dati);
            var file = pacchetto.file || [];
            return conStore('readwrite', function(st){
              st.clear();
              file.forEach(function(x){ st.put(x); });
            }).catch(function(){}).then(function(){
              annota('ripristino', 'archivio ripristinato da copia', 'copia del ' + pacchetto.quando.slice(0,10));
              return salva();
            });
          });
      })
      .then(function(){
        chiudi();
        blocca('ripristino', '<b>Archivio ripristinato.</b> Entra con la password che usavi ' +
                             'quando &egrave; stata fatta la copia.');
      })
      .catch(function(e){
        b.disabled = false; b.textContent = 'Ripristina';
        err.hidden = false;
        err.innerHTML = '<b>Ripristino non riuscito.</b> ' +
          (/decrypt|operation|Cipher/i.test(e.message || '')
            ? 'La parola di protezione non apre questo file.'
            : esc(e.message || ''));
      });
  };
}

/* scarica davvero un file, senza passare da un server */
function scaricaFile(nome, testo, tipo){
  try {
    var b = new Blob(['\ufeff' + testo], { type:(tipo || 'text/csv') + ';charset=utf-8' });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
    return true;
  } catch (e) { return false; }
}
function csvRiga(celle){
  return celle.map(function(c){
    var v = String(c == null ? '' : c);
    return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(';');
}

/* --- i quattro documenti --- */

function giorniTra(dal, al){
  var g = [], d = new Date(dal + 'T00:00:00'), f = new Date(al + 'T00:00:00');
  while (d <= f) { g.push(isoDi(d)); d.setDate(d.getDate() + 1); }
  return g;
}
function oreTurno(t){
  var m = minuti(t.fine) <= minuti(t.inizio) ? minuti(t.fine) + 1440 : minuti(t.fine);
  return (m - minuti(t.inizio)) / 60;
}
function periodoEsteso(dal, al){ return 'dal ' + dataBreve(dal) + ' al ' + dataBreve(al); }

function docProspetto(dal, al, idLoc){
  var g = giorniTra(dal, al);
  var turni = D.turni.filter(function(t){
    return t.data >= dal && t.data <= al && (!idLoc || t.location === idLoc); });
  var persone = D.dipendenti.filter(function(d){
    return turni.some(function(t){ return t.dipendente === d.id; }); });

  function cella(idDip, giorno){
    var ts = turni.filter(function(t){ return t.data === giorno && t.dipendente === idDip; });
    if (!ts.length) return '';
    return ts.map(function(t){
      return t.inizio + '&ndash;' + t.fine + '<small>' + esc(loc(t.location).citta) + '</small>';
    }).join('');
  }
  var scoperti = g.map(function(giorno){
    var n = turni.filter(function(t){ return t.data === giorno && !t.dipendente; }).length;
    return '<td class="num">' + (n || '') + '</td>';
  }).join('');

  return cartaIntestata('Prospetto dei turni', periodoEsteso(dal, al) +
      (idLoc ? ' \u00b7 ' + loc(idLoc).nome + ' (' + loc(idLoc).citta + ')' : ' \u00b7 tutte le postazioni')) +
    '<table><thead><tr><th>Operatore</th>' +
      g.map(function(x){ var d = new Date(x + 'T00:00:00');
        return '<th>' + GIORNI[d.getDay()] + ' ' + d.getDate() + '</th>'; }).join('') +
      '<th>Ore</th></tr></thead><tbody>' +
    persone.map(function(d){
      var ore = turni.filter(function(t){ return t.dipendente === d.id; })
                     .reduce(function(n, t){ return n + oreTurno(t); }, 0);
      return '<tr><td><b>' + esc(d.nome) + '</b><small>' +
             d.mansioni.map(function(m){ return mansione(m).nome; }).join(', ') + '</small></td>' +
             g.map(function(x){ return '<td>' + cella(d.id, x) + '</td>'; }).join('') +
             '<td class="num">' + ore.toFixed(1).replace('.', ',') + '</td></tr>';
    }).join('') +
    '<tr class="totali"><td>Da assegnare</td>' + scoperti + '<td class="num">&mdash;</td></tr>' +
    '</tbody></table>' +
    (persone.length ? '' : '<p class="nulla">Nessun turno assegnato nel periodo scelto.</p>');
}

function docPresenze(dal, al, idDip){
  var persone = idDip ? [dip(idDip)] : D.dipendenti;
  return cartaIntestata('Foglio presenze', periodoEsteso(dal, al)) +
    persone.map(function(d, i){
      var ts = D.turni.filter(function(t){
        return t.dipendente === d.id && t.data >= dal && t.data <= al; })
        .sort(function(a, b){ return a.data.localeCompare(b.data) || a.inizio.localeCompare(b.inizio); });
      var timbrati = ts.filter(function(t){ return t.conferma; });
      var ore = ts.reduce(function(n, t){ return n + oreTurno(t); }, 0);
      var ass = assenzeDi(d.id).filter(function(a){ return a.al >= dal && a.dal <= al; });

      return '<div class="sezione' + (i ? ' nuova-pagina' : '') + '">' +
