function docOre(dal, al){
  var sett = Math.max(1, Math.round(giorniTra(dal, al).length / 7));
  var righe = D.dipendenti.map(function(d){
    var ts = D.turni.filter(function(t){ return t.dipendente === d.id && t.data >= dal && t.data <= al; });
    var ore = ts.reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var notte = ts.filter(function(t){ return minuti(t.inizio) >= 22*60 || minuti(t.inizio) < 6*60; })
                  .reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var festivo = ts.filter(function(t){ var g = new Date(t.data + 'T00:00:00').getDay(); return g === 0 || g === 6; })
                    .reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var contr = Number(d.contratto && d.contratto.ore) || 0;
    var previste = contr * sett;
    var gassenza = assenzeDi(d.id).filter(function(a){ return a.al >= dal && a.dal <= al; })
                                  .reduce(function(n, a){ return n + giorniAssenza(a); }, 0);
    return { d:d, turni:ts.length, ore:ore, notte:notte, festivo:festivo,
             contr:contr, previste:previste, diff:ore - previste, assenza:gassenza };
  });
  var tot = righe.reduce(function(a, r){
    a.turni += r.turni; a.ore += r.ore; a.notte += r.notte; a.festivo += r.festivo; a.assenza += r.assenza; return a;
  }, { turni:0, ore:0, notte:0, festivo:0, assenza:0 });
  function h(x){ return x.toFixed(1).replace('.', ','); }

  return cartaIntestata('Riepilogo ore', periodoEsteso(dal, al) + ' \u00b7 ' + sett +
      (sett === 1 ? ' settimana' : ' settimane')) +
    '<table><thead><tr><th>Operatore</th><th>Contratto</th><th>Turni</th><th>Ore svolte</th>' +
      '<th>di cui notturne</th><th>di cui festive</th><th>Ore previste</th><th>Differenza</th>' +
      '<th>Giorni assenza</th></tr></thead><tbody>' +
    righe.map(function(r){
      return '<tr><td><b>' + esc(r.d.nome) + '</b><small>' +
               esc((r.d.contratto && r.d.contratto.tipo) || '') + '</small></td>' +
             '<td class="num">' + (r.contr ? r.contr + ' h' : '&mdash;') + '</td>' +
             '<td class="num">' + r.turni + '</td>' +
             '<td class="num">' + h(r.ore) + '</td>' +
             '<td class="num">' + h(r.notte) + '</td>' +
             '<td class="num">' + h(r.festivo) + '</td>' +
             '<td class="num">' + (r.previste ? h(r.previste) : '&mdash;') + '</td>' +
             '<td class="num' + (r.previste && r.diff > 0 ? ' fuori' : '') + '">' +
               (r.previste ? (r.diff > 0 ? '+' : '') + h(r.diff) : '&mdash;') + '</td>' +
             '<td class="num">' + (r.assenza || '') + '</td></tr>';
    }).join('') +
    '<tr class="totali"><td>Totale</td><td class="num">&mdash;</td><td class="num">' + tot.turni + '</td>' +
      '<td class="num">' + h(tot.ore) + '</td><td class="num">' + h(tot.notte) + '</td>' +
      '<td class="num">' + h(tot.festivo) + '</td><td class="num">&mdash;</td><td class="num">&mdash;</td>' +
      '<td class="num">' + (tot.assenza || '') + '</td></tr>' +
    '</tbody></table>' +
    '<p class="nulla">Le ore notturne sono quelle dei turni che iniziano fra le 22:00 e le 06:00. ' +
    'Le ore previste sono il monte settimanale del contratto moltiplicato per le settimane del periodo.</p>';
}

function docScadenze(){
  var ab = [];
  D.dipendenti.forEach(function(d){
    d.abil.forEach(function(a){ ab.push({ d:d, a:a, s:statoAbil(a.s) }); });
  });
  ab.sort(function(x, y){ return x.s.g - y.s.g; });
  var contratti = D.dipendenti.filter(function(d){ return d.contratto && d.contratto.scadenza; })
                              .sort(function(a, b){ return a.contratto.scadenza.localeCompare(b.contratto.scadenza); });
  var doc = D.documenti.filter(function(x){ return x.scadenza; })
                       .sort(function(a, b){ return a.scadenza.localeCompare(b.scadenza); });

  return cartaIntestata('Scadenzario', 'situazione al ' + dataBreve(oggiISO())) +
    '<h2>Abilitazioni</h2>' +
    (ab.length
      ? '<table><thead><tr><th>Operatore</th><th>Abilitazione</th><th>Scadenza</th><th>Stato</th></tr></thead><tbody>' +
        ab.map(function(x){
          return '<tr><td><b>' + esc(x.d.nome) + '</b></td><td>' + ABILITAZIONI[x.a.t] + '</td>' +
                 '<td class="num">' + dataBreve(x.a.s) + '</td>' +
                 '<td' + (x.s.cl === 'all' ? ' class="fuori"' : '') + '>' + x.s.et + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="nulla">Nessuna abilitazione registrata.</p>') +
    '<h2>Contratti a termine</h2>' +
    (contratti.length
      ? '<table><thead><tr><th>Operatore</th><th>Tipo</th><th>Assunzione</th><th>Scadenza</th><th>Mancano</th></tr></thead><tbody>' +
        contratti.map(function(d){
          var g = giorniA(d.contratto.scadenza);
          return '<tr><td><b>' + esc(d.nome) + '</b></td><td>' + esc(d.contratto.tipo) + '</td>' +
                 '<td class="num">' + (d.contratto.assunzione ? dataBreve(d.contratto.assunzione) : '&mdash;') + '</td>' +
                 '<td class="num">' + dataBreve(d.contratto.scadenza) + '</td>' +
                 '<td class="num' + (g < 30 ? ' fuori' : '') + '">' +
                   (g < 0 ? 'scaduto da ' + Math.abs(g) + ' gg' : g + ' giorni') + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="nulla">Nessun contratto a termine.</p>') +
    '<h2>Documenti con scadenza</h2>' +
    (doc.length
      ? '<table><thead><tr><th>Operatore</th><th>Documento</th><th>Tipo</th><th>Scadenza</th></tr></thead><tbody>' +
        doc.map(function(x){
          var d = dip(x.dipendente);
          return '<tr><td><b>' + esc(d ? d.nome : '&mdash;') + '</b></td><td>' + esc(x.nome) + '</td>' +
                 '<td>' + esc(x.tipo) + '</td><td class="num">' + dataBreve(x.scadenza) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="nulla">Nessun documento con scadenza caricato.</p>');
}

/* --- gli stessi dati in CSV --- */
function csvProspetto(dal, al, idLoc){
  var g = giorniTra(dal, al);
  var out = [csvRiga(['Operatore'].concat(g.map(dataBreve)).concat(['Ore totali']))];
  D.dipendenti.forEach(function(d){
    var ore = 0;
    var celle = g.map(function(x){
      var ts = D.turni.filter(function(t){
        return t.data === x && t.dipendente === d.id && (!idLoc || t.location === idLoc); });
      ts.forEach(function(t){ ore += oreTurno(t); });
      return ts.map(function(t){ return t.inizio + '-' + t.fine + ' ' + loc(t.location).citta; }).join(' + ');
    });
    out.push(csvRiga([d.nome].concat(celle).concat([ore.toFixed(1).replace('.', ',')])));
  });
  return out.join('\n');
}
function csvPresenze(dal, al, idDip){
  var out = [csvRiga(['Operatore','Giorno','Inizio','Fine','Ore','Postazione','Citta','Mansione','Ora timbratura','Distanza m','Esito'])];
  D.turni.filter(function(t){
    return t.dipendente && t.data >= dal && t.data <= al && (!idDip || t.dipendente === idDip); })
    .sort(function(a, b){ return a.data.localeCompare(b.data); })
    .forEach(function(t){
      var c = t.conferma, l = loc(t.location);
      out.push(csvRiga([dip(t.dipendente).nome, t.data, t.inizio, t.fine,
        oreTurno(t).toFixed(1).replace('.', ','), l.nome, l.citta, mansione(t.mansione).nome,
        c ? c.ora : '', c && c.distanza != null ? c.distanza : '',
        c ? (c.senzaPosizione || c.distanza == null ? 'senza posizione'
                                                    : (c.fuoriArea ? 'fuori area' : 'in area'))
          : 'non timbrato']));
    });
  return out.join('\n');
}
function csvOre(dal, al){
  var sett = Math.max(1, Math.round(giorniTra(dal, al).length / 7));
  var out = [csvRiga(['Operatore','Codice fiscale','Contratto','Ore contratto','Turni','Ore svolte','Ore notturne','Ore festive','Ore previste','Differenza','Giorni assenza'])];
  D.dipendenti.forEach(function(d){
    var ts = D.turni.filter(function(t){ return t.dipendente === d.id && t.data >= dal && t.data <= al; });
    var ore = ts.reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var notte = ts.filter(function(t){ return minuti(t.inizio) >= 22*60 || minuti(t.inizio) < 6*60; })
                  .reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var fest = ts.filter(function(t){ var g = new Date(t.data+'T00:00:00').getDay(); return g===0||g===6; })
                 .reduce(function(n, t){ return n + oreTurno(t); }, 0);
    var contr = Number(d.contratto && d.contratto.ore) || 0;
    var ass = assenzeDi(d.id).filter(function(a){ return a.al >= dal && a.dal <= al; })
                             .reduce(function(n, a){ return n + giorniAssenza(a); }, 0);
    function h(x){ return x.toFixed(1).replace('.', ','); }
    out.push(csvRiga([d.nome, d.cf || '', (d.contratto && d.contratto.tipo) || '', contr || '',
      ts.length, h(ore), h(notte), h(fest), contr ? h(contr*sett) : '',
      contr ? h(ore - contr*sett) : '', ass || '']));
  });
  return out.join('\n');
}
function csvScadenze(){
  var out = [csvRiga(['Operatore','Voce','Tipo','Scadenza','Giorni mancanti'])];
  D.dipendenti.forEach(function(d){
    d.abil.forEach(function(a){
      out.push(csvRiga([d.nome, ABILITAZIONI[a.t], 'abilitazione', a.s, giorniA(a.s)]));
    });
    if (d.contratto && d.contratto.scadenza)
      out.push(csvRiga([d.nome, d.contratto.tipo, 'contratto', d.contratto.scadenza, giorniA(d.contratto.scadenza)]));
  });
  D.documenti.filter(function(x){ return x.scadenza; }).forEach(function(x){
    var d = dip(x.dipendente);
    out.push(csvRiga([d ? d.nome : '', x.nome, x.tipo, x.scadenza, giorniA(x.scadenza)]));
  });
  return out.join('\n');
}

var stampeState = { doc:'prospetto', dal:null, al:null, loc:'', dipendente:'' };

  { id:'presenze',  nome:'Foglio presenze',
    desc:'Per ciascun operatore i turni del periodo con l&rsquo;ora della timbratura, la distanza rilevata e l&rsquo;esito, piu&grave; le assenze. Una pagina a testa.' },
  { id:'ore',       nome:'Riepilogo ore',
    desc:'Ore svolte, di cui notturne e festive, confrontate con il monte ore del contratto. &Egrave; il foglio da passare al commercialista.' },
  { id:'scadenze',  nome:'Scadenzario',
    desc:'Abilitazioni, contratti a termine e documenti con scadenza, ordinati per urgenza.' }
];

function primoDelMese(){ var d = new Date(); return isoDi(new Date(d.getFullYear(), d.getMonth(), 1)); }
function ultimoDelMese(){ var d = new Date(); return isoDi(new Date(d.getFullYear(), d.getMonth()+1, 0)); }

VISTE.stampe = function(){
  intesta('Stampe ed esportazioni', 'Documenti su carta intestata, pronti da stampare o da salvare in PDF, e gli stessi dati in foglio di calcolo');
  if (!stampeState.dal) { stampeState.dal = primoDelMese(); stampeState.al = ultimoDelMese(); }
  var st = stampeState;
  var conPeriodo = st.doc !== 'scadenze';

  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Quale documento</h2></div>' +
      '<div class="scelte">' + DOCUMENTI.map(function(x){
        return '<button class="scelta' + (st.doc === x.id ? ' scelta--on' : '') + '" data-doc="' + x.id + '">' +
               '<b>' + esc(x.nome) + '</b><small>' + x.desc + '</small></button>';
      }).join('') + '</div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Periodo e filtri</h2>' +
      (conPeriodo ? '<div class="rapidi">' +
        '<button class="b b--sec b--min" data-rapido="mese">Questo mese</button>' +
        '<button class="b b--sec b--min" data-rapido="scorso">Mese scorso</button>' +
        '<button class="b b--sec b--min" data-rapido="settimana">Questa settimana</button>' +
      '</div>' : '') + '</div>' +
      '<div class="modulo">' +
        (conPeriodo
          ? '<div class="duecol">' +
              '<label class="campo"><span>Dal</span><input type="date" id="s-dal" value="' + st.dal + '"></label>' +
              '<label class="campo"><span>Al</span><input type="date" id="s-al" value="' + st.al + '"></label>' +
            '</div>'
          : '<p class="vuoto">Lo scadenzario fotografa la situazione di oggi: non serve scegliere un periodo.</p>') +
        (st.doc === 'prospetto'
          ? '<label class="campo"><span>Postazione</span><select id="s-loc">' +
            '<option value="">Tutte le postazioni</option>' +
            D.location.map(function(l){
              return '<option value="' + l.id + '"' + (st.loc === l.id ? ' selected' : '') + '>' +
                     esc(l.nome) + ' &middot; ' + esc(l.citta) + '</option>'; }).join('') +
            '</select></label>' : '') +
        (st.doc === 'presenze'
          ? '<label class="campo"><span>Operatore</span><select id="s-dip">' +
            '<option value="">Tutti gli operatori</option>' +
            D.dipendenti.map(function(d){
              return '<option value="' + d.id + '"' + (st.dipendente === d.id ? ' selected' : '') + '>' +
                     esc(d.nome) + '</option>'; }).join('') +
            '</select></label>' : '') +
      '</div>' +
      '<div class="modulo__az">' +
        '<button class="b b--pri" id="s-stampa">' + icona('cedolini') + 'Stampa o salva in PDF</button>' +
        '<button class="b b--sec" id="s-csv">Scarica foglio di calcolo</button>' +
        '<button class="b b--sec" id="s-vedi">Anteprima</button>' +
      '</div>' +
    '</div>' +

    '<div class="blocco" id="s-box" hidden><div class="blocco__testa"><h2>Anteprima</h2>' +
      '<button class="b b--sec b--min" id="s-chiudi">Chiudi</button></div>' +
      '<div class="anteprima" id="s-ante"></div></div>'
  );

  function leggi(){
    var a = document.getElementById('s-dal'), b = document.getElementById('s-al');
    if (a) st.dal = a.value; if (b) st.al = b.value;
    var l = document.getElementById('s-loc'); st.loc = l ? l.value : '';
    var p = document.getElementById('s-dip'); st.dipendente = p ? p.value : '';
  }
  function html(){
    leggi();
    if (st.doc === 'prospetto') return docProspetto(st.dal, st.al, st.loc);
    if (st.doc === 'presenze')  return docPresenze(st.dal, st.al, st.dipendente);
    if (st.doc === 'ore')       return docOre(st.dal, st.al);
    return docScadenze();
  }
  function csv(){
    leggi();
    if (st.doc === 'prospetto') return { n:'prospetto-turni', t:csvProspetto(st.dal, st.al, st.loc) };
    if (st.doc === 'presenze')  return { n:'foglio-presenze', t:csvPresenze(st.dal, st.al, st.dipendente) };
    if (st.doc === 'ore')       return { n:'riepilogo-ore',   t:csvOre(st.dal, st.al) };
    return { n:'scadenzario', t:csvScadenze() };
  }

  document.querySelectorAll('[data-doc]').forEach(function(b){
    b.onclick = function(){ leggi(); st.doc = b.dataset.doc; VISTE.stampe(); };
  });
  document.querySelectorAll('[data-rapido]').forEach(function(b){
    b.onclick = function(){
      var d = new Date();
      if (b.dataset.rapido === 'mese')     { st.dal = primoDelMese(); st.al = ultimoDelMese(); }
      if (b.dataset.rapido === 'scorso')   { st.dal = isoDi(new Date(d.getFullYear(), d.getMonth()-1, 1));
                                             st.al  = isoDi(new Date(d.getFullYear(), d.getMonth(), 0)); }
      if (b.dataset.rapido === 'settimana'){ var l = lunediDi(d); st.dal = isoDi(l);
                                             var f = new Date(l); f.setDate(f.getDate()+6); st.al = isoDi(f); }
      VISTE.stampe();
    };
  });
  document.getElementById('s-stampa').onclick = function(){ stampaDocumento(html()); };
  document.getElementById('s-vedi').onclick = function(){
    var box = document.getElementById('s-box');
    document.getElementById('s-ante').innerHTML = html();
    box.hidden = false; box.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  document.getElementById('s-chiudi').onclick = function(){ document.getElementById('s-box').hidden = true; };
  document.getElementById('s-csv').onclick = function(){
    var c = csv();
    var nome = c.n + '-' + (st.doc === 'scadenze' ? oggiISO() : st.dal + '_' + st.al) + '.csv';
    if (!scaricaFile(nome, c.t)) {
      apri('<h2>Foglio di calcolo</h2>' +
        '<p class="foglio__nota">Il salvataggio diretto non &egrave; disponibile qui: seleziona e copia.</p>' +
        '<textarea class="csv" readonly>' + esc(c.t) + '</textarea>' +
        '<div class="azioni"><button class="b b--pri" id="ok">Chiudi</button></div>');
      foglio.querySelector('.csv').select();
      document.getElementById('ok').onclick = chiudi;
    }
  };
  agganciaAzioni();
};

/* ============ notifiche ============
   Una campanella in testata con quello che riguarda chi sta guardando:
   all'amministratore le richieste e le scadenze, al dipendente i suoi turni,
   le risposte alle richieste e le buste paga nuove. */

function notifiche(){
  var n = [];
  function agg(gr, tit, det, vai){ n.push({ gr:gr, tit:tit, det:det, vai:vai }); }

  if (utente.admin) {
    richiesteInAttesa().forEach(function(r){
      var d = dip(r.dipendente);
      agg('att', r.tipo + ' da esaminare',
        (d ? d.nome : 'Operatore') + ': dal ' + dataBreve(r.dal) + ' al ' + dataBreve(r.al) + '.',
        { tipo:'vista', id:'richieste' });
    });
    scadenzeAperte().filter(function(x){ return x.s.g <= 30; }).forEach(function(x){
      agg(x.s.cl, ABILITAZIONI[x.a.t] + (x.s.g < 0 ? ' scaduta' : ' in scadenza'),
        x.d.nome + ': ' + (x.s.g < 0 ? 'scaduta da ' + Math.abs(x.s.g) + ' giorni' : 'scade fra ' + x.s.g + ' giorni') + '.',
        { tipo:'fascicolo', id:x.d.id });
    });
    D.dipendenti.forEach(function(d){
      var sc = d.contratto && d.contratto.scadenza;
      if (sc && giorniA(sc) >= 0 && giorniA(sc) <= 30)
        agg('att', 'Contratto in scadenza',
          d.nome + ': scade il ' + dataBreve(sc) + '.', { tipo:'fascicolo', id:d.id });
    });
    var oggiScoperti = D.turni.filter(function(t){ return t.data === oggiISO() && !t.dipendente; }).length;
    if (oggiScoperti) agg('all', 'Turni scoperti oggi',
      oggiScoperti + (oggiScoperti === 1 ? ' turno di oggi non ha operatore.' : ' turni di oggi non hanno operatore.'),
      { tipo:'vista', id:'turni' });
  } else {
    D.turni.filter(function(t){ return t.dipendente === utente.id && giorniA(t.data) === 0 && !t.conferma; })
      .forEach(function(t){
        agg('att', 'Turno di oggi da timbrare',
          mansione(t.mansione).nome + ' a ' + nomeLoc(t.location) + ', ' + t.inizio + '\u2013' + t.fine + '.',
          { tipo:'vista', id:'mieiturni' });
      });
    D.turni.filter(function(t){ return t.dipendente === utente.id && giorniA(t.data) === 1; })
      .forEach(function(t){
        agg('ok', 'Domani sei in servizio',
          mansione(t.mansione).nome + ' a ' + nomeLoc(t.location) + ', ' + t.inizio + '\u2013' + t.fine + '.',
          { tipo:'vista', id:'mieiturni' });
      });
    richiesteDi(utente.id).filter(function(r){ return r.stato !== 'in attesa' && r.decisoIl && giorniA(r.decisoIl) > -30; })
      .forEach(function(r){
        agg(r.stato === 'approvata' ? 'ok' : 'all', r.tipo + ' ' + r.stato,
          'Dal ' + dataBreve(r.dal) + ' al ' + dataBreve(r.al) + ', deciso da ' + r.deciso + '.',
          { tipo:'vista', id:'mierichieste' });
      });
    D.cedolini.filter(function(p){ return p.dipendente === utente.id && !p.letto; })
      .forEach(function(p){
        agg('att', 'Busta paga da scaricare', mesePerEsteso(p.mese) + '.', { tipo:'vista', id:'miecedolini' });
      });
    utente.abil.map(function(a){ return { a:a, s:statoAbil(a.s) }; })
      .filter(function(x){ return x.s.g <= 60; })
      .forEach(function(x){
        agg(x.s.cl, ABILITAZIONI[x.a.t] + (x.s.g < 0 ? ' scaduta' : ' in scadenza'),
          x.s.g < 0 ? 'Scaduta da ' + Math.abs(x.s.g) + ' giorni: avvisa il coordinatore.'
                    : 'Scade fra ' + x.s.g + ' giorni, il ' + dataBreve(x.a.s) + '.',
          { tipo:'vista', id:'profilo' });
      });
  }

  var ordine = { all:0, att:1, ok:2 };
  return n.sort(function(a, b){ return ordine[a.gr] - ordine[b.gr]; });
}

function aggiornaCampanella(){
  var b = document.getElementById('campana');
  if (!b || !utente) return;
  var n = notifiche();
  var gravi = n.filter(function(x){ return x.gr !== 'ok'; }).length;
  b.innerHTML = icona('avviso') + '<span class="campana__n' + (gravi ? '' : ' campana__n--vuota') + '">' +
                (gravi || '') + '</span>';
  b.setAttribute('aria-label', gravi ? gravi + ' avvisi da leggere' : 'Nessun avviso');
}

/* ============ richieste di assenza ============
   Il dipendente chiede dal telefono, l'amministratore approva o respinge.
   Una richiesta approvata diventa un'assenza nel fascicolo, senza ricopiature. */

var TIPI_RICHIESTA = ['Ferie', 'Permesso', 'Congedo parentale', 'Recupero ore'];

function richiesteDi(idDip){
  return D.richieste.filter(function(r){ return r.dipendente === idDip; })
                    .sort(function(a,b){ return b.dal.localeCompare(a.dal); });
}
function richiesteInAttesa(){
  return D.richieste.filter(function(r){ return r.stato === 'in attesa'; })
                    .sort(function(a,b){ return a.dal.localeCompare(b.dal); });
}

function fogliaRichiesta(){
  apri(
    '<h2>Chiedi un periodo di assenza</h2>' +
    '<p class="foglio__nota">La richiesta arriva al coordinatore, che la approva o la respinge. ' +
      'Finch&eacute; non &egrave; approvata i turni restano assegnati.</p>' +
    '<label class="campo"><span>Motivo</span><select id="rq-tipo">' +
      TIPI_RICHIESTA.map(function(t){ return '<option>' + t + '</option>'; }).join('') + '</select></label>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Dal</span><input type="date" id="rq-dal" value="' + oggiISO() + '"></label>' +
      '<label class="campo"><span>Al</span><input type="date" id="rq-al" value="' + oggiISO() + '"></label>' +
    '</div>' +
    '<label class="campo"><span>Motivazione</span><textarea id="rq-nota" rows="2" placeholder="Facoltativa, aiuta chi deve decidere"></textarea></label>' +
    '<div id="rq-avviso"></div>' +
    '<div class="errore" id="rq-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--pri" id="sal">Invia la richiesta</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;

  function controlla(){
    var dal = document.getElementById('rq-dal').value, al = document.getElementById('rq-al').value;
    var box = document.getElementById('rq-avviso');
    if (!dal || !al || al < dal) { box.innerHTML = ''; return; }
    var n = D.turni.filter(function(t){
      return t.dipendente === utente.id && t.data >= dal && t.data <= al; }).length;
    box.innerHTML = n
      ? '<div class="nota-riga">In quel periodo hai <b>' + n + (n === 1 ? ' turno assegnato' : ' turni assegnati') +
        '</b>: andranno riassegnati.</div>'
      : '<div class="nota-riga nota-riga--ok">In quel periodo non hai turni assegnati.</div>';
  }
  document.getElementById('rq-dal').oninput = controlla;
  document.getElementById('rq-al').oninput = controlla;
  controlla();

  document.getElementById('sal').onclick = function(){
    var dal = document.getElementById('rq-dal').value, al = document.getElementById('rq-al').value;
    var err = document.getElementById('rq-err');
    if (!dal || !al) { err.hidden = false; err.innerHTML = '<b>Mancano le date.</b> Servono inizio e fine.'; return; }
    if (al < dal)    { err.hidden = false; err.innerHTML = '<b>Date invertite.</b> La fine precede l&rsquo;inizio.'; return; }
    if (D.richieste.some(function(r){
          return r.dipendente === utente.id && r.stato === 'in attesa' && r.dal <= al && r.al >= dal; })) {
      err.hidden = false; err.innerHTML = '<b>Richiesta gi&agrave; in attesa</b> per un periodo che si sovrappone.'; return; }
    D.richieste.push({ id:'r' + Date.now().toString(36), dipendente:utente.id,
      tipo:document.getElementById('rq-tipo').value, dal:dal, al:al,
      nota:document.getElementById('rq-nota').value.trim(),
      stato:'in attesa', chiesto:oggiISO(), deciso:null, decisoIl:null });
    salva(); chiudi(); vaiA('mieiturni');
  };
}

function fogliaDecisione(idRich){
  var r = D.richieste.filter(function(x){ return x.id === idRich; })[0];
  var d = dip(r.dipendente);
  var turni = D.turni.filter(function(t){ return t.dipendente === r.dipendente && t.data >= r.dal && t.data <= r.al; });
  var gg = Math.round((new Date(r.al + 'T00:00:00') - new Date(r.dal + 'T00:00:00')) / 86400000) + 1;

  apri(
    '<h2>' + esc(r.tipo) + ' &middot; ' + esc(d.nome) + '</h2>' +
    '<p class="foglio__nota">Richiesta del ' + dataBreve(r.chiesto) + '</p>' +
    '<div class="dati">' +
      '<div><span>Periodo</span><b>dal ' + dataBreve(r.dal) + ' al ' + dataBreve(r.al) + '</b></div>' +
      '<div><span>Giorni</span><b>' + gg + '</b></div>' +
      '<div><span>Turni gi&agrave; assegnati</span><b>' + turni.length + '</b></div>' +
      (r.nota ? '<div><span>Motivazione</span><b>' + esc(r.nota) + '</b></div>' : '') +
    '</div>' +
    (turni.length
      ? '<div class="errore">Approvando, i <b>' + turni.length + ' turni</b> di quel periodo tornano scoperti ' +
        'e vanno riassegnati dal prospetto.</div>'
      : '') +
    '<div class="azioni"><button class="b b--sec" id="annulla">Chiudi</button>' +
    '<button class="b b--all" id="respingi">Respingi</button>' +
    '<button class="b b--pri" id="approva">Approva</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;

  function decidi(stato){
    r.stato = stato; r.deciso = utente.nome; r.decisoIl = oggiISO();
    if (stato === 'approvata') {
      D.assenze.push({ id:'as' + Date.now().toString(36), dipendente:r.dipendente,
        tipo:r.tipo, dal:r.dal, al:r.al,
        nota:'Richiesta approvata da ' + utente.nome + ' il ' + dataBreve(oggiISO()) + (r.nota ? '. ' + r.nota : '') });
      // i turni di quel periodo tornano scoperti: la pianificazione resta visibile
      D.turni.forEach(function(t){
        if (t.dipendente === r.dipendente && t.data >= r.dal && t.data <= r.al && !t.conferma) t.dipendente = null;
      });
    }
    salva(); chiudi(); vaiA(VISTE[vistaAttuale] ? vistaAttuale : 'richieste');
  }
  document.getElementById('approva').onclick  = function(){ decidi('approvata'); };
  document.getElementById('respingi').onclick = function(){ decidi('respinta'); };
}

function pastigliaStato(s){
  var cl = s === 'approvata' ? 'ok' : (s === 'respinta' ? 'all' : 'att');
  return '<span class="p p--' + cl + '">' + s + '</span>';
}

VISTE.richieste = function(){
  intesta('Richieste di assenza', 'Ferie, permessi e recuperi chiesti dagli operatori');
  var attesa = richiesteInAttesa();
  var decise = D.richieste.filter(function(r){ return r.stato !== 'in attesa'; })
                          .sort(function(a,b){ return (b.decisoIl||'').localeCompare(a.decisoIl||''); });

  function riga(r, conAzione){
    var d = dip(r.dipendente);
    var gg = Math.round((new Date(r.al+'T00:00:00') - new Date(r.dal+'T00:00:00'))/86400000) + 1;
    var turni = D.turni.filter(function(t){ return t.dipendente===r.dipendente && t.data>=r.dal && t.data<=r.al; }).length;
    return '<tr><td><div class="persona">' + avatar(d ? d.nome : '?') + '<div><b>' + esc(d ? d.nome : 'non in archivio') +
             '</b><small>' + esc(r.tipo) + '</small></div></div></td>' +
           '<td class="num">' + dataBreve(r.dal) + '</td><td class="num">' + dataBreve(r.al) + '</td>' +
           '<td class="num">' + gg + '</td>' +
           '<td>' + (turni ? '<span class="p p--att">' + turni + ' da riassegnare</span>' : '<span class="p p--ok">nessuno</span>') + '</td>' +
           '<td>' + (conAzione ? pastigliaStato(r.stato) : pastigliaStato(r.stato) +
             (r.deciso ? '<small>' + esc(r.deciso) + '</small>' : '')) + '</td>' +
           '<td>' + (conAzione ? '<button class="b b--pri b--min" data-decidi="' + r.id + '">Esamina</button>' : '') + '</td></tr>';
  }

  dipingi(
    '<div class="blocco blocco--' + (attesa.length ? 'att' : 'ok') + '"><div class="blocco__testa"><h2>In attesa di risposta</h2>' +
      '<span class="p p--' + (attesa.length ? 'att' : 'ok') + '">' + attesa.length + '</span></div>' +
      (attesa.length
        ? '<div class="tabellone"><table><thead><tr><th>Operatore</th><th>Dal</th><th>Al</th><th>Giorni</th><th>Turni</th><th>Stato</th><th></th></tr></thead><tbody>' +
          attesa.map(function(r){ return riga(r, true); }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessuna richiesta da esaminare.</p>') + '</div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Gi&agrave; decise</h2></div>' +
      (decise.length
        ? '<div class="tabellone"><table><thead><tr><th>Operatore</th><th>Dal</th><th>Al</th><th>Giorni</th><th>Turni</th><th>Esito</th><th></th></tr></thead><tbody>' +
          decise.map(function(r){ return riga(r, false); }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessuna richiesta decisa finora.</p>') + '</div>'
  );
  agganciaAzioni();
};

   coprono la mansione, riposi troppo corti, ore oltre contratto. */

var RIPOSO_MINIMO_H = 11;   // riposo fra due turni, art. 7 d.lgs. 66/2003

function finePresunta(t){
  // un turno che finisce prima di quando inizia scavalca la mezzanotte
  var g = new Date(t.data + 'T00:00:00');
  var m = minuti(t.fine) <= minuti(t.inizio) ? minuti(t.fine) + 1440 : minuti(t.fine);
  return g.getTime() + m * 60000;
}
function inizioAssoluto(t){
  return new Date(t.data + 'T00:00:00').getTime() + minuti(t.inizio) * 60000;
}

function controlli(){
  var r = [];
  function segna(gr, tit, det, vai){ r.push({ gr:gr, tit:tit, det:det, vai:vai }); }

  // 1. turni assegnati a chi risulta assente, raggruppati per persona e periodo
  var perAssenza = {};
  D.turni.forEach(function(t){
    if (!t.dipendente || giorniA(t.data) < 0) return;
    var a = assenzeDi(t.dipendente).filter(function(x){ return t.data >= x.dal && t.data <= x.al; })[0];
    if (!a) return;
    (perAssenza[a.id] = perAssenza[a.id] || { a:a, turni:[] }).turni.push(t);
  });
  Object.keys(perAssenza).forEach(function(k){
    var g = perAssenza[k], n = g.turni.length;
    segna('all', 'Turni su un periodo di assenza',
      dip(g.a.dipendente).nome + ': ' + g.a.tipo.toLowerCase() + ' dal ' + dataBreve(g.a.dal) +
      ' al ' + dataBreve(g.a.al) + ', ma ha ' + (n === 1 ? 'un turno assegnato' : n + ' turni assegnati') +
      ' in quel periodo.',
      { tipo:'fascicolo', id:g.a.dipendente });
  });

  // 2. mansione non coperta dalle abilitazioni, raggruppata per persona e mansione
  var perMansione = {};
  D.turni.forEach(function(t){
    if (!t.dipendente || giorniA(t.data) < 0 || t.deroga) return;
    var v = verifica(dip(t.dipendente), t.mansione);
    if (v.ok) return;
    var k = t.dipendente + '|' + t.mansione;
    (perMansione[k] = perMansione[k] || { t:t, motivo:v.motivo, n:0 }).n++;
  });
  Object.keys(perMansione).forEach(function(k){
    var g = perMansione[k];
    segna('all', 'Mansione non coperta',
      dip(g.t.dipendente).nome + ': ' + (g.n === 1 ? 'un turno' : g.n + ' turni') + ' come ' +
      mansione(g.t.mansione).nome.toLowerCase() + '. ' + g.motivo,
      { tipo:'fascicolo', id:g.t.dipendente });
  });


  // 3. riposo fra due turni sotto le undici ore, una riga per persona
  D.dipendenti.forEach(function(d){
    var suoi = D.turni.filter(function(t){ return t.dipendente === d.id && giorniA(t.data) >= -1; })
                      .sort(function(a,b){ return inizioAssoluto(a) - inizioAssoluto(b); });
    var casi = [], minimo = null;
    for (var i = 1; i < suoi.length; i++) {
      var ore = (inizioAssoluto(suoi[i]) - finePresunta(suoi[i-1])) / 3600000;
      if (ore >= 0 && ore < RIPOSO_MINIMO_H) {
        casi.push(suoi[i]);
        if (minimo === null || ore < minimo) minimo = ore;
      }
    }
    if (!casi.length) return;
    segna('att', 'Riposo sotto le ' + RIPOSO_MINIMO_H + ' ore',
      d.nome + ': ' + (casi.length === 1 ? 'un cambio turno' : casi.length + ' cambi turno') +
      ' con riposo insufficiente, il piu\u0300 corto di ' +
      minimo.toFixed(1).replace('.', ',') + ' ore.',
      { tipo:'fascicolo', id:d.id });
  });


  // 4. ore assegnate oltre il contratto, sui prossimi sette giorni
  D.dipendenti.forEach(function(d){
    var max = Number(d.contratto && d.contratto.ore);
    if (!max) return;
    var ore = D.turni.filter(function(t){
      return t.dipendente === d.id && giorniA(t.data) >= 0 && giorniA(t.data) < 7;
    }).reduce(function(n, t){
      var m = minuti(t.fine) <= minuti(t.inizio) ? minuti(t.fine) + 1440 : minuti(t.fine);
      return n + (m - minuti(t.inizio)) / 60;
    }, 0);
    if (ore > max) segna('att', 'Ore oltre il contratto',
      d.nome + ': ' + Math.round(ore) + ' ore nei prossimi sette giorni, il contratto ne prevede ' + max + '.',
      { tipo:'fascicolo', id:d.id });
  });

  // 5. contratto a termine in scadenza
  D.dipendenti.forEach(function(d){
    var sc = d.contratto && d.contratto.scadenza;
    if (!sc) return;
    var g = giorniA(sc);
    if (g < 0) segna('all', 'Contratto scaduto',
      d.nome + ': contratto scaduto da ' + Math.abs(g) + ' giorni.', { tipo:'fascicolo', id:d.id });
    else if (g <= 30) segna('att', 'Contratto in scadenza',
      d.nome + ': il contratto scade fra ' + g + ' giorni, il ' + dataBreve(sc) + '.', { tipo:'fascicolo', id:d.id });
  });

  // 6. turni scoperti nei prossimi sette giorni
  var scop = D.turni.filter(function(t){ return !t.dipendente && giorniA(t.data) >= 0 && giorniA(t.data) < 7; });
  if (scop.length) segna('att', scop.length === 1 ? 'Un turno ancora scoperto' : 'Turni ancora scoperti',
    (scop.length === 1 ? 'Un turno senza operatore' : scop.length + ' turni senza operatore') +
    ' nei prossimi sette giorni.', { tipo:'vista', id:'pianifica' });

  // 7. timbrature fuori area nell'ultimo mese
  var fa = D.turni.filter(function(t){ return t.conferma && t.conferma.fuoriArea && giorniA(t.data) > -30; });
  if (fa.length) segna('att', fa.length === 1 ? 'Timbratura fuori area' : 'Timbrature fuori area',
    (fa.length === 1 ? 'Una conferma registrata' : fa.length + ' conferme registrate') +
    ' oltre il raggio consentito negli ultimi 30 giorni.',
    { tipo:'vista', id:'pianifica' });

  var ordine = { all:0, att:1 };
  return r.sort(function(a, b){ return ordine[a.gr] - ordine[b.gr]; });
}

function bloccoControlli(){
  var c = controlli();
  var gravi = c.filter(function(x){ return x.gr === 'all'; }).length;
  if (!c.length) {
    return '<div class="blocco blocco--ok"><div class="blocco__testa"><h2>Controlli automatici</h2>' +
      '<span class="p p--ok">nessuna anomalia</span></div>' +
      '<p class="vuoto">Assenze, abilitazioni, riposi, ore di contratto e coperture: tutto in regola.</p></div>';
  }
  return '<div class="blocco blocco--' + (gravi ? 'all' : 'att') + '"><div class="blocco__testa">' +
    '<h2>Controlli automatici</h2>' +
    '<span class="p p--' + (gravi ? 'all' : 'att') + '">' + c.length + ' da guardare' +
    (gravi ? ', ' + gravi + ' urgenti' : '') + '</span></div>' +
    '<div class="avvisi">' + c.slice(0, 8).map(function(x, i){
      return '<button class="avv avv--' + x.gr + '" data-ctrl="' + i + '">' + icona('avviso') +
             '<span class="avv__t"><b>' + esc(x.tit) + '</b><small>' + esc(x.det) + '</small></span></button>';
    }).join('') + '</div>' +
    (c.length > 8 ? '<p class="vuoto">e altre ' + (c.length - 8) + ' segnalazioni.</p>' : '') + '</div>';
}

function agganciaControlli(){
  var c = controlli();
  document.querySelectorAll('[data-ctrl]').forEach(function(b){
    b.onclick = function(){
      var x = c[+b.dataset.ctrl]; if (!x || !x.vai) return;
      if (x.vai.tipo === 'turno')     { fogliaTurno(x.vai.id); }
      if (x.vai.tipo === 'fascicolo') { fascicoloAperto = x.vai.id; vaiA('fascicoli'); }
      if (x.vai.tipo === 'vista')     { vaiA(x.vai.id); }
    };
  });
}

VISTE.cruscotto = function(){
  intesta('Cruscotto', 'Situazione di oggi, ' + dataBreve(oggiISO()));
  var oggi = D.turni.filter(function(t){ return t.data === oggiISO(); });
  var scoperti = D.turni.filter(function(t){ return !t.dipendente && giorniA(t.data) >= 0; });
  var confermati = oggi.filter(function(t){ return t.conferma; });
  var sc = scadenzeAperte();
  var scadute = sc.filter(function(x){ return x.s.cl === 'all'; });

  var righe = scoperti.slice(0,6).map(function(t){
    return '<tr><td><b>'+dataBreve(t.data)+'</b><small>'+t.inizio+' &ndash; '+t.fine+'</small></td>' +
           '<td>'+nomeLoc(t.location)+'<small>'+nomeCli(t.location)+'</small></td>' +
           '<td>'+mansione(t.mansione).nome+'</td>' +
           '<td><button class="b b--sec b--min" data-assegna="'+t.id+'">Assegna</button></td></tr>';
  }).join('');

  var futuriTot = D.turni.filter(function(t){ return giorniA(t.data) >= 0; });
  var quotaSett = Math.round(futuriTot.filter(function(t){ return t.dipendente; }).length / futuriTot.length * 100);

  dipingi(
    '<div class="riquadri">' +
      '<div class="riq"><b>'+oggi.length+'</b><span>Turni oggi</span></div>' +
      '<div class="riq riq--ok"><b>'+confermati.length+'</b><span>Confermati sul posto</span></div>' +
      '<div class="riq riq--att"><b>'+scoperti.length+'</b><span>Turni scoperti</span></div>' +
      '<div class="riq riq--all"><b>'+scadute.length+'</b><span>Abilitazioni scadute</span></div>' +
    '</div>' +
    bloccoControlli() +
    '<div class="blocco"><div class="blocco__testa"><h2>Copertura dei prossimi sette giorni</h2>' +
      '<span class="p p--'+(quotaSett>90?'ok':'att')+'">'+quotaSett+'%</span></div>' +
      '<div class="copertura"><div class="copertura__barra"><div class="copertura__pieno" style="width:'+quotaSett+'%"></div></div>' +
      '<span class="copertura__et">'+futuriTot.filter(function(t){ return t.dipendente; }).length+' turni su '+futuriTot.length+' assegnati</span></div></div>' +
    '<div class="blocco"><div class="blocco__testa"><h2>Turni da coprire</h2>' +
      '<button class="b b--sec b--min" data-vai="turni">Vedi tutti i turni</button></div>' +
      (righe ? '<div class="tabellone"><table><thead><tr><th>Quando</th><th>Dove</th><th>Mansione</th><th></th></tr></thead><tbody>'+righe+'</tbody></table></div>'

VISTE.turni = function(){
  intesta('Turni', 'Diagramma della giornata: ogni corsia &egrave; una postazione');
  var futuri = D.turni.filter(function(t){ return giorniA(t.data) >= 0; })
                      .sort(function(a,b){ return a.data.localeCompare(b.data); });
  var perGiorno = {};
  futuri.forEach(function(t){ (perGiorno[t.data] = perGiorno[t.data] || []).push(t); });

  var ore = [0,3,6,9,12,15,18,21];
  var html = Object.keys(perGiorno).sort().slice(0,7).map(function(g){
    var elenco = perGiorno[g];
    var perLoc = {};
    elenco.forEach(function(t){ (perLoc[t.location] = perLoc[t.location] || []).push(t); });
    var coperti = elenco.filter(function(t){ return t.dipendente; }).length;
    var quota = Math.round(coperti / elenco.length * 100);
    var oggi = g === oggiISO();

    var corsie = Object.keys(perLoc).map(function(idL){
      var l = loc(idL);
      var barre = perLoc[idL].map(function(t){
        var a = minuti(t.inizio), b = minuti(t.fine);
        if (b <= a) b = 1440;
        var sx = a/1440*100, la = (b-a)/1440*100;
        var d = t.dipendente && dip(t.dipendente);
        var cl = !d ? 'scoperta' : (t.conferma ? (t.conferma.fuoriArea ? 'att' : 'ok') : 'pian');
        var dentro = d ? avatar(d.nome) + '<b>' + esc(d.nome.split(' ')[0]) + '</b>'
                       : '<b>' + mansione(t.mansione).nome + '</b>';
        return '<button class="barra barra--'+cl+'" data-assegna="'+t.id+'" ' +
               'style="left:'+sx.toFixed(2)+'%;width:'+la.toFixed(2)+'%" ' +
               'title="'+t.inizio+'&ndash;'+t.fine+' &middot; '+mansione(t.mansione).nome+'">'+dentro+'</button>';
      }).join('');
      var adesso = oggi ? '<span class="adesso" style="left:'+(oraOra()/1440*100).toFixed(2)+'%"></span>' : '';
      return '<div class="corsia"><div class="corsia__et"><b>'+l.nome+'</b><small>'+l.citta+' &middot; '+nomeCli(idL)+'</small></div>' +
             '<div class="corsia__pista">'+adesso+barre+'</div></div>';
    }).join('');

    return '<div class="blocco giorno"><div class="blocco__testa">' +
      '<h2>'+dataBreve(g)+(oggi?' <span class="p p--oro p--vuota">oggi</span>':'')+'</h2>' +
      '<span class="p p--'+(quota===100?'ok':'att')+'">'+coperti+' su '+elenco.length+' coperti</span></div>' +
      '<div class="copertura"><div class="copertura__barra"><div class="copertura__pieno" style="width:'+quota+'%"></div></div>' +
      '<span class="copertura__et">'+quota+'% di copertura</span></div>' +
      '<div class="assi"><span></span><div class="assi__ore">' +
        ore.map(function(o){ return '<span>'+(o<10?'0':'')+o+':00</span>'; }).join('') + '</div></div>' +
      corsie + '</div>';
  }).join('');

  dipingi(html);
  agganciaAzioni();
};

var pianState = { scheda:'turni', dal:null, settimane:1, vincoli:'' };

function lunediDi(d){ var x = new Date(d); var g = (x.getDay()+6)%7; x.setDate(x.getDate()-g); x.setHours(0,0,0,0); return x; }
/* La data va scritta come la vede chi sta davanti allo schermo. Passare da
   toISOString() significherebbe usare l'ora di Greenwich: in Italia, fino alle
   due di notte, il gestionale si convincerebbe che e' ancora ieri. */
function isoDi(d){
  return d.getFullYear() + '-' +
         ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
         ('0' + d.getDate()).slice(-2);
}

VISTE.pianifica = function(){
  if (!pianState.dal) pianState.dal = isoDi(lunediDi(new Date()));
  intesta('Personale e turni', 'Griglia di pianificazione: ogni casella porta con s&eacute; codice, location e mansione');

  var schede = [['turni','Turni'],['staff','Staff']].concat(abilitata('timbrature') ? [['timbrature','Timbrature']] : []);
  if (pianState.scheda === 'timbrature' && !abilitata('timbrature')) pianState.scheda = 'turni';
  var barra = '<div class="schede">' + schede.map(function(x){
      return '<button data-scheda="'+x[0]+'" aria-pressed="'+(pianState.scheda===x[0])+'">'+x[1]+'</button>';
    }).join('') + '</div>';

  document.getElementById('vista').innerHTML = barra + '<div id="sotto"></div>';
  document.querySelectorAll('[data-scheda]').forEach(function(b){
    b.onclick = function(){ pianState.scheda = b.dataset.scheda; VISTE.pianifica(); };
  });

  if (pianState.scheda === 'turni') schedaTurni();
  else if (pianState.scheda === 'staff') schedaStaff();
  else schedaTimbrature();
};

function giorniIntervallo(){
  var out = [], n = pianState.settimane * 7;
  var d = new Date(pianState.dal + 'T00:00:00');
  for (var i = 0; i < n; i++) { out.push(isoDi(d)); d.setDate(d.getDate()+1); }
  return out;
}

function schedaTurni(){
  var giorni = giorniIntervallo();
  var etichetta = dataBreve(giorni[0]) + ' &ndash; ' + dataBreve(giorni[giorni.length-1]);

  var legenda = '<div class="legenda">' + codici().map(function(c){
      return '<span class="cod"><i style="background:'+c.col+'"></i><b>'+c.id+'</b> '+c.et+
             (c.ini ? ' <small>'+c.ini+'&ndash;'+c.fin+'</small>' : '') + '</span>';
    }).join('') + '</div>';

  var scelteSett = [[1,'1 sett.'],[2,'2 sett.'],[4,'Mese']].map(function(x){
      return '<button data-sett="'+x[0]+'" aria-pressed="'+(pianState.settimane===x[0])+'">'+x[1]+'</button>';
    }).join('');

  function cella(t){
    var l = loc(t.location);
    var cid = codiceDaOrario(t.inizio, t.fine);
    var c = codice(cid);
    var st = !t.dipendente ? 'scoperta' : (t.conferma ? (t.conferma.fuoriArea ? 'att' : 'ok') : 'pian');
    return '<button class="gettone gettone--'+st+'" data-turno="'+t.id+'">' +
             '<span class="gettone__c" style="background:'+c.col+'">'+cid+'</span>' +
             '<span class="gettone__t"><b>'+mansione(t.mansione).nome+'</b>' +
             '<small>'+l.citta+' &middot; '+t.inizio+'&ndash;'+t.fine+'</small></span>' +
           '</button>';
  }

  var scoperti = giorni.map(function(g){
    return '<td>' + D.turni.filter(function(t){ return t.data === g && !t.dipendente; }).map(cella).join('') + '</td>';
  }).join('');

  var righe = D.dipendenti.map(function(d){
    var celle = giorni.map(function(g){
      var ts = D.turni.filter(function(t){ return t.data === g && t.dipendente === d.id; });
      return '<td>' + ts.map(cella).join('') +
             '<button class="piu" data-nuovoturno="'+g+'|'+d.id+'" title="Aggiungi turno">+</button></td>';
    }).join('');
    return '<tr><th scope="row"><div class="persona">'+avatar(d.nome)+'<div><b>'+esc(d.nome)+'</b>' +
           '<small>'+d.mansioni.length+(d.mansioni.length===1?' mansione':' mansioni')+'</small></div></div></th>' +
           celle + '</tr>';
  }).join('');

  document.getElementById('sotto').innerHTML =
    (abilitata('genera') ? '<div class="genera">' : '<div class="genera" hidden>') +
      '<div class="genera__t"><b>Genera i turni automaticamente</b>' +
      '<span>Algoritmo locale, nessun servizio esterno. Copre il fabbisogno di ogni location rispettando abilitazioni e riposi.</span></div>' +
      '<div class="genera__r"><input id="vincoli" placeholder="Es: Marco no sabato &middot; Sara solo mattine &middot; Luca due giorni liberi" value="'+esc(pianState.vincoli)+'">' +
      '<button class="b b--pri" id="genera">Genera turni</button></div>' +
    '</div>' +
    '<div class="comandi">' +
      '<div class="comandi__nav"><button class="b b--sec b--min" id="pre">&lsaquo;</button>' +
      '<button class="b b--sec b--min" id="oggi">Oggi</button>' +
      '<button class="b b--sec b--min" id="suc">&rsaquo;</button></div>' +
      '<div class="schede schede--min">'+scelteSett+'</div>' +
      '<span class="comandi__et">'+etichetta+'</span>' +
      '<div class="comandi__dx">' +

function spostaSettimane(n){
  var d = new Date(pianState.dal + 'T00:00:00');
  d.setDate(d.getDate() + n*7);
  pianState.dal = isoDi(d);
  VISTE.pianifica();
}

/* ---- generatore: copre il fabbisogno rispettando abilitazioni, riposi e stacco minimo ---- */
var GIORNI_TESTO = { lun:0, "luned\u00ec":0, mar:1, "marted\u00ec":1, mer:2, "mercoled\u00ec":2,
  gio:3, "gioved\u00ec":3, ven:4, "venerd\u00ec":4, sab:5, sabato:5, dom:6, domenica:6 };
var NUMERI_TESTO = { uno:1, due:2, tre:3, quattro:4, cinque:5, sei:6 };

function leggiVincoli(testo){
  var v = {};
  D.dipendenti.forEach(function(d){
    var nome = d.nome.split(' ')[0].toLowerCase();
    var reg = { riposiFissi:new Set(), minRiposi:2, soloCodici:null };
    (testo || '').toLowerCase().split(/[,;.\n\u00b7]+/).forEach(function(seg){
      if (seg.indexOf(nome) < 0) return;
      if (/\bno\b|riposo|libero|libera|off/.test(seg)) {
        Object.keys(GIORNI_TESTO).forEach(function(g){
          if (new RegExp('\\b'+g+'\\b').test(seg)) reg.riposiFissi.add(GIORNI_TESTO[g]);
        });
        var n = seg.match(/(\d+)\s*giorn/);
        if (n) reg.minRiposi = Math.max(1, Math.min(+n[1], 5));
        Object.keys(NUMERI_TESTO).forEach(function(w){
          if (seg.indexOf(w) >= 0 && seg.indexOf('giorn') >= 0) reg.minRiposi = NUMERI_TESTO[w];
        });
      }
      if (/solo mattin/.test(seg)) reg.soloCodici = ['M','A'];
      else if (/solo notte|solo nott/.test(seg)) reg.soloCodici = ['N'];
      else if (/solo pomerig/.test(seg)) reg.soloCodici = ['P'];
    });
    v[d.id] = reg;
  });
  return v;
}

function generaTurni(giorni, testo){
  var vincoli = leggiVincoli(testo);
  // via i turni non ancora confermati nell'intervallo: quelli timbrati non si toccano
  D.turni = D.turni.filter(function(t){ return giorni.indexOf(t.data) < 0 || t.conferma; });

  var conteggio = {}, oreFatte = {};
  D.dipendenti.forEach(function(d){ conteggio[d.id] = 0; oreFatte[d.id] = 0; });
  var creati = 0, scoperti = 0;
  var scartati = { assenza:0, abilitazione:0, riposo:0, ore:0, vincolo:0 };

  function durata(ini, fin){
    var m = minuti(fin) <= minuti(ini) ? minuti(fin) + 1440 : minuti(fin);
    return (m - minuti(ini)) / 60;
  }
  // settimana ISO di appartenenza, per confrontare le ore col contratto
  function settimanaDi(g){
    var d = new Date(g + 'T00:00:00');
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return isoDi(d);
  }

  giorni.forEach(function(g){
    var dow = (new Date(g+'T00:00:00').getDay()+6)%7;
    D.esigenze.forEach(function(e){
      if (e.giorni.indexOf(dow) < 0) return;
      var c = codice(e.cod);
      if (D.turni.some(function(t){ return t.data===g && t.location===e.location && t.mansione===e.mans && t.inizio===c.ini; })) return;

      var ore = durata(c.ini, c.fin);
      var prova = { data:g, inizio:c.ini, fine:c.fin };

      var candidati = D.dipendenti.filter(function(d){
        var reg = vincoli[d.id];

        // chi e' in ferie, malattia o permesso non si pianifica
        if (assenzeDi(d.id).some(function(a){ return g >= a.dal && g <= a.al; })) { scartati.assenza++; return false; }
        // ne' chi ha una richiesta in attesa su quel giorno: si decide prima
        if (D.richieste.some(function(r){ return r.dipendente===d.id && r.stato==='in attesa' && g >= r.dal && g <= r.al; })) { scartati.assenza++; return false; }

        if (!verifica(d, e.mans).ok) { scartati.abilitazione++; return false; }
        if (reg.riposiFissi.has(dow)) { scartati.vincolo++; return false; }
        if (reg.soloCodici && reg.soloCodici.indexOf(e.cod) < 0) { scartati.vincolo++; return false; }
        if (D.turni.some(function(t){ return t.data===g && t.dipendente===d.id; })) { scartati.riposo++; return false; }

        // riposo di legge: almeno undici ore fra la fine di un turno e l'inizio del successivo
        var suoi = D.turni.filter(function(t){ return t.dipendente === d.id; });
        var inizioNuovo = inizioAssoluto(prova), fineNuovo = finePresunta(prova);
        var violato = suoi.some(function(t){
          var a = (inizioNuovo - finePresunta(t)) / 3600000;
          var b = (inizioAssoluto(t) - fineNuovo) / 3600000;
          return (a >= 0 && a < RIPOSO_MINIMO_H) || (b >= 0 && b < RIPOSO_MINIMO_H);
        });
        if (violato) { scartati.riposo++; return false; }

        // monte ore settimanale del contratto, con una tolleranza di un turno
        var max = Number(d.contratto && d.contratto.ore);
        if (max) {
          var sett = settimanaDi(g);
          var gia = D.turni.filter(function(t){ return t.dipendente===d.id && settimanaDi(t.data)===sett; })
                           .reduce(function(n, t){ return n + durata(t.inizio, t.fine); }, 0);
          if (gia + ore > max) { scartati.ore++; return false; }
        }
        return true;
      }).sort(function(a, b){
        // prima chi ha quella sede fra le abituali, poi chi ha meno turni
        var sa = (a.sedi || []).indexOf(e.location) >= 0 ? 0 : 1;
        var sb = (b.sedi || []).indexOf(e.location) >= 0 ? 0 : 1;
        if (sa !== sb) return sa - sb;
        if (conteggio[a.id] !== conteggio[b.id]) return conteggio[a.id] - conteggio[b.id];
        return oreFatte[a.id] - oreFatte[b.id];
      });

      var scelto = candidati[0] || null;
      if (scelto) { conteggio[scelto.id]++; oreFatte[scelto.id] += ore; creati++; } else { scoperti++; }
      D.turni.push({ id:'g'+(Date.now()%1e7)+'-'+creati+'-'+scoperti, data:g, location:e.location,
        mansione:e.mans, dipendente:scelto ? scelto.id : null,
        inizio:c.ini, fine:c.fin, conferma:null, deroga:false });
    });
  });

  salva();
  VISTE.pianifica();

  var motivi = [
    ['assenza',      'in ferie, malattia o permesso'],
    ['abilitazione', 'senza l&rsquo;abilitazione richiesta'],
    ['riposo',       'con meno di ' + RIPOSO_MINIMO_H + ' ore di riposo'],
    ['ore',          'gi&agrave; al monte ore del contratto'],
    ['vincolo',      'esclusi dai vincoli scritti']
  ].filter(function(m){ return scartati[m[0]] > 0; });

  apri('<h2>Turni generati</h2>' +
    '<p class="foglio__nota">Su ' + giorni.length + ' giorni, coprendo il fabbisogno di ogni location.</p>' +
    '<div class="riquadri" style="margin:0 0 18px">' +
      '<div class="riq riq--ok"><b>' + creati + '</b><span>Turni assegnati</span></div>' +
      '<div class="riq' + (scoperti ? ' riq--att' : '') + '"><b>' + scoperti + '</b><span>Rimasti scoperti</span></div>' +
    '</div>' +
    (motivi.length
      ? '<h3 class="foglio__sez">Perch&eacute; qualcuno non &egrave; stato scelto</h3>' +
        '<div class="tabellone"><table><tbody>' + motivi.map(function(m){
          return '<tr><td>Operatori ' + m[1] + '</td><td class="num">' + scartati[m[0]] + ' volte</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '') +
    '<p style="color:var(--smorzato);font-size:.86rem;margin-top:14px">I turni gi&agrave; timbrati non sono stati toccati. ' +
    'Ogni casella resta modificabile a mano, e il prospetto accetta anche assegnazioni in deroga.</p>' +
    '<div class="azioni"><button class="b b--pri" id="ok">Chiudi</button></div>');
  document.getElementById('ok').onclick = chiudi;
}

function fogliaCsv(giorni){
  var righe = [['Dipendente'].concat(giorni.map(dataBreve)).join(';')];
  D.dipendenti.forEach(function(d){
    righe.push([d.nome].concat(giorni.map(function(g){
      var ts = D.turni.filter(function(t){ return t.data===g && t.dipendente===d.id; });
      return ts.map(function(t){
        return codiceDaOrario(t.inizio,t.fine)+' '+mansione(t.mansione).nome+' ('+loc(t.location).citta+')';
      }).join(' + ');
    })).join(';'));
  });
  var csv = righe.join('\n');
  apri('<h2>Esporta il periodo</h2>' +
    '<p class="foglio__nota">Nel sistema installato questo diventa un file Excel scaricabile. ' +
    'Nel prototipo il testo si seleziona e si incolla.</p>' +
    '<textarea class="csv" readonly>'+esc(csv)+'</textarea>' +
    '<div class="azioni"><button class="b b--sec" id="stampa2">Stampa invece</button>' +
    '<button class="b b--pri" id="ok">Chiudi</button></div>');
  foglio.querySelector('.csv').select();
  document.getElementById('ok').onclick = chiudi;
  document.getElementById('stampa2').onclick = function(){ chiudi(); window.print(); };
}

var GIORNI_ET = ['lun','mar','mer','gio','ven','sab','dom'];

VISTE.config = function(){
  intesta('Configurazione', 'Turni tipo e fabbisogno: qui ogni azienda imposta i propri, senza passare da noi');

  var righeCod = codici().map(function(c, i){
    return '<tr><td><span class="gettone__c" style="background:'+c.col+'">'+c.id+'</span></td>' +
           '<td><b>'+esc(c.et)+'</b></td>' +
           '<td class="num">'+(c.ini ? c.ini+'&ndash;'+c.fin : '&mdash;')+'</td>' +
           '<td class="num">'+(c.ini ? oreCodice(c).toFixed(1)+' h' : '&mdash;')+'</td>' +
           '<td><button class="b b--sec b--min" data-modcod="'+i+'">Modifica</button> ' +
           '<button class="b b--sec b--min" data-elimcod="'+i+'">Elimina</button></td></tr>';
  }).join('');

  var righeEsi = D.esigenze.map(function(e, i){
    var l = loc(e.location);
    return '<tr><td><b>'+l.nome+'</b><small>'+l.citta+' &middot; '+nomeCli(e.location)+'</small></td>' +
           '<td><span class="gettone__c" style="background:'+codice(e.cod).col+'">'+e.cod+'</span></td>' +
           '<td>'+mansione(e.mans).nome+'</td>' +
           '<td>'+GIORNI_ET.map(function(g, k){
              return '<span class="gio'+(e.giorni.indexOf(k)>=0?' gio--on':'')+'">'+g+'</span>'; }).join('')+'</td>' +
           '<td><button class="b b--sec b--min" data-modesi="'+i+'">Modifica</button> ' +
           '<button class="b b--sec b--min" data-elimesi="'+i+'">Elimina</button></td></tr>';
  }).join('');

  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Turni tipo</h2>' +
      '<button class="b b--pri b--min" data-modcod="nuovo">Nuovo turno tipo</button></div>' +
      '<div class="tabellone"><table><thead><tr><th>Codice</th><th>Nome</th><th>Orario</th><th>Durata</th><th></th></tr></thead>' +
      '<tbody>'+righeCod+'</tbody></table></div>' +
      '<p class="postilla">I codici compaiono nella legenda della pianificazione e sono quelli che il generatore usa per riempire la griglia.</p></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Fabbisogno ricorrente</h2>' +
      '<button class="b b--pri b--min" data-modesi="nuovo">Nuova riga</button></div>' +
      '<div class="tabellone"><table><thead><tr><th>Location</th><th>Turno</th><th>Mansione</th><th>Giorni</th><th></th></tr></thead>' +
      '<tbody>'+righeEsi+'</tbody></table></div>' +
      '<p class="postilla">&Egrave; quello che il generatore prova a coprire: quale mansione serve, dove, con quale turno e in quali giorni della settimana.</p></div>'
  );
  agganciaAzioni();
};

function oreCodice(c){
  var a = minuti(c.ini), b = minuti(c.fin);
  if (b <= a) b += 1440;
  return (b - a) / 60;
}

function fogliaCodice(idx){
  var nuovo = idx === 'nuovo';
  var c = nuovo ? { id:'', et:'', ini:'09:00', fin:'17:00', col:'#2E5E8C' } : codici()[+idx];
  apri('<h2>'+(nuovo?'Nuovo turno tipo':'Modifica turno tipo')+'</h2>' +
    '<p class="foglio__nota">Orari e sigle sono liberi: ogni azienda usa i suoi.</p>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Sigla</span><input id="c-id" maxlength="2" value="'+esc(c.id)+'" placeholder="M"></label>' +
      '<label class="campo"><span>Nome</span><input id="c-et" value="'+esc(c.et)+'" placeholder="Mattina"></label>' +
    '</div><div class="duecol">' +
      '<label class="campo"><span>Inizio</span><input type="time" id="c-ini" value="'+c.ini+'"></label>' +
      '<label class="campo"><span>Fine</span><input type="time" id="c-fin" value="'+c.fin+'"></label>' +
    '</div>' +
    '<label class="campo"><span>Colore</span><input type="color" id="c-col" value="'+c.col+'"></label>' +
    '<div class="errore" id="c-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="ann">Annulla</button>' +
    '<button class="b b--pri" id="sal">Salva</button></div>');
  document.getElementById('ann').onclick = chiudi;
  document.getElementById('sal').onclick = function(){
    var id = document.getElementById('c-id').value.trim().toUpperCase();
    var et = document.getElementById('c-et').value.trim();
    var err = document.getElementById('c-err');
    if (!id || !et) { err.hidden=false; err.innerHTML='<b>Mancano dei dati.</b> Sigla e nome sono obbligatori.'; return; }
    if (nuovo && codici().some(function(x){ return x.id===id; })) {
      err.hidden=false; err.innerHTML='<b>Sigla gi&agrave; usata.</b> Scegline un\'altra.'; return; }
    var v = { id:id, et:et, ini:document.getElementById('c-ini').value,
              fin:document.getElementById('c-fin').value, col:document.getElementById('c-col').value };
    if (nuovo) D.codici.push(v); else D.codici[+idx] = v;
    salva(); chiudi(); vaiA('config');
  };
}

function fogliaEsigenza(idx){
  var nuovo = idx === 'nuovo';
  var e = nuovo ? { location:D.location[0].id, cod:codici()[0].id, mans:'portierato', giorni:[0,1,2,3,4] }
                : D.esigenze[+idx];
  apri('<h2>'+(nuovo?'Nuova riga di fabbisogno':'Modifica fabbisogno')+'</h2>' +
    '<p class="foglio__nota">Che cosa deve essere coperto, dove, con quale turno e in quali giorni.</p>' +
    '<label class="campo"><span>Location</span><select id="e-loc">' +
      D.location.map(function(l){ return '<option value="'+l.id+'"'+(l.id===e.location?' selected':'')+'>'+l.nome+' &mdash; '+l.citta+'</option>'; }).join('') +
    '</select></label>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Turno tipo</span><select id="e-cod">' +
        codici().filter(function(c){ return c.ini; }).map(function(c){
          return '<option value="'+c.id+'"'+(c.id===e.cod?' selected':'')+'>'+c.id+' &middot; '+c.et+' '+c.ini+'&ndash;'+c.fin+'</option>'; }).join('') +
      '</select></label>' +
      '<label class="campo"><span>Mansione</span><select id="e-mans">' +
        MANSIONI.map(function(m){ return '<option value="'+m.id+'"'+(m.id===e.mans?' selected':'')+'>'+m.nome+'</option>'; }).join('') +
      '</select></label>' +
    '</div>' +
    '<div class="campo"><span>Giorni della settimana</span><div class="spunte">' +
      GIORNI_ET.map(function(g,k){
        return '<label class="spunta"><input type="checkbox" value="'+k+'"'+(e.giorni.indexOf(k)>=0?' checked':'')+'>'+g+'</label>'; }).join('') +
    '</div></div>' +
    '<div class="azioni"><button class="b b--sec" id="ann">Annulla</button>' +
    '<button class="b b--pri" id="sal">Salva</button></div>');
  document.getElementById('ann').onclick = chiudi;
  document.getElementById('sal').onclick = function(){
    var v = { location:document.getElementById('e-loc').value,
              cod:document.getElementById('e-cod').value,
              mans:document.getElementById('e-mans').value,
              giorni:[].slice.call(foglio.querySelectorAll('.spunte input:checked')).map(function(i){ return +i.value; }) };
    if (nuovo) D.esigenze.push(v); else D.esigenze[+idx] = v;

var fascicoloAperto = null;

VISTE.fascicoli = function(){
  if (fascicoloAperto && dip(fascicoloAperto)) { schedaFascicolo(dip(fascicoloAperto)); return; }
  intesta('Fascicoli dipendenti', 'Una scheda per persona: anagrafica, contratto, sedi, mansioni, documenti, turni, timbrature, assenze e buste paga');

  var gestisce = gestiscePersonale();
  var righe = D.dipendenti.map(function(d){
    var ab = d.abil.map(function(a){ return statoAbil(a.s); }).sort(function(x,y){ return x.g-y.g; })[0];
    var p = !d.abil.length ? '<span class="p p--neutro">nessuna</span>'
          : '<span class="p p--'+ab.cl+'">'+ab.et+'</span>';
    var futuri = D.turni.filter(function(t){ return t.dipendente===d.id && giorniA(t.data)>=0; }).length;
    var timbr  = D.turni.filter(function(t){ return t.dipendente===d.id && t.conferma; }).length;
    var doc    = D.documenti.filter(function(x){ return x.dipendente===d.id; }).length;
    var ced    = D.cedolini.filter(function(x){ return x.dipendente===d.id; }).length;
    var ass = assenzeDi(d.id).filter(assenzaInCorso)[0];
    var statoOggi = ass ? '<span class="p p--att">'+ass.tipo.toLowerCase()+'</span>'
                        : '<span class="p p--ok">in servizio</span>';

/* Solo la direzione mette mano all'organico. */
function gestiscePersonale(){ return !!(utente && utente.admin); }

function schedaFascicolo(d){
  intesta('Fascicolo di ' + esc(d.nome), esc(d.email) + ' &middot; ' + d.mansioni.map(function(m){ return mansione(m).nome; }).join(' &middot; '));

  var miei   = D.turni.filter(function(t){ return t.dipendente===d.id; }).sort(function(a,b){ return b.data.localeCompare(a.data); });
  var futuri = miei.filter(function(t){ return giorniA(t.data)>=0; }).reverse();
  var timbr  = miei.filter(function(t){ return t.conferma; });
  var doc    = D.documenti.filter(function(x){ return x.dipendente===d.id; });
  var ced    = D.cedolini.filter(function(x){ return x.dipendente===d.id; }).sort(function(a,b){ return b.mese.localeCompare(a.mese); });
  var fuori  = timbr.filter(function(t){ return t.conferma.fuoriArea; }).length;
  var ass    = assenzeDi(d.id);
  var inCorso= ass.filter(assenzaInCorso)[0];
  var gg     = ass.filter(function(a){ return giorniA(a.al) > -365; })
                  .reduce(function(n,a){ return n + giorniAssenza(a); }, 0);
  var gestisce = gestiscePersonale();
  var ct     = d.contratto || {};

  dipingi(
    '<div class="fasc__testa">' +
      '<button class="b b--sec b--min" data-chiudi-fascicolo="1">&larr; Tutti i dipendenti</button>' +
      (gestisce ? '<button class="b b--all b--min" data-elimina-dip="'+d.id+'">Elimina dipendente</button>' : '') +
    '</div>' +

    (inCorso ? '<div class="avviso-riga"><b>'+inCorso.tipo+' in corso</b> &mdash; dal '+dataBreve(inCorso.dal)+
               ' al '+dataBreve(inCorso.al)+' ('+giorniAssenza(inCorso)+' giorni).' +
               (inCorso.nota ? ' '+esc(inCorso.nota) : '') + '</div>' : '') +

    '<div class="riquadri">' +
      '<div class="riq"><b>'+futuri.length+'</b><span>Turni in programma</span></div>' +
      '<div class="riq riq--ok"><b>'+timbr.length+'</b><span>Timbrature registrate</span></div>' +
      '<div class="riq'+(fuori?' riq--att':'')+'"><b>'+fuori+'</b><span>Fuori area</span></div>' +
      '<div class="riq'+(d.abil.some(function(a){return statoAbil(a.s).cl==='all'})?' riq--all':'')+'"><b>'+d.abil.length+'</b><span>Abilitazioni</span></div>' +
      '<div class="riq'+(inCorso?' riq--att':'')+'"><b>'+gg+'</b><span>Giorni di assenza (12 mesi)</span></div>' +
    '</div>' +

    // --- anagrafica e mansioni ---
    '<div class="due">' +
      '<div class="blocco"><div class="blocco__testa"><h2>Anagrafica</h2>' +
        '<button class="b b--sec b--min" data-scheda-dip="'+d.id+'">Modifica</button></div>' +
        '<div class="dati">' +
          '<div><span>Nome</span><b>'+esc(d.nome)+'</b></div>' +
          '<div><span>Email di accesso</span><b>'+esc(d.email)+'</b></div>' +
          '<div><span>Telefono</span><b>'+(d.telefono ? esc(d.telefono) : '&mdash;')+'</b></div>' +
          '<div><span>Codice fiscale</span><b>'+(d.cf ? esc(d.cf) : '&mdash;')+'</b></div>' +
          '<div><span>Mansioni abilitate</span><b>'+(d.mansioni.length ? d.mansioni.map(function(m){ return mansione(m).nome; }).join(', ') : '&mdash;')+'</b></div>' +
        '</div>' +
        '<div class="nota-box"><label class="campo"><span>Note interne</span>' +
        '<textarea id="fasc-nota" rows="3" placeholder="Annotazioni sul dipendente">'+esc(d.nota||'')+'</textarea></label>' +
        '<button class="b b--sec b--min" data-salva-nota="'+d.id+'">Salva nota</button></div></div>' +

      '<div class="blocco"><div class="blocco__testa"><h2>Abilitazioni</h2>' +
        '<button class="b b--pri b--min" data-scheda-dip="'+d.id+'">Aggiungi</button></div>' +
        (d.abil.length ? '<div class="tabellone"><table><tbody>' + d.abil.map(function(a){
            var st=statoAbil(a.s);
            return '<tr><td><b>'+ABILITAZIONI[a.t]+'</b><small>scade il '+dataBreve(a.s)+'</small></td>' +

    // --- turni ---
    '<div class="blocco"><div class="blocco__testa"><h2>Turni in programma</h2>' +
      '<button class="b b--pri b--min" data-nuovoturno="'+oggiISO()+'|'+d.id+'">Assegna turno</button></div>' +
      (futuri.length ? '<div class="tabellone"><table><thead><tr><th>Quando</th><th>Orario</th><th>Postazione</th><th>Mansione</th><th>Stato</th><th></th></tr></thead><tbody>' +
        futuri.map(function(t){
          var st = t.conferma ? '<span class="p p--'+(t.conferma.fuoriArea?'att':'ok')+'">'+(t.conferma.fuoriArea?'fuori area':'timbrato')+'</span>'
                              : '<span class="p p--neutro">da timbrare</span>';
          return '<tr><td><b>'+dataBreve(t.data)+'</b></td><td class="num">'+t.inizio+'&ndash;'+t.fine+'</td>' +
                 '<td>'+loc(t.location).nome+'<small>'+loc(t.location).citta+'</small></td>' +
                 '<td>'+mansione(t.mansione).nome+(t.deroga?' <span class="p p--att">deroga</span>':'')+'</td><td>'+st+'</td>' +
                 '<td><button class="b b--sec b--min" data-turno="'+t.id+'">Apri</button></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessun turno in programma.</p>') + '</div>' +

    // --- timbrature GPS ---
    '<div class="blocco"><div class="blocco__testa"><h2>Timbrature con posizione</h2>' +
      '<span class="p p--'+(fuori?'att':'ok')+'">'+timbr.length+' registrate'+(fuori?', '+fuori+' fuori area':'')+'</span></div>' +
      (timbr.length ? '<div class="tabellone"><table><thead><tr><th>Giorno</th><th>Ora</th><th>Postazione</th><th>Distanza</th><th>Esito</th><th></th></tr></thead><tbody>' +
        timbr.map(function(t){
          return '<tr><td><b>'+dataBreve(t.data)+'</b></td><td class="num">'+t.conferma.ora+'</td>' +
                 '<td>'+loc(t.location).nome+'<small>'+loc(t.location).citta+'</small></td>' +
                 '<td class="num">'+distanzaTimbratura(t.conferma, loc(t.location).raggio)+'</td>' +
                 '<td><span class="p p--'+(t.conferma.fuoriArea?'att':'ok')+'">'+(t.conferma.fuoriArea?'fuori area':'in area')+'</span></td>' +
                 '<td><button class="b b--sec b--min" data-mappa="'+t.id+'">Vedi posizione</button></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessuna timbratura. Compaiono qui appena l&rsquo;operatore conferma un turno dal telefono.</p>') + '</div>' +

    // --- assenze, malattia, permessi ---
    '<div class="blocco"><div class="blocco__testa"><h2>Assenze, malattia e permessi</h2>' +
      (gestisce ? '<button class="b b--pri b--min" data-nuova-assenza="'+d.id+'">Registra assenza</button>' : '') + '</div>' +
      (ass.length ? '<div class="tabellone"><table><thead><tr><th>Motivo</th><th>Dal</th><th>Al</th><th>Giorni</th><th>Nota</th><th></th></tr></thead><tbody>' +
        ass.map(function(a){
          var corso = assenzaInCorso(a);
          var passata = giorniA(a.al) < 0;
          return '<tr><td><b>'+esc(a.tipo)+'</b>' +
                   (corso ? ' <span class="p p--att">in corso</span>' : (passata ? '' : ' <span class="p p--neutro">programmata</span>')) + '</td>' +
                 '<td class="num">'+dataBreve(a.dal)+'</td><td class="num">'+dataBreve(a.al)+'</td>' +
                 '<td class="num">'+giorniAssenza(a)+'</td>' +
                 '<td>'+(a.nota ? esc(a.nota) : '&mdash;')+'</td>' +
                 '<td>'+(gestisce ? '<button class="ics" data-elimina-assenza="'+a.id+'" title="Elimina" aria-label="Elimina assenza">&times;</button>' : '')+'</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessuna assenza registrata. Malattia, infortunio, ferie e permessi si annotano qui e il periodo resta nello storico.</p>') + '</div>' +

    // --- buste paga ---
    '<div class="blocco"><div class="blocco__testa"><h2>Buste paga</h2>' +
      '<button class="b b--pri b--min" data-carica-ced="'+d.id+'">Carica cedolino</button></div>' +
      (ced.length ? '<div class="tabellone"><table><thead><tr><th>Mese</th><th>File</th><th>Presa visione</th><th>Quando</th><th></th></tr></thead><tbody>' +
        ced.map(function(p){
          return '<tr><td><b>'+mesePerEsteso(p.mese)+'</b></td>' +
                 '<td>'+(p.file ? esc(p.file)+'<small>'+pesoLeggibile(p.peso)+'</small>' : '<span class="p p--neutro p--vuota">senza allegato</span>')+'</td>' +
                 '<td>'+(p.letto ? '<span class="p p--ok">scaricata</span>' : '<span class="p p--att">non ancora</span>')+'</td>' +
                 '<td class="num">'+(p.letto ? dataBreve(p.letto) : '&mdash;')+'</td>' +
                 '<td>'+(p.file ? '<button class="b b--sec b--min" data-apri-file="'+p.id+'">Apri</button>' : '')+'</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p class="vuoto">Nessun cedolino caricato.</p>') + '</div>'
  );
  agganciaAzioni();
}

VISTE.personalizza = function(){
  intesta('Personalizza', 'Cosa vede l&rsquo;amministratore, cosa vedono i dipendenti, quali funzioni sono attive. Nessuna riga di codice.');
  var ui = D.ui;

  function righeMenu(base, conf){
    return base.map(function(v){
      var c = conf[v.id] || { on:true, et:v.et };
      return '<tr><td><label class="spunta"><input type="checkbox" data-on="'+v.id+'"'+(c.on!==false?' checked':'')+'> visibile</label></td>' +
             '<td><input class="rinomina" data-et="'+v.id+'" value="'+esc(c.et||v.et)+'"></td>' +
             '<td><small>'+v.et+'</small></td></tr>';
    }).join('');
  }
  var FUNZ = [
    ['genera','Genera turni automaticamente'], ['esporta','Esporta il periodo'], ['stampa','Stampa'],
    ['creaAccount','Crea account dipendente'], ['deroga','Assegnazione in deroga'],
    ['gps','Conferma turno con GPS'], ['timbrature','Scheda Timbrature'], ['tema','Selettore chiaro/scuro']
  ];

  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Nome dell&rsquo;applicazione</h2></div>' +
      '<div style="padding:16px 18px"><input class="rinomina" id="ui-nome" value="'+esc(ui.nome)+'" style="max-width:320px"></div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Menu dell&rsquo;amministratore</h2></div>' +
      '<div class="tabellone"><table><thead><tr><th>Visibile</th><th>Etichetta</th><th>Voce</th></tr></thead>' +
      '<tbody data-menu="menuAdmin">'+righeMenu(VOCI_ADMIN, ui.menuAdmin)+'</tbody></table></div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Menu del dipendente</h2></div>' +
      '<div class="tabellone"><table><thead><tr><th>Visibile</th><th>Etichetta</th><th>Voce</th></tr></thead>' +
      '<tbody data-menu="menuDip">'+righeMenu(VOCI_DIP, ui.menuDip)+'</tbody></table></div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Funzioni attive</h2></div>' +
      '<div class="spunte" style="padding:16px 18px">' + FUNZ.map(function(f){
        return '<label class="spunta"><input type="checkbox" data-f="'+f[0]+'"'+(abilitata(f[0])?' checked':'')+'>'+f[1]+'</label>';
      }).join('') + '</div>' +
      '<p class="postilla">Una funzione spenta sparisce dall&rsquo;interfaccia per tutti. I dati restano: riaccendendola torna tutto.</p></div>' +

    '<div class="azioni" style="border:0;padding:0;margin-top:4px">' +
      '<button class="b b--sec" id="ui-ripristina">Ripristina predefiniti</button>' +
      '<button class="b b--pri" id="ui-salva">Salva personalizzazione</button></div>'
  );

  document.getElementById('ui-salva').onclick = function(){
    ui.nome = document.getElementById('ui-nome').value.trim() || 'Sicury Turni';
    ['menuAdmin','menuDip'].forEach(function(k){
      var corpo = document.querySelector('[data-menu="'+k+'"]');
      corpo.querySelectorAll('[data-on]').forEach(function(ch){
        ui[k][ch.dataset.on] = ui[k][ch.dataset.on] || {};
        ui[k][ch.dataset.on].on = ch.checked;
      });
      corpo.querySelectorAll('[data-et]').forEach(function(inp){
        ui[k][inp.dataset.et] = ui[k][inp.dataset.et] || {};
        ui[k][inp.dataset.et].et = inp.value.trim();
      });
    });
    document.querySelectorAll('[data-f]').forEach(function(ch){ ui.funzioni[ch.dataset.f] = ch.checked; });
    salva();
    document.querySelector('.lato .marchio strong').textContent = ui.nome;
    document.querySelector('.tema').hidden = !abilitata('tema');
    costruisciMenu(); vaiA('personalizza');
    apri('<h2>Salvato</h2><p class="foglio__nota">Le modifiche sono attive da subito per tutti gli utenti.</p>' +
         '<div class="azioni"><button class="b b--pri" id="ok">Chiudi</button></div>');
    document.getElementById('ok').onclick = chiudi;
  };
  document.getElementById('ui-ripristina').onclick = function(){
    D.ui = uiDiPartenza(); salva();
    document.querySelector('.lato .marchio strong').textContent = D.ui.nome;
    document.querySelector('.tema').hidden = false;
    costruisciMenu(); vaiA('personalizza');
  };
};

VISTE.dipendenti = function(){
  intesta('Dipendenti', D.dipendenti.length + ' account attivi');
  var righe = D.dipendenti.map(function(d){
    var peggiore = d.abil.map(function(a){ return statoAbil(a.s); })
                         .sort(function(a,b){ return a.g - b.g; })[0];
    var p = !d.abil.length ? '<span class="p p--neutro">nessuna</span>'
          : '<span class="p p--'+peggiore.cl+'">'+peggiore.et+'</span>';
    return '<tr><td><div class="persona">'+avatar(d.nome)+'<div><b>'+esc(d.nome)+'</b><small>'+esc(d.email)+'</small></div></div></td>' +
           '<td>'+d.mansioni.map(function(m){ return mansione(m).nome; }).join(', ')+'</td>' +
           '<td>'+d.abil.length+'</td><td>'+p+'</td>' +
           '<td><button class="b b--sec b--min" data-scheda="'+d.id+'">Scheda</button></td></tr>';
  }).join('');
  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Account dipendenti</h2>' +
      '<button class="b b--pri b--min" data-nuovo="1">Crea account</button></div>' +
      '<div class="tabellone"><table><thead><tr><th>Persona</th><th>Mansioni</th><th>Abilitazioni</th><th>Stato</th><th></th></tr></thead><tbody>'+righe+'</tbody></table></div></div>'
  );
  agganciaAzioni();
};

VISTE.scadenze = function(){
  intesta('Scadenzario', 'Abilitazioni scadute o in scadenza entro sessanta giorni');
  var sc = scadenzeAperte();
  var righe = sc.map(function(x){
    return '<tr><td><div class="persona">'+avatar(x.d.nome)+'<b>'+esc(x.d.nome)+'</b></div></td><td>'+ABILITAZIONI[x.a.t]+'</td>' +
           '<td>'+dataBreve(x.a.s)+'</td>' +
           '<td>'+(x.s.g < 0 ? 'da '+Math.abs(x.s.g)+' giorni' : 'fra '+x.s.g+' giorni')+'</td>' +
           '<td><span class="p p--'+x.s.cl+'">'+x.s.et+'</span></td></tr>';
  }).join('');
  dipingi('<div class="blocco"><div class="blocco__testa"><h2>Da rinnovare</h2>' +
    '<span class="p p--neutro">'+sc.length+' voci</span></div>' +
    (sc.length ? '<div class="tabellone"><table><thead><tr><th>Operatore</th><th>Abilitazione</th><th>Scadenza</th><th>Quando</th><th>Stato</th></tr></thead><tbody>'+righe+'</tbody></table></div>'
               : '<p class="vuoto">Nessuna scadenza aperta.</p>') + '</div>');
};

VISTE.commesse = function(){
  intesta('Commesse', 'Clienti e sedi di servizio');
  var html = D.clienti.map(function(c){
    var ls = D.location.filter(function(l){ return l.cliente === c.id; });
    var righe = ls.map(function(l){
      var n = D.turni.filter(function(t){ return t.location === l.id && giorniA(t.data) >= 0; }).length;
      return '<tr><td><b>'+l.nome+'</b><small>'+l.citta+'</small></td>' +
             '<td>'+l.lat.toFixed(4)+', '+l.lng.toFixed(4)+'</td>' +
             '<td>'+l.raggio+' m</td><td>'+n+'</td></tr>';
    }).join('');
    return '<div class="blocco"><div class="blocco__testa"><h2>'+esc(c.nome)+'</h2>' +
      '<span class="p p--neutro">'+ls.length+' location</span></div>' +
      '<div class="tabellone"><table><thead><tr><th>Location</th><th>Coordinate</th><th>Raggio</th><th>Turni futuri</th></tr></thead><tbody>'+righe+'</tbody></table></div></div>';
  }).join('');
  dipingi(html);
};

VISTE.cedolini = function(){
  intesta('Buste paga', 'Distribuzione dei cedolini e presa visione');
  var mesi = Array.from(new Set(D.cedolini.map(function(p){ return p.mese; }))).sort().reverse();
  var html = mesi.map(function(m){
    var gruppo = D.cedolini.filter(function(p){ return p.mese === m; });
    var letti = gruppo.filter(function(p){ return p.letto; }).length;
    var righe = gruppo.map(function(p){
      var d = dip(p.dipendente);
      return '<tr><td><div class="persona">'+avatar(d.nome)+'<b>'+esc(d.nome)+'</b></div></td>' +
             '<td>'+(p.letto ? '<span class="p p--ok">scaricata</span>' : '<span class="p p--neutro">non ancora</span>')+'</td>' +
             '<td>'+(p.letto ? dataBreve(p.letto) : '&mdash;')+'</td></tr>';
    }).join('');
    return '<div class="blocco"><div class="blocco__testa"><h2>'+mesePerEsteso(m)+'</h2>' +
      '<span class="p p--'+(letti===gruppo.length?'ok':'neutro')+'">'+letti+' su '+gruppo.length+' scaricate</span></div>' +
      '<div class="tabellone"><table><thead><tr><th>Dipendente</th><th>Presa visione</th><th>Quando</th></tr></thead><tbody>'+righe+'</tbody></table></div></div>';
  }).join('');
  dipingi(html);
};
