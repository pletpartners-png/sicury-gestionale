VISTE.profilo = function(){
  intesta('Il mio profilo', utente.nome);
  var righe = utente.abil.map(function(a){
    var s = statoAbil(a.s);
    return '<tr><td><b>'+ABILITAZIONI[a.t]+'</b></td><td>'+dataBreve(a.s)+'</td>' +
           '<td>'+(s.g < 0 ? 'scaduta da '+Math.abs(s.g)+' giorni' : 'fra '+s.g+' giorni')+'</td>' +
           '<td><span class="p p--'+s.cl+'">'+s.et+'</span></td></tr>';
  }).join('');
  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Il mio accesso</h2>' +
      '<button class="b b--pri b--min" data-cambia-pw="1">Cambia password</button></div>' +
      '<div class="dati"><div><span>Email</span><b>' + esc(utente.email) + '</b></div>' +
      '<div><span>Protezione</span><b>archivio cifrato su questo dispositivo</b></div></div>' +
      '<p class="vuoto">La password apre la chiave dei tuoi dati. Non comunicarla a nessuno: ' +
      'nemmeno il coordinatore pu&ograve; leggerla.</p></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Mansioni assegnate</h2></div>' +
      (utente.mansioni.length
        ? '<div style="padding:18px;display:flex;flex-wrap:wrap;gap:8px">' +
          utente.mansioni.map(function(m){ return '<span class="p p--neutro">'+mansione(m).nome+'</span>'; }).join('') + '</div>'
        : '<p class="vuoto">Nessuna mansione ancora assegnata. La imposta il coordinatore.</p>') + '</div>' +
    '<div class="blocco"><div class="blocco__testa"><h2>Le mie abilitazioni</h2></div>' +
      (utente.abil.length ? '<div class="tabellone"><table><thead><tr><th>Abilitazione</th><th>Scadenza</th><th>Quando</th><th>Stato</th></tr></thead><tbody>'+righe+'</tbody></table></div>'
                          : '<p class="vuoto">Nessuna abilitazione registrata.</p>') + '</div>'
  );
};

VISTE.miecedolini = function(){
  intesta('Le mie buste paga', 'Scarica il cedolino: resta traccia della presa visione');
  var miei = D.cedolini.filter(function(p){ return p.dipendente === utente.id; }).sort(function(a,b){ return b.mese.localeCompare(a.mese); });
  dipingi('<div class="blocco">' + (miei.length
    ? '<div class="tabellone"><table><thead><tr><th>Mese</th><th>Stato</th><th></th></tr></thead><tbody>' +
      miei.map(function(p){
        return '<tr><td><b>'+mesePerEsteso(p.mese)+'</b></td>' +
               '<td>'+(p.letto ? '<span class="p p--ok">scaricata il '+dataBreve(p.letto)+'</span>' : '<span class="p p--att">da scaricare</span>')+'</td>' +

/* ============ azioni ============ */

function agganciaAzioni(){
  var v = document.getElementById('vista');
  v.querySelectorAll('[data-scheda-dip]').forEach(function(b){ b.onclick = function(){ fogliaScheda(b.dataset.schedaDip); }; });
  v.querySelectorAll('[data-vai]').forEach(function(b){ b.onclick = function(){ vaiA(b.dataset.vai); }; });
  v.querySelectorAll('[data-assegna]').forEach(function(b){ b.onclick = function(){ fogliaAssegna(b.dataset.assegna); }; });
  v.querySelectorAll('[data-nuovo]').forEach(function(b){ b.onclick = fogliaNuovo; });
  v.querySelectorAll('[data-modcod]').forEach(function(b){ b.onclick = function(){ fogliaCodice(b.dataset.modcod); }; });
  v.querySelectorAll('[data-fascicolo]').forEach(function(b){ b.onclick = function(){ fascicoloAperto = b.dataset.fascicolo; vaiA('fascicoli'); }; });
  v.querySelectorAll('[data-chiudi-fascicolo]').forEach(function(b){ b.onclick = function(){ fascicoloAperto = null; vaiA('fascicoli'); }; });
  v.querySelectorAll('[data-carica-doc]').forEach(function(b){ b.onclick = function(){ fogliaDocumento(b.dataset.caricaDoc); }; });
  v.querySelectorAll('[data-elimina-doc]').forEach(function(b){ b.onclick = function(){
    var x = D.documenti.filter(function(y){ return y.id === b.dataset.eliminaDoc; })[0];
    if (x && x.file) eliminaFile(x.id).catch(function(){});
    if (x) annota(utente.email, 'eliminazione documento', x.nome);
    D.documenti = D.documenti.filter(function(y){ return y.id !== b.dataset.eliminaDoc; });
    salva(); vaiA('fascicoli'); }; });
  v.querySelectorAll('[data-carica-ced]').forEach(function(b){ b.onclick = function(){ fogliaCedolino(b.dataset.caricaCed); }; });
  v.querySelectorAll('[data-salva-nota]').forEach(function(b){ b.onclick = function(){
    dip(b.dataset.salvaNota).nota = document.getElementById('fasc-nota').value; salva();
    b.textContent = 'Nota salvata'; setTimeout(function(){ b.textContent = 'Salva nota'; }, 1800); }; });
  v.querySelectorAll('[data-mappa]').forEach(function(b){ b.onclick = function(){ fogliaMappa(b.dataset.mappa); }; });
  v.querySelectorAll('[data-apri-file]').forEach(function(b){ b.onclick = function(){
    b.disabled = true; var t = b.textContent; b.textContent = 'Apro\u2026';
    apriFileSalvato(b.dataset.apriFile).then(function(){ b.disabled = false; b.textContent = t; },
                                             function(){ b.disabled = false; b.textContent = t; }); }; });
  v.querySelectorAll('[data-elimina-dip]').forEach(function(b){ b.onclick = function(){ confermaEliminaDip(b.dataset.eliminaDip); }; });
  v.querySelectorAll('[data-nuova-assenza]').forEach(function(b){ b.onclick = function(){ fogliaAssenza(b.dataset.nuovaAssenza); }; });
  v.querySelectorAll('[data-nuova-richiesta]').forEach(function(b){ b.onclick = fogliaRichiesta; });
  v.querySelectorAll('[data-cambia-pw]').forEach(function(b){ b.onclick = function(){ fogliaCambiaPassword(false); }; });
  v.querySelectorAll('[data-esporta]').forEach(function(b){ b.onclick = fogliaEsporta; });
  v.querySelectorAll('[data-ripristina]').forEach(function(b){ b.onclick = fogliaRipristina; });
  v.querySelectorAll('[data-azzera]').forEach(function(b){ b.onclick = fogliaAzzera; });
  v.querySelectorAll('[data-decidi]').forEach(function(b){ b.onclick = function(){ fogliaDecisione(b.dataset.decidi); }; });
  v.querySelectorAll('[data-elimina-assenza]').forEach(function(b){ b.onclick = function(){
    D.assenze = D.assenze.filter(function(x){ return x.id !== b.dataset.eliminaAssenza; }); salva(); vaiA('fascicoli'); }; });
  v.querySelectorAll('[data-modesi]').forEach(function(b){ b.onclick = function(){ fogliaEsigenza(b.dataset.modesi); }; });
  v.querySelectorAll('[data-elimcod]').forEach(function(b){ b.onclick = function(){
    D.codici.splice(+b.dataset.elimcod,1); salva(); vaiA('config'); }; });
  v.querySelectorAll('[data-elimesi]').forEach(function(b){ b.onclick = function(){
    D.esigenze.splice(+b.dataset.elimesi,1); salva(); vaiA('config'); }; });
  v.querySelectorAll('[data-turno]').forEach(function(b){ b.onclick = function(){ fogliaTurno(b.dataset.turno); }; });
  v.querySelectorAll('[data-nuovoturno]').forEach(function(b){ b.onclick = function(){
    var q = b.dataset.nuovoturno.split('|'); fogliaTurno(null, q[0], q[1] || null); }; });
  v.querySelectorAll('[data-scheda-dip]').forEach(function(b){ b.onclick = function(){ fogliaScheda(b.dataset.schedaDip); }; });
  v.querySelectorAll('[data-conferma]').forEach(function(b){ b.onclick = function(){ confermaTurno(b.dataset.conferma); }; });
  v.querySelectorAll('[data-scarica]').forEach(function(b){ b.onclick = function(){ scarica(b.dataset.scarica); }; });
}

var velo = document.getElementById('velo'), foglio = document.getElementById('foglio');
function apri(html){ foglio.innerHTML = html; etichettaCelle(foglio); velo.hidden = false; }
function chiudi(){ velo.hidden = true; }
velo.addEventListener('click', function(e){ if (e.target === velo) chiudi(); });
addEventListener('keydown', function(e){ if (e.key === 'Escape') chiudi(); });

/* --- editor del turno: location, mansione, orario e operatore sono tutti modificabili --- */
function fogliaTurno(idTurno, preData, preDip){
  var nuovo = !idTurno;
  var t = nuovo
    ? { id:null, data:preData || oggiISO(), inizio:'09:00', fine:'17:00',
        location:D.location[0].id, mansione:'portierato', dipendente:preDip || null, conferma:null, deroga:false }
    : D.turni.find(function(x){ return x.id === idTurno; });

  apri(
    '<h2>'+(nuovo ? 'Nuovo turno' : 'Modifica turno')+'</h2>' +
    '<p class="foglio__nota">Location e mansione si scelgono turno per turno: la stessa persona pu&ograve; ' +
      'coprire il portierato luned&igrave; e fare il moviere marted&igrave;.</p>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Data</span><input type="date" id="f-data" value="'+t.data+'"></label>' +
      '<label class="campo"><span>Location</span><select id="f-loc">' +
        D.location.map(function(l){
          return '<option value="'+l.id+'"'+(l.id===t.location?' selected':'')+'>'+l.nome+' &mdash; '+l.citta+'</option>';
        }).join('') + '</select></label>' +
    '</div>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Inizio</span><input type="time" id="f-ini" value="'+t.inizio+'"></label>' +
      '<label class="campo"><span>Fine</span><input type="time" id="f-fin" value="'+t.fine+'"></label>' +
    '</div>' +
    '<label class="campo"><span>Mansione del turno</span><select id="f-mans">' +
      MANSIONI.map(function(m){
        return '<option value="'+m.id+'"'+(m.id===t.mansione?' selected':'')+'>'+m.nome+(m.abil?' \u00b7 richiede abilitazione':'')+'</option>';
      }).join('') + '</select></label>' +
    '<div id="f-operatori"></div>' +
    '<div class="azioni">' +
      (nuovo ? '' : '<button class="b b--sec" id="f-elimina">Elimina</button>') +
      '<button class="b b--sec" id="f-annulla">Annulla</button>' +
      '<button class="b b--pri" id="f-salva">'+(nuovo?'Crea turno':'Salva')+'</button>' +
    '</div>'
  );

  function operatori(){
    var mans = document.getElementById('f-mans').value;
    var m = mansione(mans);
    var val = D.dipendenti.map(function(d){ return { d:d, v:verifica(d, mans) }; });
    var idonei = val.filter(function(x){ return x.v.ok; });
    var esclusi = val.filter(function(x){ return !x.v.ok && x.d.mansioni.indexOf(mans) >= 0; });

    document.getElementById('f-operatori').innerHTML =
      (m.abil ? '<div class="campo"><span>Abilitazione richiesta</span><div><span class="p p--oro">'+ABILITAZIONI[m.abil]+'</span></div></div>' : '') +
      '<label class="campo"><span>Operatore &mdash; '+idonei.length+' idonei</span>' +
        '<select id="f-dip"><option value="">Lascia scoperto</option>' +
        idonei.map(function(x){
          return '<option value="'+x.d.id+'"'+(x.d.id===t.dipendente?' selected':'')+'>' +
                 esc(x.d.nome)+(x.v.avviso ? ' \u2014 ' + x.v.avviso : '')+'</option>';
        }).join('') + '</select></label>' +
      (esclusi.length ? '<div class="campo"><span>Bloccati dal sistema</span>' +
        esclusi.map(function(x){ return '<div class="errore"><b>'+esc(x.d.nome)+'</b> &mdash; '+x.v.motivo+'</div>'; }).join('') +

/* un'assenza occupa i giorni dal primo all'ultimo, estremi compresi */
function giorniAssenza(a){
  return Math.round((new Date(a.al+'T00:00:00') - new Date(a.dal+'T00:00:00'))/86400000) + 1;
}
function assenzaInCorso(a){ return giorniA(a.dal) <= 0 && giorniA(a.al) >= 0; }
function assenzeDi(idDip){
  return D.assenze.filter(function(a){ return a.dipendente === idDip; })
                  .sort(function(x,y){ return y.dal.localeCompare(x.dal); });
}

    '</div>' +

      salva(); fogliaDipendente(id);
    };
  });

    document.getElementById('agg').onclick = function(){
      var sc = document.getElementById('a-scad').value;
      var err = document.getElementById('n-err');
      if (!sc) { err.hidden = false; err.innerHTML = '<b>Manca la scadenza</b> dell&rsquo;abilitazione.'; return; }
      d.abil.push({ t:document.getElementById('a-tipo').value, s:sc });
      salva(); fogliaDipendente(id);
    };
  }

  document.getElementById('salva-dip').onclick = function(){
    var err  = document.getElementById('n-err');
    var nome = document.getElementById('n-nome').value.trim();
    var mail = document.getElementById('n-mail').value.trim();
    var pw   = document.getElementById('n-pw').value;
    var mans = [].slice.call(foglio.querySelectorAll('[data-mans]:checked')).map(function(i){ return i.value; });
    var sedi = [].slice.call(foglio.querySelectorAll('[data-sede]:checked')).map(function(i){ return i.value; });

    if (!nome || !mail) {
      err.hidden = false; err.innerHTML = '<b>Mancano dei dati.</b> Nome e email sono obbligatori.'; return; }
    if (nuovo && !pw) {
      err.hidden = false; err.innerHTML = '<b>Manca la password iniziale.</b> Serve al primo accesso.'; return; }
    var gia = D.dipendenti.concat(D.accessi).some(function(x){
      return x.email.toLowerCase() === mail.toLowerCase() && x.id !== d.id; });
    if (gia) { err.hidden = false; err.innerHTML = '<b>Email gi&agrave; in uso.</b> Ogni account ha la sua.'; return; }

    var scad = document.getElementById('n-cscad').value;
    var ass  = document.getElementById('n-cass').value;
    if (scad && ass && scad < ass) {
      err.hidden = false; err.innerHTML = '<b>Date incoerenti.</b> La scadenza del contratto precede l&rsquo;assunzione.'; return; }

    d.mansioni = mans; d.sedi = sedi;
    d.telefono = document.getElementById('n-tel').value.trim();
    d.cf = document.getElementById('n-cf').value.trim().toUpperCase();
    d.contratto = {
      tipo:      document.getElementById('n-ctipo').value,
      assunzione: ass,
      scadenza:  scad,
      ore:       document.getElementById('n-core').value,
      livello:   document.getElementById('n-cliv').value.trim()
    };
    var emailVecchia = nuovo ? null : d.email;
    d.nome = nome; d.email = mail;

    if (pw && pw.length < LUNGHEZZA_MINIMA) {
      err.hidden = false;
      err.innerHTML = '<b>Password troppo corta.</b> Servono almeno ' + LUNGHEZZA_MINIMA + ' caratteri.';
      return;
    }

    if (nuovo) { d.id = 'd' + Date.now().toString(36); D.dipendenti.push(d); }

    // la busta della chiave va rifatta se cambia la password o l'email
    var lavoro = Promise.resolve();
    if (pw) {
      if (emailVecchia && emailVecchia.toLowerCase() !== mail.toLowerCase()) togliUtenza(emailVecchia);
      lavoro = registraUtenza(mail, pw, DEK, true);
      annota(utente.email, nuovo ? 'creazione utenza' : 'reimpostazione password', mail);
    } else if (emailVecchia && emailVecchia.toLowerCase() !== mail.toLowerCase()) {
      // email cambiata senza nuova password: sposto la busta esistente
      var vecchia = utenzaDi(emailVecchia);
      if (vecchia) {
        togliUtenza(emailVecchia);
        var tutte = leggiUtenze();
        tutte.push(Object.assign({}, vecchia, { email:mail.toLowerCase() }));
        scriviUtenze(tutte);
      }
      annota(utente.email, 'cambio email utenza', emailVecchia + ' \u2192 ' + mail);
    }

    lavoro.then(function(){
      salva(); chiudi();
      if (nuovo) fascicoloAperto = d.id;
      vaiA(VISTE[vistaAttuale] ? vistaAttuale : 'fascicoli');
    }, function(){
      err.hidden = false; err.innerHTML = '<b>Non riesco a creare la chiave di accesso.</b> Riprova.';
    });
  };
}

/* ============ app installabile e senza rete ============
   Sul telefono il gestionale si aggiunge alla schermata Home e da li' si apre
   a tutto schermo, come un'applicazione. I dati stanno gia' nel dispositivo,
   quindi una volta installato funziona anche senza segnale: utile in servizio. */

var invitoInstalla = null;

(function(){
  if (!/^https?:/.test(location.protocol)) return;   // nel file unico non serve

  function testa(rel, href, extra){
    var l = document.createElement('link');
    l.rel = rel; l.href = href;
    if (extra) Object.keys(extra).forEach(function(k){ l.setAttribute(k, extra[k]); });
    document.head.appendChild(l);
  }
  function meta(n, c){
    var m = document.createElement('meta'); m.name = n; m.content = c; document.head.appendChild(m);
  }

  addEventListener('DOMContentLoaded', function(){
    testa('manifest', 'manifest.webmanifest');
    testa('apple-touch-icon', 'icone/apple-touch-icon.png');
    meta('apple-mobile-web-app-capable', 'yes');
    meta('apple-mobile-web-app-title', 'Sicury');
    meta('apple-mobile-web-app-status-bar-style', 'black-translucent');
    coloraBarraSistema();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){ /* niente offline, pazienza */ });
    }
  });

  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); invitoInstalla = e;
  });
  addEventListener('appinstalled', function(){ invitoInstalla = null; });
})();

function installabile(){
  return !!invitoInstalla ||
         (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone);
}

function fogliaInstalla(){
  var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  apri(
    '<h2>Installa Sicury Turni</h2>' +
    '<p class="foglio__nota">Sul telefono diventa un&rsquo;applicazione a tutto schermo e si apre ' +
      'anche senza segnale: i turni, le timbrature e i documenti restano consultabili in servizio.</p>' +
    (iOS
      ? '<ol class="passi"><li>Tocca il pulsante <b>Condividi</b> in fondo a Safari.</li>' +
        '<li>Scorri e scegli <b>Aggiungi a schermata Home</b>.</li>' +
        '<li>Conferma con <b>Aggiungi</b>.</li></ol>'
      : '<p class="foglio__nota">Bastano due tocchi: confermi e trovi lo stemma Sicury fra le tue app.</p>') +
    '<div class="azioni"><button class="b b--sec" id="annulla">Chiudi</button>' +
    (iOS ? '' : '<button class="b b--pri" id="installa">Installa</button>') + '</div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  var b = document.getElementById('installa');
  if (b) b.onclick = function(){
    chiudi();
    if (invitoInstalla) { invitoInstalla.prompt(); invitoInstalla = null; }
  };
}

/* --- ricerca rapida: una sola casella per persone, postazioni, clienti e turni ---
   Da tastiera si apre con Ctrl+K (cmd+K su Mac), da telefono dal menu. */
function apriRicerca(){
  apri(
    '<h2>Cerca ovunque</h2>' +
    '<label class="campo cerca__campo"><span>Persona, postazione, cliente, mansione o data</span>' +
      '<input id="cerca-q" type="search" autocomplete="off" placeholder="Es. Zanetti, Trieste, moviere, 12/10"></label>' +
    '<div id="cerca-esiti" class="cerca__esiti"><p class="vuoto">Scrivi almeno due lettere.</p></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Chiudi</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  var campo = document.getElementById('cerca-q');
  campo.oninput = function(){ disegnaEsiti(campo.value.trim()); };
  campo.onkeydown = function(e){
    if (e.key === 'Enter') {
      var primo = foglio.querySelector('.cerca__e');
      if (primo) primo.click();
    }
  };
  setTimeout(function(){ campo.focus(); }, 60);
}

function cerca(q){
  var t = q.toLowerCase();
  var r = [];
  function contiene(x){ return String(x || '').toLowerCase().indexOf(t) >= 0; }

  if (utente.admin) {
    D.dipendenti.forEach(function(d){
      if (contiene(d.nome) || contiene(d.email) || contiene(d.cf) || contiene(d.telefono) ||
          d.mansioni.some(function(m){ return contiene(mansione(m).nome); })) {
        r.push({ t:'Dipendente', et:d.nome, sub:d.email + ' \u00b7 ' + (d.mansioni.map(function(m){ return mansione(m).nome; }).join(', ') || 'nessuna mansione'),
                 ic:'fascicoli', vai:function(){ fascicoloAperto = d.id; vaiA('fascicoli'); } });
      }
    });
    D.location.forEach(function(l){
      if (contiene(l.nome) || contiene(l.citta)) {
        var n = D.turni.filter(function(x){ return x.location === l.id; }).length;
        r.push({ t:'Postazione', et:l.nome, sub:l.citta + ' \u00b7 ' + n + ' turni \u00b7 raggio ' + l.raggio + ' m',
                 ic:'commesse', vai:function(){ vaiA('commesse'); } });
      }
    });
    D.clienti.forEach(function(c){
      if (contiene(c.nome)) {
        r.push({ t:'Cliente', et:c.nome, sub:D.location.filter(function(l){ return l.cliente === c.id; }).length + ' postazioni',
                 ic:'commesse', vai:function(){ vaiA('commesse'); } });
      }
    });
  }

  var miei = utente.admin ? D.turni : D.turni.filter(function(x){ return x.dipendente === utente.id; });
  miei.forEach(function(x){
    var l = loc(x.location), d = x.dipendente ? dip(x.dipendente) : null;
    if (contiene(dataBreve(x.data)) || contiene(x.data) || contiene(l && l.nome) || contiene(l && l.citta) ||
        contiene(mansione(x.mansione).nome) || contiene(d && d.nome)) {
      r.push({ t:'Turno', et:dataBreve(x.data) + ' \u00b7 ' + x.inizio + '\u2013' + x.fine,
               sub:(l ? l.nome : '') + ' \u00b7 ' + mansione(x.mansione).nome + ' \u00b7 ' + (d ? d.nome : 'scoperto'),
               ic:'turni', vai:function(){ chiudi(); fogliaTurno(x.id); } });
    }
  });
  return r.slice(0, 24);
}

function disegnaEsiti(q){
  var box = document.getElementById('cerca-esiti');
  if (q.length < 2) { box.innerHTML = '<p class="vuoto">Scrivi almeno due lettere.</p>'; return; }
  var r = cerca(q);
  if (!r.length) { box.innerHTML = '<p class="vuoto">Nessun risultato per &laquo;' + esc(q) + '&raquo;.</p>'; return; }
  box.innerHTML = r.map(function(x, i){
    return '<button class="cerca__e" data-i="' + i + '">' + icona(x.ic) +
           '<span class="cerca__t"><b>' + esc(x.et) + '</b><small>' + esc(x.sub) + '</small></span>' +
           '<span class="p p--neutro">' + x.t + '</span></button>';
  }).join('');
  box.querySelectorAll('.cerca__e').forEach(function(b){
    b.onclick = function(){ var x = r[+b.dataset.i]; chiudi(); x.vai(); };
  });
}

addEventListener('DOMContentLoaded', function(){
  var b = document.getElementById('cerca-b');
  if (!b) return;
  b.innerHTML = icona('cerca') + '<span>Cerca</span><kbd>' +
    (/Mac|iPhone|iPad/.test(navigator.platform) ? '\u2318K' : 'Ctrl K') + '</kbd>';
  b.onclick = apriRicerca;
  var c = document.getElementById('campana');
  if (c) c.onclick = fogliaNotifiche;
});

addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && utente) {
    e.preventDefault(); apriRicerca();
  }
});

var LUNGHEZZA_MINIMA = 10;

/* Ogni account puo' cambiare la propria password: si riapre la chiave con la
   vecchia e si rimette in una busta nuova. L'archivio non si tocca. */
function fogliaCambiaPassword(obbligatorio){
  apri(
    '<h2>' + (obbligatorio ? 'Scegli la tua password' : 'Cambia la password') + '</h2>' +
    '<p class="foglio__nota">' + (obbligatorio
      ? 'Questa utenza usa ancora la password assegnata dall&rsquo;amministratore. Scegline una tua: &egrave; la chiave che apre l&rsquo;archivio cifrato.'
      : 'La password apre la chiave dell&rsquo;archivio. Cambiandola la chiave viene rimessa in una busta nuova.') + '</p>' +
    (obbligatorio ? '' : '<label class="campo"><span>Password attuale</span><input type="password" id="cp-vecchia" autocomplete="current-password"></label>') +
    '<label class="campo"><span>Nuova password</span><input type="password" id="cp-nuova" autocomplete="new-password"></label>' +
    '<label class="campo"><span>Ripeti la nuova password</span><input type="password" id="cp-due" autocomplete="new-password"></label>' +
    '<p class="foglio__nota">Almeno ' + LUNGHEZZA_MINIMA + ' caratteri. Se la perdi, i dati di questo dispositivo non sono recuperabili.</p>' +
    '<div class="errore" id="cp-err" hidden></div>' +
    '<div class="azioni">' + (obbligatorio ? '' : '<button class="b b--sec" id="annulla">Annulla</button>') +
    '<button class="b b--pri" id="cp-ok">Salva la password</button></div>'
  );
  var ann = document.getElementById('annulla');
  if (ann) ann.onclick = chiudi;

  document.getElementById('cp-ok').onclick = function(){
    var err = document.getElementById('cp-err');
    var nuova = document.getElementById('cp-nuova').value;
    var due   = document.getElementById('cp-due').value;
    function stop(t){ err.hidden = false; err.innerHTML = t; }
    if (nuova.length < LUNGHEZZA_MINIMA) return stop('<b>Troppo corta.</b> Servono almeno ' + LUNGHEZZA_MINIMA + ' caratteri.');
    if (nuova !== due) return stop('<b>Le due password non coincidono.</b>');

    var controllo = Promise.resolve(true);
    if (!obbligatorio) {
      var vecchia = document.getElementById('cp-vecchia').value;
      var u = utenzaDi(utente.email);
      controllo = chiaveDaPassword(vecchia, u.sale, u.giri)
        .then(function(kek){ return sfila(kek, u.busta); })
        .then(function(){ return true; }, function(){ return false; });
    }
    controllo.then(function(ok){
      if (!ok) return stop('<b>Password attuale sbagliata.</b>');
      return registraUtenza(utente.email, nuova, DEK, false).then(function(){
        annota(utente.email, 'cambio password');
        salva(); chiudi();
      });
    });
  };
}

/* --- assenze: malattia, infortunio, ferie, permessi --- */
function fogliaAssenza(idDip){
  var d = dip(idDip);
  apri(
    '<h2>Registra un&rsquo;assenza</h2>' +
    '<p class="foglio__nota">' + esc(d.nome) + '. Il periodo resta nello storico del fascicolo.</p>' +
    '<label class="campo"><span>Motivo</span><select id="as-tipo">' +
      TIPI_ASSENZA.map(function(t){ return '<option>' + t + '</option>'; }).join('') + '</select></label>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Dal</span><input type="date" id="as-dal" value="' + oggiISO() + '"></label>' +
      '<label class="campo"><span>Al</span><input type="date" id="as-al" value="' + oggiISO() + '"></label>' +
    '</div>' +
    '<label class="campo"><span>Nota</span><textarea id="as-nota" rows="2" placeholder="Protocollo del certificato, riferimenti, indicazioni"></textarea></label>' +
    '<div class="errore" id="as-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--pri" id="sal">Registra</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('sal').onclick = function(){
    var dal = document.getElementById('as-dal').value;
    var al  = document.getElementById('as-al').value;
    var err = document.getElementById('as-err');
    if (!dal || !al) { err.hidden = false; err.innerHTML = '<b>Mancano le date.</b> Servono inizio e fine.'; return; }
    if (al < dal)    { err.hidden = false; err.innerHTML = '<b>Date invertite.</b> La fine precede l&rsquo;inizio.'; return; }
    D.assenze.push({ id:'as' + Date.now().toString(36), dipendente:idDip,
                     tipo:document.getElementById('as-tipo').value, dal:dal, al:al,
                     nota:document.getElementById('as-nota').value.trim() });
    salva(); chiudi(); vaiA('fascicoli');
  };
}

/* --- eliminazione di un dipendente: si dice prima cosa sparisce --- */
function confermaEliminaDip(idDip){
  var d = dip(idDip);
  var futuri  = D.turni.filter(function(t){ return t.dipendente===idDip && giorniA(t.data) >= 0; });
  var passati = D.turni.filter(function(t){ return t.dipendente===idDip && giorniA(t.data) <  0; });
  var doc = D.documenti.filter(function(x){ return x.dipendente===idDip; });
  var ced = D.cedolini.filter(function(x){ return x.dipendente===idDip; });
  var ass = D.assenze.filter(function(x){ return x.dipendente===idDip; });
  var timbr = passati.filter(function(t){ return t.conferma; }).length;

  apri(
    '<h2>Eliminare ' + esc(d.nome) + '?</h2>' +
    '<p class="foglio__nota">L&rsquo;operazione non si pu&ograve; annullare.</p>' +
    '<div class="dati">' +
      '<div><span>Turni futuri</span><b>' + futuri.length + ' &rarr; restano da coprire</b></div>' +
      '<div><span>Turni passati</span><b>' + passati.length + ' eliminati' + (timbr ? ', con ' + timbr + ' timbrature' : '') + '</b></div>' +
      '<div><span>Documenti</span><b>' + doc.length + ' eliminati</b></div>' +
      '<div><span>Buste paga</span><b>' + ced.length + ' eliminate</b></div>' +
      '<div><span>Assenze</span><b>' + ass.length + ' eliminate</b></div>' +
    '</div>' +
    '<div class="errore">I <b>turni futuri non vengono cancellati</b>: tornano scoperti nel prospetto, ' +
      'cos&igrave; la pianificazione resta visibile e si riassegnano a un&rsquo;altra persona.</div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--all" id="elimina">Elimina definitivamente</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('elimina').onclick = function(){
    // i turni gia' svolti se ne vanno con la persona, quelli da venire restano scoperti
    D.turni = D.turni.filter(function(t){ return !(t.dipendente===idDip && giorniA(t.data) < 0); });
    D.turni.forEach(function(t){ if (t.dipendente===idDip) { t.dipendente = null; t.conferma = null; } });
    D.documenti = D.documenti.filter(function(x){ return x.dipendente !== idDip; });
    D.cedolini  = D.cedolini.filter(function(x){ return x.dipendente !== idDip; });
    D.assenze   = D.assenze.filter(function(x){ return x.dipendente !== idDip; });
    D.dipendenti = D.dipendenti.filter(function(x){ return x.id !== idDip; });
    togliUtenza(d.email);
    doc.concat(ced).forEach(function(x){ if (x.file) eliminaFile(x.id).catch(function(){}); });
    annota(utente.email, 'eliminazione dipendente', d.nome);
    if (fascicoloAperto === idDip) fascicoloAperto = null;
    salva(); chiudi(); vaiA(VISTE[vistaAttuale] ? vistaAttuale : 'fascicoli');
  };
}

function oraDiAdesso(){ return new Date().toTimeString().slice(0,5); }

/* Una timbratura puo' essere senza posizione: va detto, non inventato. */
function distanzaTimbratura(c, raggio){
  if (!c) return '&mdash;';
  if (c.senzaPosizione || c.distanza === null || c.distanza === undefined)
    return '<span class="p p--neutro p--vuota">senza posizione</span>';
  return c.distanza + ' m' + (raggio ? '<small>raggio ' + raggio + ' m</small>' : '');
}
function esitoTimbratura(c){
  if (!c) return '<span class="p p--neutro">da timbrare</span>';
  if (c.senzaPosizione) return '<span class="p p--att">senza posizione</span>';
  return '<span class="p p--' + (c.fuoriArea ? 'att' : 'ok') + '">' +
         (c.fuoriArea ? 'fuori area' : 'in area') + '</span>';
}

/* Chiede la posizione al dispositivo. Nessun ripiego inventato. */
function posizioneAttuale(){
  return new Promise(function(ris, no){
    if (!navigator.geolocation) {
      return no(new Error('Questo dispositivo non mette a disposizione la posizione.'));
    }
    if (!window.isSecureContext) {
      return no(new Error('La posizione si legge solo da un collegamento sicuro (https).'));
    }
    navigator.geolocation.getCurrentPosition(
      function(pos){
        ris({ lat:pos.coords.latitude, lng:pos.coords.longitude,
              precisione:Math.round(pos.coords.accuracy || 0) });
      },
      function(err){
        var m = 'Non riesco a leggere la posizione.';
        if (err.code === 1) m = 'Permesso negato. Consenti l\u2019accesso alla posizione nelle impostazioni del telefono, poi riprova.';
        if (err.code === 2) m = 'Segnale non disponibile. Prova all\u2019aperto o attendi qualche secondo.';
        if (err.code === 3) m = 'Il rilevamento ha impiegato troppo tempo. Riprova.';
        no(new Error(m));
      },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}

function mostraEsitoTimbratura(t, l, p){
  var m = distanza(l.lat, l.lng, p.lat, p.lng);
  // il margine di errore del GPS gioca a favore di chi timbra
  var fuori = (m - p.precisione) > l.raggio;
  var ora = oraDiAdesso();

  // la pianta mostra la direzione vera, non una a caso
  var dy = p.lat - l.lat, dx = (p.lng - l.lng) * Math.cos(l.lat * Math.PI / 180);
  var ang = Math.atan2(-dy, dx);
  var rr = Math.min(m / l.raggio, 1.4) * 62;
  var px = (100 + Math.cos(ang) * rr).toFixed(1);
  var py = (100 + Math.sin(ang) * rr).toFixed(1);
  var col = fuori ? 'var(--att)' : 'var(--ok)';
  var rp = Math.min((p.precisione / l.raggio) * 62, 80).toFixed(1);

  var pianta =
    '<svg class="pianta" viewBox="0 0 200 200" role="img" aria-label="Distanza dal punto di servizio">' +
      '<circle cx="100" cy="100" r="86" fill="none" stroke="var(--linea)" stroke-dasharray="2 6"/>' +
      '<circle cx="100" cy="100" r="62" fill="var(--ok-velo)" stroke="var(--ok)" stroke-dasharray="5 5" opacity=".85"/>' +
      '<line x1="100" y1="8" x2="100" y2="192" stroke="var(--linea)" stroke-width="1"/>' +
      '<line x1="8" y1="100" x2="192" y2="100" stroke="var(--linea)" stroke-width="1"/>' +
      '<circle cx="100" cy="100" r="5" fill="var(--marchio)"/>' +
      '<line x1="100" y1="100" x2="' + px + '" y2="' + py + '" stroke="' + col + '" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<circle cx="' + px + '" cy="' + py + '" r="' + rp + '" fill="' + col + '" opacity=".12"/>' +
      '<circle cx="' + px + '" cy="' + py + '" r="4.5" fill="' + col + '"/>' +
      '<text x="100" y="176" text-anchor="middle" font-size="9" fill="var(--tenue)" font-family="monospace">raggio ' + l.raggio + ' m</text>' +
    '</svg>';

  apri('<h2>' + (fuori ? 'Sei fuori dall&rsquo;area' : 'Servizio confermato') + '</h2>' +
    '<p class="foglio__nota">' + mansione(t.mansione).nome + ' &middot; ' + nomeLoc(t.location) + '</p>' +
    '<div class="pianta__box">' + pianta +
      '<div class="pianta__dati">' +
        '<div><span>Distanza</span><b style="color:' + col + '">' + m + ' m</b></div>' +
        '<div><span>Raggio consentito</span><b>' + l.raggio + ' m</b></div>' +
        '<div><span>Precisione del segnale</span><b>&plusmn; ' + p.precisione + ' m</b></div>' +
        '<div><span>Orario rilevato</span><b>' + ora + '</b></div>' +
      '</div></div>' +
    (fuori
      ? '<div class="errore">La conferma viene registrata come <b>fuori area</b> e segnalata al coordinatore. Il turno non viene bloccato.</div>'
      : '') +
    (p.precisione > l.raggio
      ? '<div class="nota-riga">Il segnale &egrave; impreciso (&plusmn; ' + p.precisione + ' m, pi&ugrave; largo del raggio consentito): ' +
        'il margine viene contato a tuo favore.</div>'
      : '') +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--pri" id="ok">Registra la conferma</button></div>');

  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('ok').onclick = function(){
    t.conferma = { ora:ora, distanza:m, fuoriArea:fuori, precisione:p.precisione };
    annota(utente.email, fuori ? 'timbratura fuori area' : 'timbratura',
           nomeLoc(t.location) + ' ' + dataBreve(t.data) + ' \u00b7 ' + m + ' m');
    salva(); chiudi(); vaiA('mieiturni');
  };
}

function scarica(idCed){
  var p = D.cedolini.find(function(x){ return x.id === idCed; });
  if (!p.letto) { p.letto = oggiISO(); annota(utente.email, 'presa visione busta paga', p.mese); salva(); }
  apri('<h2>Busta paga di ' + mesePerEsteso(p.mese) + '</h2>' +
    '<p class="foglio__nota">' + (p.file
      ? 'Il file \u00e8 conservato cifrato: viene aperto in chiaro solo adesso, sul tuo dispositivo.'
      : 'Per questo mese l\u2019amministrazione non ha ancora allegato il file.') + '</p>' +
    (p.file ? '<div class="dati"><div><span>File</span><b>' + esc(p.file) + '</b></div>' +
              '<div><span>Dimensione</span><b>' + pesoLeggibile(p.peso) + '</b></div></div>' : '') +

      dataBreve(p.letto) + '</span></div></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Chiudi</button>' +
      (p.file ? '<button class="b b--pri" id="scarica-ora">Scarica il PDF</button>' : '') + '</div>');
  document.getElementById('annulla').onclick = function(){ chiudi(); vaiA('miecedolini'); };
  var b = document.getElementById('scarica-ora');
  if (b) b.onclick = function(){
    b.disabled = true; b.textContent = 'Apro\u2026';
    apriFileSalvato(p.id).then(function(){ chiudi(); vaiA('miecedolini'); },
      function(){ b.disabled = false; b.textContent = 'Scarica il PDF'; });
  };
}

/* ============ avvio ============ */
/* Niente archivio in memoria finche' qualcuno non apre la cassaforte. */
preparaPrimoAvvio()
  .catch(function(e){ console.warn('Preparazione archivio:', e && e.message); })
  .then(function(){ elencoAccesso(); });

</script>
