<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sicury Turni</title>
</head>
<body>
<style>@page{size:landscape;margin:12mm}</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Sicury Turni \2014  impianto visivo
   Chiaro di giorno in ufficio, scuro di notte e sul campo.
   ========================================================= */

/* ---------- tema chiaro (predefinito) ---------- */
:root{
  --fondo:#F1F5FB;
  --superficie:#FFFFFF;
  --superficie2:#F7FAFE;
  --rilievo:0 1px 2px rgba(13,24,38,.06), 0 6px 18px -8px rgba(13,24,38,.14);
  --rilievo-alto:0 2px 6px rgba(13,24,38,.08), 0 18px 40px -14px rgba(13,24,38,.26);

  --inchiostro:#0A1326;
  --smorzato:#5A6B86;
  --tenue:#8294AE;
  --linea:#DAE2EF;
  --linea-tenue:#E9EFF8;

  /* stesso impianto del sito: cobalto dello smalto per le azioni, cromo per i dettagli */
  --marchio:#3D6CF5;
  --marchio-cont:#FFFFFF;
  --oro:#2A50C9;
  --oro-pieno:#3D6CF5;
  --oro-velo:#EAF0FE;

  --ok:#0F7A50;    --ok-velo:#E4F4EC;
  --att:#8F5C05;   --att-velo:#FCF0DC;
  --all:#B3352C;   --all-velo:#FBE9E7;

  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --testo:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* ---------- tema scuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-tema="chiaro"]){
    --fondo:#070D1E;
    --superficie:#0E1A33;
    --superficie2:#142242;
    --rilievo:0 1px 2px rgba(0,0,0,.4);
    --rilievo-alto:0 20px 50px -16px rgba(0,0,0,.7);

    --inchiostro:#EEF2F8;
    --smorzato:#93A4C4;
    --tenue:#6B7E9E;
    --linea:#1E2E50;
    --linea-tenue:#17243F;

    --marchio:#3D6CF5;
    --marchio-cont:#FFFFFF;
    --oro:#C9D3E0;
    --oro-pieno:#3D6CF5;
    --oro-velo:#15233F;

    --ok:#54C795;    --ok-velo:#10251C;
    --att:#EAA53F;   --att-velo:#26200F;
    --all:#E97268;   --all-velo:#2A1614;
  }
}
:root[data-tema="scuro"]{
  --fondo:#070D1E;
  --superficie:#0E1A33;
  --superficie2:#142242;
  --rilievo:0 1px 2px rgba(0,0,0,.4);
  --rilievo-alto:0 20px 50px -16px rgba(0,0,0,.7);
  --inchiostro:#EEF2F8;
  --smorzato:#93A4C4;
  --tenue:#6B7E9E;
  --linea:#1E2E50;
  --linea-tenue:#17243F;
  --marchio:#3D6CF5;
  --marchio-cont:#FFFFFF;
  --oro:#C9D3E0;
  --oro-pieno:#3D6CF5;
  --oro-velo:#15233F;
  --ok:#54C795;    --ok-velo:#10251C;
  --att:#EAA53F;   --att-velo:#26200F;
  --all:#E97268;   --all-velo:#2A1614;
}

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }

body{
  margin:0; background:var(--fondo); color:var(--inchiostro);
  font-family:var(--testo); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:var(--display); font-variation-settings:"wdth" 112; font-weight:700;
  margin:0; letter-spacing:-.022em; line-height:1.12; }
h1{ font-size:1.65rem; letter-spacing:-.03em; }
h2{ font-size:1rem; }
h3{ font-size:.94rem; font-variation-settings:"wdth" 104; }
p{ margin:0; }
button,input,select{ font-family:inherit; font-size:inherit; color:inherit; }
:where(button,a,input,select):focus-visible{ outline:2px solid var(--oro-pieno); outline-offset:2px; }

/* ---------- fascia di avviso ---------- */
.avviso{
  background:var(--marchio); color:#fff; text-align:center; padding:6px 16px;
  font-family:var(--mono); font-size:.66rem; letter-spacing:.11em; text-transform:uppercase;
}

/* ---------- marchio ---------- */
.marchio{ display:flex; align-items:center; gap:11px; }
.marchio img{ width:32px; height:auto; display:block; flex:none; }
.marchio strong{ display:block; font-family:var(--display); font-variation-settings:"wdth" 118;
  font-size:.98rem; line-height:1.15; letter-spacing:-.015em; }
.marchio em{ display:block; font-style:normal; font-family:var(--mono); font-size:.58rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--smorzato); margin-top:2px; }

/* ---------- accesso ---------- */
.accesso{ min-height:calc(100vh - 30px); display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(60% 55% at 50% 0%, var(--oro-velo), transparent 70%),
    var(--fondo); }
.accesso__box{ width:min(430px,100%); background:var(--superficie); border:1px solid var(--linea);
  border-radius:10px; box-shadow:var(--rilievo-alto); padding:32px 28px;
  display:flex; flex-direction:column; gap:8px; }
.accesso__stemma{ width:74px; height:auto; display:block; margin:0 auto 6px; }
.accesso__box h2{ text-align:center; font-size:1.2rem; }
.accesso__nota{ text-align:center; color:var(--smorzato); font-size:.88rem; margin-bottom:14px; }
.accesso__scelte{ display:flex; flex-direction:column; gap:6px; }
.utenza{ display:flex; align-items:center; gap:12px; padding:10px 12px; cursor:pointer;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:7px; text-align:left;
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
.utenza:hover{ border-color:var(--oro-pieno); transform:translateY(-1px); box-shadow:var(--rilievo); }
.utenza__t{ display:flex; flex-direction:column; line-height:1.3; }
.utenza__t b{ font-weight:650; font-size:.92rem; }
.utenza__t span{ font-family:var(--mono); font-size:.62rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--smorzato); }

/* ---------- pastiglia iniziali ---------- */
.ini{ width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:.68rem; font-weight:500; color:#fff; letter-spacing:.02em; }
.ini--g{ width:38px; height:38px; font-size:.76rem; }

/* ---------- impianto ---------- */
.app{ display:grid; grid-template-columns:224px 1fr; min-height:calc(100vh - 30px); }
.lato{ background:var(--superficie); border-right:1px solid var(--linea);
  padding:20px 16px; display:flex; flex-direction:column; gap:22px; position:relative; }
.lato__stemma{ position:absolute; left:50%; bottom:74px; transform:translateX(-50%);
  width:150px; opacity:.05; pointer-events:none; }
.menu{ display:flex; flex-direction:column; gap:2px; position:relative; z-index:1; }
.menu button{ background:none; border:0; color:var(--smorzato); text-align:left; cursor:pointer;
  padding:9px 12px; border-radius:7px; font-size:.9rem; font-weight:500;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  transition:background .15s ease, color .15s ease; }
.menu button:hover{ background:var(--superficie2); color:var(--inchiostro); }
.menu button[aria-current="true"]{ background:var(--marchio); color:var(--marchio-cont); font-weight:600; }
.menu .conta{ font-family:var(--mono); font-size:.68rem; opacity:.85; }
.piede{ margin-top:auto; display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
.tema{ display:flex; gap:3px; padding:3px; background:var(--superficie2);
  border:1px solid var(--linea); border-radius:8px; }
.tema button{ flex:1; background:none; border:0; cursor:pointer; padding:7px 4px; border-radius:6px;
  font-family:var(--mono); font-size:.6rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--smorzato); transition:background .15s ease, color .15s ease; }
.tema button[aria-pressed="true"]{ background:var(--superficie); color:var(--inchiostro); box-shadow:var(--rilievo); }
.esci{ background:none; border:1px solid var(--linea); color:var(--smorzato); border-radius:7px;
  padding:9px; cursor:pointer; font-size:.85rem; }
.esci:hover{ border-color:var(--all); color:var(--all); }

.tela{ padding:24px clamp(16px,2.6vw,32px) 60px; min-width:0; }
.testa{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
  margin-bottom:22px; flex-wrap:wrap; }
.testa__sub{ color:var(--smorzato); font-size:.9rem; margin-top:4px; }
.utente{ display:flex; align-items:center; gap:10px; background:var(--superficie);
  border:1px solid var(--linea); border-radius:99px; padding:5px 14px 5px 5px; box-shadow:var(--rilievo); }
.utente span{ font-size:.85rem; font-weight:600; }

@media (max-width:860px){
  .app{ grid-template-columns:1fr; }
  .lato{ border-right:0; border-bottom:1px solid var(--linea); }
  .lato__stemma{ display:none; }
  .menu{ flex-direction:row; flex-wrap:wrap; }
  .menu button{ flex:1 1 auto; justify-content:center; }
  .piede{ margin-top:14px; flex-direction:row; }
  .tema{ flex:1; } .esci{ flex:0 0 auto; padding-inline:18px; }
}

/* ---------- schede numeriche ---------- */
.riquadri{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px; }
.riq{ background:var(--superficie); border:1px solid var(--linea); border-radius:10px;
  padding:16px 18px 18px; box-shadow:var(--rilievo); position:relative; overflow:hidden; }
.riq::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tenue); }
.riq b{ display:block; font-family:var(--display); font-variation-settings:"wdth" 120; font-weight:800;
  font-size:2rem; line-height:1; letter-spacing:-.035em; font-variant-numeric:tabular-nums; }
.riq span{ display:block; margin-top:7px; font-family:var(--mono); font-size:.62rem;
  letter-spacing:.13em; text-transform:uppercase; color:var(--smorzato); }
.riq--ok::before{ background:var(--ok); } .riq--ok b{ color:var(--ok); }
.riq--att::before{ background:var(--att); } .riq--att b{ color:var(--att); }
.riq--all::before{ background:var(--all); } .riq--all b{ color:var(--all); }

/* ---------- blocchi ---------- */
.blocco{ background:var(--superficie); border:1px solid var(--linea); border-radius:10px;
  box-shadow:var(--rilievo); margin-bottom:20px; overflow:hidden; }
.blocco__testa{ display:flex; justify-content:space-between; align-items:center; gap:14px;
  padding:14px 18px; border-bottom:1px solid var(--linea-tenue); flex-wrap:wrap; }
.tabellone{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; min-width:540px; }
th,td{ text-align:left; padding:10px 18px; border-bottom:1px solid var(--linea-tenue);
  font-size:.88rem; vertical-align:middle; }
th{ font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--tenue); font-weight:400; background:var(--superficie2); }
tbody tr:last-child td{ border-bottom:0; }
tbody tr:hover{ background:var(--superficie2); }
td b{ font-weight:650; }
td small{ display:block; color:var(--smorzato); font-size:.78rem; }
.num{ font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:.82rem; }
.vuoto{ padding:36px 18px; text-align:center; color:var(--smorzato); font-size:.9rem; }
.vuoto img{ width:52px; opacity:.16; display:block; margin:0 auto 12px; }

/* persona in tabella */
.persona{ display:flex; align-items:center; gap:10px; }
.persona .ini{ width:28px; height:28px; font-size:.62rem; }

/* ---------- pastiglie ---------- */
.p{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:.62rem;
  letter-spacing:.07em; text-transform:uppercase; padding:4px 9px; border-radius:99px; white-space:nowrap;
  font-weight:500; }
.p::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.p--ok{ background:var(--ok-velo); color:var(--ok); }
.p--att{ background:var(--att-velo); color:var(--att); }
.p--all{ background:var(--all-velo); color:var(--all); }
.p--neutro{ background:var(--superficie2); color:var(--smorzato); border:1px solid var(--linea); }
.p--oro{ background:var(--oro-velo); color:var(--oro); }
.p--vuota::before{ display:none; }

/* ---------- pulsanti ---------- */
.b{ display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  padding:8px 15px; border-radius:7px; border:1px solid transparent; font-size:.86rem; font-weight:600;
  transition:background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease; }
.b--pri{ background:var(--marchio); color:var(--marchio-cont); }
.b--pri:hover{ transform:translateY(-1px); box-shadow:var(--rilievo); }
.b--sec{ background:var(--superficie); border-color:var(--linea); color:var(--inchiostro); }
.b--sec:hover{ border-color:var(--tenue); }
.b--min{ padding:5px 11px; font-size:.79rem; font-weight:500; border-radius:6px; }
.b:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- diagramma della giornata ---------- */
.giorno{ margin-bottom:20px; }
.assi{ display:grid; grid-template-columns:150px 1fr; align-items:end; padding:0 18px 6px;
  font-family:var(--mono); font-size:.6rem; color:var(--tenue); letter-spacing:.06em; }
.assi__ore{ display:grid; grid-template-columns:repeat(8,1fr); }
.assi__ore span{ border-left:1px solid var(--linea-tenue); padding-left:5px; }
.corsia{ display:grid; grid-template-columns:150px 1fr; align-items:center;
  border-top:1px solid var(--linea-tenue); }
.corsia__et{ padding:11px 12px 11px 18px; font-size:.8rem; line-height:1.3; }
.corsia__et b{ display:block; font-weight:650; }
.corsia__et small{ color:var(--smorzato); font-size:.73rem; }
.corsia__pista{ position:relative; height:52px; margin-right:18px;
  background:repeating-linear-gradient(90deg, var(--linea-tenue) 0 1px, transparent 1px 12.5%); }
.barra{ position:absolute; top:9px; bottom:9px; border-radius:6px; padding:0 9px;
  display:flex; align-items:center; gap:7px; overflow:hidden; cursor:pointer;
  border:1px solid; font-size:.75rem; min-width:56px;
  transition:transform .12s ease, box-shadow .12s ease; }
.barra:hover{ transform:translateY(-1px); box-shadow:var(--rilievo); z-index:2; }
.barra b{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.barra .ini{ width:19px; height:19px; font-size:.53rem; }
.barra--ok{ background:var(--ok-velo); border-color:var(--ok); color:var(--ok); }
.barra--pian{ background:var(--oro-velo); border-color:var(--oro-pieno); color:var(--oro); }
.barra--att{ background:var(--att-velo); border-color:var(--att); color:var(--att); }
.barra--scoperta{ background:transparent; border-style:dashed; border-color:var(--all); color:var(--all); }
@media (max-width:760px){
  .assi, .corsia{ grid-template-columns:1fr; }
  .assi__ore{ display:none; }
  .corsia__pista{ margin:0 18px 12px; }
  .corsia__et{ padding-bottom:2px; }
}

/* ---------- barra di copertura ---------- */
.copertura{ display:flex; align-items:center; gap:12px; padding:14px 18px; }
.copertura__barra{ flex:1; height:7px; border-radius:99px; background:var(--superficie2);
  border:1px solid var(--linea); overflow:hidden; }
.copertura__pieno{ height:100%; background:var(--ok); }
.copertura__et{ font-family:var(--mono); font-size:.7rem; color:var(--smorzato); white-space:nowrap; }

/* ---------- turni del dipendente ---------- */
.turni{ display:flex; flex-direction:column; gap:12px; }
.turno{ background:var(--superficie); border:1px solid var(--linea); border-radius:10px;
  box-shadow:var(--rilievo); padding:15px 18px; display:grid;
  grid-template-columns:66px 1fr auto; gap:16px; align-items:center;
  border-left:3px solid var(--tenue); }
.turno--oggi{ border-left-color:var(--oro-pieno); }
.turno--fatto{ border-left-color:var(--ok); }
.turno__q{ text-align:center; }
.turno__q b{ display:block; font-family:var(--display); font-variation-settings:"wdth" 120;
  font-weight:800; font-size:1.6rem; line-height:1; letter-spacing:-.03em; }
.turno__q span{ font-family:var(--mono); font-size:.6rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--smorzato); }
.turno__c h3{ margin-bottom:2px; }
.turno__c p{ color:var(--smorzato); font-size:.84rem; }
.turno__c .ora{ font-family:var(--mono); color:var(--oro); font-size:.8rem; margin-top:3px; }
.turno__a{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
@media (max-width:620px){
  .turno{ grid-template-columns:56px 1fr; }
  .turno__a{ grid-column:1/-1; flex-direction:row; align-items:center; }
}

/* ---------- foglio modale ---------- */
.velo{ position:fixed; inset:0; background:rgba(8,15,25,.55); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:20px; z-index:50; }
.foglio{ width:min(540px,100%); max-height:88vh; overflow:auto; background:var(--superficie);
  border:1px solid var(--linea); border-radius:12px; box-shadow:var(--rilievo-alto); padding:26px; }
.foglio h2{ margin-bottom:5px; font-size:1.15rem; }
.foglio__nota{ color:var(--smorzato); font-size:.86rem; margin-bottom:20px; }
.campo{ display:flex; flex-direction:column; gap:6px; margin-bottom:15px; }
.campo > span{ font-family:var(--mono); font-size:.62rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); }
.campo input, .campo select{ background:var(--superficie2); border:1px solid var(--linea);
  padding:9px 12px; border-radius:7px; }
.spunte{ display:flex; flex-wrap:wrap; gap:7px; }
.spunta{ display:flex; align-items:center; gap:7px; border:1px solid var(--linea);
  padding:6px 11px; border-radius:99px; cursor:pointer; font-size:.83rem; background:var(--superficie2); }
.spunta input{ accent-color:var(--oro-pieno); }
.spunta:has(input:checked){ border-color:var(--oro-pieno); color:var(--oro); background:var(--oro-velo); }
.azioni{ display:flex; gap:9px; justify-content:flex-end; margin-top:22px;
  padding-top:18px; border-top:1px solid var(--linea-tenue); }
.errore{ background:var(--all-velo); border-left:3px solid var(--all); border-radius:0 7px 7px 0;
  padding:11px 14px; font-size:.85rem; margin-bottom:12px; }
.errore b{ color:var(--all); }

/* ---------- rilevazione in corso ---------- */
.radar{ display:grid; place-items:center; padding:26px 0 8px; }
.radar__cerchio{ width:78px; height:78px; border-radius:50%; border:2px solid var(--oro-pieno);
  position:relative; display:grid; place-items:center; }
.radar__cerchio::after{ content:""; position:absolute; inset:-14px; border-radius:50%;
  border:1px solid var(--oro-pieno); opacity:.5; animation:onda 1.6s ease-out infinite; }
.radar__cerchio img{ width:34px; }
@keyframes onda{ from{ transform:scale(.75); opacity:.7; } to{ transform:scale(1.25); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .radar__cerchio::after{ animation:none; } }

/* ---------- indicatore dell'ora corrente ---------- */
.adesso{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--all); z-index:3;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--all) 18%, transparent); }
.adesso::before{ content:"adesso"; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:.53rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--all); white-space:nowrap; }

/* ---------- orologio operativo ---------- */
.ora-viva{ font-family:var(--mono); font-size:.78rem; font-variant-numeric:tabular-nums;
  color:var(--smorzato); letter-spacing:.04em; padding-right:4px; }

/* ---------- pianta di prossimita' ---------- */
.pianta__box{ display:grid; grid-template-columns:190px 1fr; gap:20px; align-items:center;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:10px;
  padding:16px; margin-bottom:16px; }
.pianta{ width:100%; height:auto; display:block; }
.pianta__dati{ display:grid; gap:12px; }
.pianta__dati div{ display:flex; flex-direction:column; gap:1px; }
.pianta__dati span{ font-family:var(--mono); font-size:.58rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); }
.pianta__dati b{ font-family:var(--display); font-variation-settings:"wdth" 116; font-weight:700;
  font-size:1.05rem; letter-spacing:-.02em; }
@media (max-width:520px){ .pianta__box{ grid-template-columns:1fr; } .pianta{ max-width:200px; margin:0 auto; } }

/* ---------- comparsa progressiva ---------- */
.entra{ animation:sali .45s cubic-bezier(.2,.7,.3,1) both; }
@keyframes sali{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .entra{ animation:none; } }

/* la barra del diagramma e' un pulsante: azzero gli stili nativi */
.barra{ font-family:inherit; color:inherit; text-align:left; }

/* ---------- campi affiancati ---------- */
.duecol{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:480px){ .duecol{ grid-template-columns:1fr; gap:0; } }

/* ---------- griglia di pianificazione ---------- */
.griglia{ min-width:1010px; }
.griglia th{ position:sticky; top:0; z-index:2; }
.griglia thead th.oggi{ color:var(--oro); background:var(--oro-velo); }
.griglia tbody th{ position:sticky; left:0; z-index:1; background:var(--superficie);
  border-right:1px solid var(--linea); text-align:left; padding:10px 14px;
  font-weight:400; width:186px; min-width:186px; max-width:186px; }
.griglia tbody th b{ font-weight:650; font-size:.84rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.griglia tbody th small{ color:var(--smorzato); font-size:.7rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.griglia td{ padding:6px; vertical-align:top; min-width:118px; position:relative;
  border-left:1px solid var(--linea-tenue); }
.griglia tbody tr:hover th{ background:var(--superficie2); }
.riga-scoperti th{ background:var(--all-velo) !important; }
.riga-scoperti td{ background:color-mix(in srgb, var(--all) 4%, transparent); }

.gettone{ display:block; width:100%; text-align:left; cursor:pointer; margin-bottom:5px;
  padding:7px 9px; border-radius:7px; border:1px solid; background:var(--superficie2);
  transition:transform .12s ease, box-shadow .12s ease; }
.gettone:hover{ transform:translateY(-1px); box-shadow:var(--rilievo); }
.gettone b{ display:block; font-family:var(--mono); font-size:.7rem; font-weight:500; letter-spacing:.02em; }
.gettone span{ display:block; font-size:.76rem; font-weight:600; line-height:1.25; margin-top:1px; }
.gettone small{ display:block; font-size:.68rem; opacity:.75; }
.gettone--ok{ border-color:var(--ok); color:var(--ok); background:var(--ok-velo); }
.gettone--pian{ border-color:var(--oro-pieno); color:var(--oro); background:var(--oro-velo); }
.gettone--att{ border-color:var(--att); color:var(--att); background:var(--att-velo); }
.gettone--scoperta{ border-color:var(--all); color:var(--all); background:transparent; border-style:dashed; }

.piu{ width:100%; padding:5px; border:1px dashed var(--linea); background:none; color:var(--tenue);
  border-radius:6px; cursor:pointer; font-size:.9rem; line-height:1; opacity:0;
  transition:opacity .15s ease, border-color .15s ease, color .15s ease; }
.griglia td:hover .piu{ opacity:1; }
.piu:hover{ border-color:var(--oro-pieno); color:var(--oro); }
.piu:focus-visible{ opacity:1; }

/* ---------- schede ---------- */
.schede{ display:inline-flex; gap:3px; padding:3px; background:var(--superficie2);
  border:1px solid var(--linea); border-radius:9px; margin-bottom:18px; }
.schede button{ background:none; border:0; cursor:pointer; padding:8px 18px; border-radius:6px;
  font-size:.87rem; font-weight:600; color:var(--smorzato);
  transition:background .15s ease, color .15s ease; }
.schede button[aria-pressed="true"]{ background:var(--marchio); color:var(--marchio-cont); }
.schede--min{ margin:0; }
.schede--min button{ padding:6px 13px; font-size:.79rem; font-weight:500; }
.schede--min button[aria-pressed="true"]{ background:var(--superficie); color:var(--inchiostro); box-shadow:var(--rilievo); }

/* ---------- pannello generatore ---------- */
.genera{ background:var(--superficie); border:1px solid var(--oro-pieno); border-radius:10px;
  padding:18px; margin-bottom:16px; box-shadow:var(--rilievo);
  background-image:linear-gradient(180deg, var(--oro-velo), transparent 70%); }
.genera__t b{ display:block; font-family:var(--display); font-variation-settings:"wdth" 112;
  font-size:.98rem; letter-spacing:-.015em; }
.genera__t span{ display:block; color:var(--smorzato); font-size:.83rem; margin:3px 0 13px; }
.genera__r{ display:flex; gap:10px; }
.genera__r input{ flex:1; background:var(--superficie); border:1px solid var(--linea);
  border-radius:8px; padding:11px 14px; font-size:.88rem; }
@media (max-width:620px){ .genera__r{ flex-direction:column; } }

/* ---------- comandi del periodo ---------- */
.comandi{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.comandi__nav{ display:flex; gap:4px; }
.comandi__et{ font-family:var(--mono); font-size:.78rem; color:var(--smorzato); }
.comandi__dx{ margin-left:auto; display:flex; gap:6px; }

/* ---------- legenda dei codici ---------- */
.legenda{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.cod{ display:inline-flex; align-items:center; gap:7px; background:var(--superficie);
  border:1px solid var(--linea); border-radius:8px; padding:7px 12px; font-size:.8rem; }
.cod i{ width:9px; height:9px; border-radius:2px; flex:none; }
.cod b{ font-family:var(--mono); font-weight:500; }
.cod small{ color:var(--smorzato); font-family:var(--mono); font-size:.72rem; }

/* ---------- intestazioni dei giorni ---------- */
.griglia thead th span{ display:block; font-family:var(--mono); font-size:.6rem;
  letter-spacing:.1em; text-transform:uppercase; color:var(--tenue); }
.griglia thead th b{ display:block; font-family:var(--display); font-variation-settings:"wdth" 118;
  font-size:1.2rem; font-weight:700; letter-spacing:-.03em; margin-top:1px; }
.griglia thead th.festivo{ color:var(--all); }
.griglia thead th.festivo span, .griglia thead th.festivo b{ color:var(--all); }

/* ---------- gettone con codice ---------- */
.gettone{ display:flex; align-items:center; gap:8px; }
.gettone__c{ width:22px; height:22px; flex:none; border-radius:5px; color:#fff;
  font-family:var(--mono); font-size:.7rem; font-weight:500; display:grid; place-items:center; }
.gettone__t{ min-width:0; }
.gettone__t b{ display:block; font-size:.76rem; font-weight:600; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gettone__t small{ display:block; font-size:.67rem; opacity:.8; font-family:var(--mono); }

/* ---------- area di esportazione ---------- */
.csv{ width:100%; height:210px; font-family:var(--mono); font-size:.72rem; line-height:1.7;
  background:var(--superficie2); border:1px solid var(--linea); border-radius:8px;
  padding:12px; resize:vertical; white-space:pre; }

/* ---------- stampa ---------- */
@media print{
  .avviso,.lato,.genera,.comandi,.schede,.velo,.piu,.testa__sub{ display:none !important; }
  body{ background:#fff; color:#000; }
  .app{ grid-template-columns:1fr; }
  .blocco{ border:1px solid #999; box-shadow:none; }
  .griglia{ min-width:0; font-size:9pt; }
  .gettone{ border:1px solid #999 !important; color:#000 !important; background:#fff !important; }
}

/* ---------- configurazione ---------- */
.postilla{ padding:12px 18px 16px; color:var(--smorzato); font-size:.82rem;
  border-top:1px solid var(--linea-tenue); }
.gio{ display:inline-block; font-family:var(--mono); font-size:.62rem; letter-spacing:.05em;
  padding:3px 6px; border-radius:4px; margin-right:3px;
  background:var(--superficie2); color:var(--tenue); border:1px solid var(--linea); }
.gio--on{ background:var(--marchio); color:var(--marchio-cont); border-color:var(--marchio); }
.campo input[type="color"]{ height:40px; padding:4px; cursor:pointer; }

/* ---------- modulo di accesso ---------- */
.login{ display:flex; flex-direction:column; gap:2px; margin-top:6px; }
.login .campo input{ padding:11px 13px; }
.demo{ margin-top:16px; border-top:1px solid var(--linea-tenue); padding-top:12px; }
.demo summary{ cursor:pointer; font-family:var(--mono); font-size:.64rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tenue); list-style:none; }
.demo summary::before{ content:"\25B8  "; }
.demo[open] summary::before{ content:"\25BE  "; }
.demo__t{ width:100%; min-width:0; margin:10px 0 12px; font-size:.76rem; }
.demo__t td{ padding:5px 4px; border-bottom:1px solid var(--linea-tenue); }
.demo__t code{ font-family:var(--mono); font-size:.72rem; background:var(--superficie2);
  padding:2px 6px; border-radius:4px; border:1px solid var(--linea); }
.demo__r{ display:flex; flex-direction:column; gap:5px; }
.demo__r .utenza{ padding:7px 10px; }
.demo__r .utenza .ini{ width:26px; height:26px; font-size:.58rem; }

/* ---------- voce riservata allo sviluppatore ---------- */
.menu__dev{ margin-top:10px; border-top:1px dashed var(--linea); padding-top:14px !important;
  border-radius:0 0 7px 7px !important; }
.menu__dev::before{ content:"\2699  "; opacity:.7; }
.menu__dev[aria-current="true"]{ border-radius:7px !important; }

/* ---------- campi di rinomina ---------- */
.rinomina{ width:100%; background:var(--superficie2); border:1px solid var(--linea);
  padding:7px 10px; border-radius:6px; font-size:.86rem; }
.rinomina:focus{ border-color:var(--oro-pieno); }

</style>

  var b=unescape(encodeURIComponent(str)), l=b.length, w=[], i;
  for(i=0;i<l;i++) w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8); w[((l+8>>6)<<4)+15]=l*8;
  var r=function(x,n){return(x>>>n)|(x<<(32-n));};
  for(var j=0;j<w.length;j+=16){
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7],W=[];
    for(i=0;i<64;i++){

var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var GIORNI = ['dom','lun','mar','mer','gio','ven','sab'];

function oggiISO(){ var d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function giorniA(iso){ return Math.round((new Date(iso+'T00:00:00') - new Date(oggiISO()+'T00:00:00'))/86400000); }
function dataBreve(iso){ var d = new Date(iso+'T00:00:00'); return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]; }
function esc(s){ return String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* pastiglia con le iniziali, colore stabile per persona */
var COLORI = ['#2E5E8C','#4A4FA8','#1E6E7A','#5B5F8C','#3D6CF5','#2F6E6E','#5C4B9E','#36507F'];
function iniziali(nome){ return nome.split(' ').map(function(p){ return p[0]; }).join('').slice(0,2).toUpperCase(); }
function tinta(nome){ var n = 0; for (var i=0;i<nome.length;i++) n = (n*31 + nome.charCodeAt(i)) >>> 0; return COLORI[n % COLORI.length]; }
function avatar(nome, grande){
  return '<span class="ini'+(grande?' ini--g':'')+'" style="background:'+tinta(nome)+'">'+iniziali(nome)+'</span>';
}

/* stato di un'abilitazione rispetto a oggi */
function statoAbil(scadenza){
  var g = giorniA(scadenza);
  if (g < 0)  return { cl:'all', et:'scaduta', g:g };
  if (g <= 60) return { cl:'att', et:'in scadenza', g:g };
  return { cl:'ok', et:'valida', g:g };
}

/* l'operatore puo' coprire questa mansione? */
function verifica(dipendente, mansioneId){
  var m = mansione(mansioneId);
  if (!dipendente.mansioni.includes(mansioneId)) {
    return { ok:false, motivo:'Non ha questa mansione fra quelle assegnate.' };
  }
  if (!m.abil) return { ok:true };
  var a = dipendente.abil.find(function(x){ return x.t === m.abil; });
  if (!a) return { ok:false, motivo:'Manca l\u2019abilitazione richiesta: ' + ABILITAZIONI[m.abil] + '.' };
  var s = statoAbil(a.s);
  if (s.g < 0) return { ok:false, motivo:ABILITAZIONI[m.abil] + ' scaduta da ' + Math.abs(s.g) + ' giorni.' };
  return { ok:true, avviso: s.g <= 60 ? ABILITAZIONI[m.abil] + ' scade fra ' + s.g + ' giorni.' : null };
}

/* distanza in metri fra due coordinate */
function distanza(a, b, c, d){
  var R = 6371000, p = Math.PI/180;
  var dl = (c-a)*p, dg = (d-b)*p;
  var x = Math.sin(dl/2)*Math.sin(dl/2) + Math.cos(a*p)*Math.cos(c*p)*Math.sin(dg/2)*Math.sin(dg/2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)));
}

VISTE.turni = function(){
  intesta('Turni', 'Diagramma della giornata: ogni corsia &egrave; una postazione');
  var futuri = D.turni.filter(function(t){ return giorniA(t.data) >= 0; })
                      .sort(function(a,b){ return a.data.localeCompare(b.data); });
  var perGiorno = {};
  futuri.forEach(function(t){ (perGiorno[t.data] = perGiorno[t.data] || []).push(t); });

  var ore = [0,3,6,9,12,15,18,21];
  var html = Object.keys(perGiorno).sort().slice(0,7).map(function(g){
    var elenco = perGiorno[g];
    var perLoc = {};
    elenco.forEach(function(t){ (perLoc[t.location] = perLoc[t.location] || []).push(t); });
    var coperti = elenco.filter(function(t){ return t.dipendente; }).length;
    var quota = Math.round(coperti / elenco.length * 100);
    var oggi = g === oggiISO();

    var corsie = Object.keys(perLoc).map(function(idL){
      var l = loc(idL);
      var barre = perLoc[idL].map(function(t){
        var a = minuti(t.inizio), b = minuti(t.fine);
        if (b <= a) b = 1440;
        var sx = a/1440*100, la = (b-a)/1440*100;
        var d = t.dipendente && dip(t.dipendente);
        var cl = !d ? 'scoperta' : (t.conferma ? (t.conferma.fuoriArea ? 'att' : 'ok') : 'pian');
        var dentro = d ? avatar(d.nome) + '<b>' + esc(d.nome.split(' ')[0]) + '</b>'
                       : '<b>' + mansione(t.mansione).nome + '</b>';
        return '<button class="barra barra--'+cl+'" data-assegna="'+t.id+'" ' +
               'style="left:'+sx.toFixed(2)+'%;width:'+la.toFixed(2)+'%" ' +
               'title="'+t.inizio+'&ndash;'+t.fine+' &middot; '+mansione(t.mansione).nome+'">'+dentro+'</button>';
      }).join('');
      var adesso = oggi ? '<span class="adesso" style="left:'+(oraOra()/1440*100).toFixed(2)+'%"></span>' : '';
      return '<div class="corsia"><div class="corsia__et"><b>'+l.nome+'</b><small>'+l.citta+' &middot; '+nomeCli(idL)+'</small></div>' +
             '<div class="corsia__pista">'+adesso+barre+'</div></div>';
    }).join('');

    return '<div class="blocco giorno"><div class="blocco__testa">' +
      '<h2>'+dataBreve(g)+(oggi?' <span class="p p--oro p--vuota">oggi</span>':'')+'</h2>' +
      '<span class="p p--'+(quota===100?'ok':'att')+'">'+coperti+' su '+elenco.length+' coperti</span></div>' +
      '<div class="copertura"><div class="copertura__barra"><div class="copertura__pieno" style="width:'+quota+'%"></div></div>' +
      '<span class="copertura__et">'+quota+'% di copertura</span></div>' +
      '<div class="assi"><span></span><div class="assi__ore">' +
        ore.map(function(o){ return '<span>'+(o<10?'0':'')+o+':00</span>'; }).join('') + '</div></div>' +
      corsie + '</div>';
  }).join('');

  dipingi(html);
  agganciaAzioni();
};

var pianState = { scheda:'turni', dal:null, settimane:1, vincoli:'' };

function lunediDi(d){ var x = new Date(d); var g = (x.getDay()+6)%7; x.setDate(x.getDate()-g); x.setHours(0,0,0,0); return x; }
function isoDi(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

VISTE.pianifica = function(){
  if (!pianState.dal) pianState.dal = isoDi(lunediDi(new Date()));
  intesta('Personale e turni', 'Griglia di pianificazione: ogni casella porta con s&eacute; codice, location e mansione');

  var schede = [['turni','Turni'],['staff','Staff']].concat(abilitata('timbrature') ? [['timbrature','Timbrature']] : []);
  if (pianState.scheda === 'timbrature' && !abilitata('timbrature')) pianState.scheda = 'turni';
  var barra = '<div class="schede">' + schede.map(function(x){
      return '<button data-scheda="'+x[0]+'" aria-pressed="'+(pianState.scheda===x[0])+'">'+x[1]+'</button>';
    }).join('') + '</div>';

  document.getElementById('vista').innerHTML = barra + '<div id="sotto"></div>';
  document.querySelectorAll('[data-scheda]').forEach(function(b){
    b.onclick = function(){ pianState.scheda = b.dataset.scheda; VISTE.pianifica(); };
  });

  if (pianState.scheda === 'turni') schedaTurni();
  else if (pianState.scheda === 'staff') schedaStaff();
  else schedaTimbrature();
};

function giorniIntervallo(){
  var out = [], n = pianState.settimane * 7;
  var d = new Date(pianState.dal + 'T00:00:00');
  for (var i = 0; i < n; i++) { out.push(isoDi(d)); d.setDate(d.getDate()+1); }
  return out;
}

function schedaTurni(){
  var giorni = giorniIntervallo();
  var etichetta = dataBreve(giorni[0]) + ' &ndash; ' + dataBreve(giorni[giorni.length-1]);

  var legenda = '<div class="legenda">' + codici().map(function(c){
      return '<span class="cod"><i style="background:'+c.col+'"></i><b>'+c.id+'</b> '+c.et+
             (c.ini ? ' <small>'+c.ini+'&ndash;'+c.fin+'</small>' : '') + '</span>';
    }).join('') + '</div>';

  var scelteSett = [[1,'1 sett.'],[2,'2 sett.'],[4,'Mese']].map(function(x){
      return '<button data-sett="'+x[0]+'" aria-pressed="'+(pianState.settimane===x[0])+'">'+x[1]+'</button>';
    }).join('');

  function cella(t){
    var l = loc(t.location);
    var cid = codiceDaOrario(t.inizio, t.fine);
    var c = codice(cid);
    var st = !t.dipendente ? 'scoperta' : (t.conferma ? (t.conferma.fuoriArea ? 'att' : 'ok') : 'pian');
    return '<button class="gettone gettone--'+st+'" data-turno="'+t.id+'">' +
             '<span class="gettone__c" style="background:'+c.col+'">'+cid+'</span>' +
             '<span class="gettone__t"><b>'+mansione(t.mansione).nome+'</b>' +
             '<small>'+l.citta+' &middot; '+t.inizio+'&ndash;'+t.fine+'</small></span>' +
           '</button>';
  }

  var scoperti = giorni.map(function(g){
    return '<td>' + D.turni.filter(function(t){ return t.data === g && !t.dipendente; }).map(cella).join('') + '</td>';
  }).join('');

  var righe = D.dipendenti.map(function(d){
    var celle = giorni.map(function(g){
      var ts = D.turni.filter(function(t){ return t.data === g && t.dipendente === d.id; });
      return '<td>' + ts.map(cella).join('') +
             '<button class="piu" data-nuovoturno="'+g+'|'+d.id+'" title="Aggiungi turno">+</button></td>';
    }).join('');
    return '<tr><th scope="row"><div class="persona">'+avatar(d.nome)+'<div><b>'+esc(d.nome)+'</b>' +
           '<small>'+mansione(d.mansioni[0]).nome+(d.mansioni.length>1?' +'+(d.mansioni.length-1):'')+'</small></div></div></th>' +
           celle + '</tr>';
  }).join('');

  document.getElementById('sotto').innerHTML =
    (abilitata('genera') ? '<div class="genera">' : '<div class="genera" hidden>') +
      '<div class="genera__t"><b>Genera i turni automaticamente</b>' +
      '<span>Algoritmo locale, nessun servizio esterno. Copre il fabbisogno di ogni location rispettando abilitazioni e riposi.</span></div>' +
      '<div class="genera__r"><input id="vincoli" placeholder="Es: Marco no sabato &middot; Sara solo mattine &middot; Luca due giorni liberi" value="'+esc(pianState.vincoli)+'">' +
      '<button class="b b--pri" id="genera">Genera turni</button></div>' +
    '</div>' +
    '<div class="comandi">' +
      '<div class="comandi__nav"><button class="b b--sec b--min" id="pre">&lsaquo;</button>' +
      '<button class="b b--sec b--min" id="oggi">Oggi</button>' +
      '<button class="b b--sec b--min" id="suc">&rsaquo;</button></div>' +
      '<div class="schede schede--min">'+scelteSett+'</div>' +
      '<span class="comandi__et">'+etichetta+'</span>' +
      '<div class="comandi__dx">' +
        (abilitata('stampa') ? '<button class="b b--sec b--min" id="stampa">Stampa</button>' : '') +
        (abilitata('esporta') ? '<button class="b b--sec b--min" id="csv">Esporta</button>' : '') + '</div>' +
    '</div>' +
    legenda +

               '<span>'+GIORNI[d.getDay()]+'</span><b>'+d.getDate()+'</b></th>';
      }).join('') + '</tr></thead><tbody>' +
      '<tr class="riga-scoperti"><th scope="row"><b>Da assegnare</b><small>fabbisogno non coperto</small></th>'+scoperti+'</tr>' +

  document.getElementById('pre').onclick  = function(){ spostaSettimane(-pianState.settimane); };
  document.getElementById('suc').onclick  = function(){ spostaSettimane(pianState.settimane); };
  document.getElementById('oggi').onclick = function(){ pianState.dal = isoDi(lunediDi(new Date())); VISTE.pianifica(); };

    b.onclick = function(){ pianState.settimane = +b.dataset.sett; VISTE.pianifica(); };
  });
  document.getElementById('genera').onclick = function(){
    pianState.vincoli = document.getElementById('vincoli').value;
    generaTurni(giorni, pianState.vincoli);
  };

  var bc = document.getElementById('csv');    if (bc) bc.onclick = function(){ fogliaCsv(giorni); };

}

function spostaSettimane(n){
  var d = new Date(pianState.dal + 'T00:00:00');
  d.setDate(d.getDate() + n*7);
  pianState.dal = isoDi(d);
  VISTE.pianifica();
}

/* ---- generatore: copre il fabbisogno rispettando abilitazioni, riposi e stacco minimo ---- */
var GIORNI_TESTO = { lun:0, "luned\u00ec":0, mar:1, "marted\u00ec":1, mer:2, "mercoled\u00ec":2,
  gio:3, "gioved\u00ec":3, ven:4, "venerd\u00ec":4, sab:5, sabato:5, dom:6, domenica:6 };
var NUMERI_TESTO = { uno:1, due:2, tre:3, quattro:4, cinque:5, sei:6 };

function leggiVincoli(testo){
  var v = {};
  D.dipendenti.forEach(function(d){
    var nome = d.nome.split(' ')[0].toLowerCase();
    var reg = { riposiFissi:new Set(), minRiposi:2, soloCodici:null };
    (testo || '').toLowerCase().split(/[,;.\n\u00b7]+/).forEach(function(seg){
      if (seg.indexOf(nome) < 0) return;
      if (/\bno\b|riposo|libero|libera|off/.test(seg)) {
        Object.keys(GIORNI_TESTO).forEach(function(g){
          if (new RegExp('\\b'+g+'\\b').test(seg)) reg.riposiFissi.add(GIORNI_TESTO[g]);
        });
        var n = seg.match(/(\d+)\s*giorn/);
        if (n) reg.minRiposi = Math.max(1, Math.min(+n[1], 5));
        Object.keys(NUMERI_TESTO).forEach(function(w){
          if (seg.indexOf(w) >= 0 && seg.indexOf('giorn') >= 0) reg.minRiposi = NUMERI_TESTO[w];
        });
      }
      if (/solo mattin/.test(seg)) reg.soloCodici = ['M','A'];
      else if (/solo notte|solo nott/.test(seg)) reg.soloCodici = ['N'];
      else if (/solo pomerig/.test(seg)) reg.soloCodici = ['P'];
    });
    v[d.id] = reg;
  });
  return v;
}

function generaTurni(giorni, testo){
  var vincoli = leggiVincoli(testo);
  // via i turni non ancora confermati nell'intervallo: quelli timbrati non si toccano
  D.turni = D.turni.filter(function(t){ return giorni.indexOf(t.data) < 0 || t.conferma; });

  var conteggio = {}; D.dipendenti.forEach(function(d){ conteggio[d.id] = 0; });
  var creati = 0, scoperti = 0;

  giorni.forEach(function(g){
    var dow = (new Date(g+'T00:00:00').getDay()+6)%7;
    D.esigenze.forEach(function(e){
      if (e.giorni.indexOf(dow) < 0) return;
      var c = codice(e.cod);
      if (D.turni.some(function(t){ return t.data===g && t.location===e.location && t.mansione===e.mans && t.inizio===c.ini; })) return;

      var candidati = D.dipendenti.filter(function(d){
        var reg = vincoli[d.id];
        if (!verifica(d, e.mans).ok) return false;
        if (reg.riposiFissi.has(dow)) return false;
        if (reg.soloCodici && reg.soloCodici.indexOf(e.cod) < 0) return false;
        if (D.turni.some(function(t){ return t.data===g && t.dipendente===d.id; })) return false;
        // stacco minimo: niente mattina dopo una notte
        var ieri = new Date(g+'T00:00:00'); ieri.setDate(ieri.getDate()-1);
        if (e.cod==='M' || e.cod==='A') {
          if (D.turni.some(function(t){ return t.data===isoDi(ieri) && t.dipendente===d.id && t.inizio==='22:00'; })) return false;
        }
        return true;
      }).sort(function(a,b){ return conteggio[a.id] - conteggio[b.id]; });

      var scelto = candidati[0] || null;
      if (scelto) { conteggio[scelto.id]++; creati++; } else { scoperti++; }
      D.turni.push({ id:'g'+(Date.now()%1e7)+'-'+creati+'-'+scoperti, data:g, location:e.location,
        mansione:e.mans, dipendente:scelto ? scelto.id : null,
        inizio:c.ini, fine:c.fin, conferma:null, deroga:false });
    });
  });

  salva();
  VISTE.pianifica();
  apri('<h2>Turni generati</h2>' +
    '<p class="foglio__nota">Su '+giorni.length+' giorni, coprendo il fabbisogno di ogni location.</p>' +
    '<div class="riquadri" style="margin:0 0 18px">' +
      '<div class="riq riq--ok"><b>'+creati+'</b><span>Turni assegnati</span></div>' +
      '<div class="riq riq--att"><b>'+scoperti+'</b><span>Rimasti scoperti</span></div>' +
    '</div>' +
    '<p style="color:var(--smorzato);font-size:.86rem">I turni gi&agrave; timbrati non sono stati toccati. ' +
    'Ogni casella resta modificabile a mano.</p>' +
    '<div class="azioni"><button class="b b--pri" id="ok">Chiudi</button></div>');
  document.getElementById('ok').onclick = chiudi;
}

function schedaStaff(){
  var righe = D.dipendenti.map(function(d){
    var peggiore = d.abil.map(function(a){ return statoAbil(a.s); }).sort(function(a,b){ return a.g-b.g; })[0];
    var p = !d.abil.length ? '<span class="p p--neutro">nessuna</span>'
          : '<span class="p p--'+peggiore.cl+'">'+peggiore.et+'</span>';
    var ore = D.turni.filter(function(t){ return t.dipendente===d.id && giorniIntervallo().indexOf(t.data)>=0; }).length;
    return '<tr><td><div class="persona">'+avatar(d.nome)+'<div><b>'+esc(d.nome)+'</b><small>'+esc(d.email)+'</small></div></div></td>' +
           '<td>'+d.mansioni.map(function(m){ return mansione(m).nome; }).join(', ')+'</td>' +
           '<td class="num">'+ore+'</td><td>'+p+'</td>' +
           '<td><button class="b b--sec b--min" data-scheda-dip="'+d.id+'">Scheda</button></td></tr>';
  }).join('');
  document.getElementById('sotto').innerHTML =
    '<div class="blocco"><div class="blocco__testa"><h2>Account dipendenti</h2>' +

    '<div class="tabellone"><table><thead><tr><th>Persona</th><th>Mansioni</th><th>Turni nel periodo</th><th>Abilitazioni</th><th></th></tr></thead><tbody>'+righe+'</tbody></table></div></div>';
  agganciaAzioni();
}

    '<button class="b b--pri" id="ok">Chiudi</button></div>');

}

function oreCodice(c){
  var a = minuti(c.ini), b = minuti(c.fin);
  if (b <= a) b += 1440;
  return (b - a) / 60;
}

function fogliaCodice(idx){
  var nuovo = idx === 'nuovo';
  var c = nuovo ? { id:'', et:'', ini:'09:00', fin:'17:00', col:'#2E5E8C' } : codici()[+idx];
  apri('<h2>'+(nuovo?'Nuovo turno tipo':'Modifica turno tipo')+'</h2>' +
    '<p class="foglio__nota">Orari e sigle sono liberi: ogni azienda usa i suoi.</p>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Sigla</span><input id="c-id" maxlength="2" value="'+esc(c.id)+'" placeholder="M"></label>' +
      '<label class="campo"><span>Nome</span><input id="c-et" value="'+esc(c.et)+'" placeholder="Mattina"></label>' +
    '</div><div class="duecol">' +
      '<label class="campo"><span>Inizio</span><input type="time" id="c-ini" value="'+c.ini+'"></label>' +
      '<label class="campo"><span>Fine</span><input type="time" id="c-fin" value="'+c.fin+'"></label>' +
    '</div>' +
    '<label class="campo"><span>Colore</span><input type="color" id="c-col" value="'+c.col+'"></label>' +
    '<div class="errore" id="c-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="ann">Annulla</button>' +
    '<button class="b b--pri" id="sal">Salva</button></div>');
  document.getElementById('ann').onclick = chiudi;
  document.getElementById('sal').onclick = function(){
    var id = document.getElementById('c-id').value.trim().toUpperCase();
    var et = document.getElementById('c-et').value.trim();
    var err = document.getElementById('c-err');
    if (!id || !et) { err.hidden=false; err.innerHTML='<b>Mancano dei dati.</b> Sigla e nome sono obbligatori.'; return; }
    if (nuovo && codici().some(function(x){ return x.id===id; })) {
      err.hidden=false; err.innerHTML='<b>Sigla gi&agrave; usata.</b> Scegline un\'altra.'; return; }
    var v = { id:id, et:et, ini:document.getElementById('c-ini').value,
              fin:document.getElementById('c-fin').value, col:document.getElementById('c-col').value };
    if (nuovo) D.codici.push(v); else D.codici[+idx] = v;
    salva(); chiudi(); vaiA('config');
  };
}

function fogliaEsigenza(idx){

      GIORNI_ET.map(function(g,k){

    salva(); chiudi(); vaiA('config');
  };

      '<div class="tabellone"><table><thead><tr><th>Visibile</th><th>Etichetta</th><th>Voce</th></tr></thead>' +
      '<tbody data-menu="menuAdmin">'+righeMenu(VOCI_ADMIN, ui.menuAdmin)+'</tbody></table></div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Menu del dipendente</h2></div>' +
      '<div class="tabellone"><table><thead><tr><th>Visibile</th><th>Etichetta</th><th>Voce</th></tr></thead>' +
      '<tbody data-menu="menuDip">'+righeMenu(VOCI_DIP, ui.menuDip)+'</tbody></table></div></div>' +

    '<div class="blocco"><div class="blocco__testa"><h2>Funzioni attive</h2></div>' +

    ['menuAdmin','menuDip'].forEach(function(k){
      var corpo = document.querySelector('[data-menu="'+k+'"]');
      corpo.querySelectorAll('[data-on]').forEach(function(ch){
        ui[k][ch.dataset.on] = ui[k][ch.dataset.on] || {};

      corpo.querySelectorAll('[data-et]').forEach(function(inp){

  };

VISTE.profilo = function(){
  intesta('Il mio profilo', utente.nome);
  var righe = utente.abil.map(function(a){
    var s = statoAbil(a.s);
    return '<tr><td><b>'+ABILITAZIONI[a.t]+'</b></td><td>'+dataBreve(a.s)+'</td>' +
           '<td>'+(s.g < 0 ? 'scaduta da '+Math.abs(s.g)+' giorni' : 'fra '+s.g+' giorni')+'</td>' +
           '<td><span class="p p--'+s.cl+'">'+s.et+'</span></td></tr>';
  }).join('');
  dipingi(
    '<div class="blocco"><div class="blocco__testa"><h2>Mansioni assegnate</h2></div>' +
      '<div style="padding:18px;display:flex;flex-wrap:wrap;gap:8px">' +
      utente.mansioni.map(function(m){ return '<span class="p p--neutro">'+mansione(m).nome+'</span>'; }).join('') +
      '</div></div>' +
    '<div class="blocco"><div class="blocco__testa"><h2>Le mie abilitazioni</h2></div>' +
      (utente.abil.length ? '<div class="tabellone"><table><thead><tr><th>Abilitazione</th><th>Scadenza</th><th>Quando</th><th>Stato</th></tr></thead><tbody>'+righe+'</tbody></table></div>'
                          : '<p class="vuoto">Nessuna abilitazione registrata.</p>') + '</div>'
  );
};

VISTE.miecedolini = function(){
  intesta('Le mie buste paga', 'Scarica il cedolino: resta traccia della presa visione');
  var miei = D.cedolini.filter(function(p){ return p.dipendente === utente.id; }).sort(function(a,b){ return b.mese.localeCompare(a.mese); });
  dipingi('<div class="blocco"><div class="tabellone"><table><thead><tr><th>Mese</th><th>Stato</th><th></th></tr></thead><tbody>' +
    miei.map(function(p){
      return '<tr><td><b>'+p.mese+'</b></td>' +
             '<td>'+(p.letto ? '<span class="p p--ok">scaricata il '+dataBreve(p.letto)+'</span>' : '<span class="p p--att">da scaricare</span>')+'</td>' +
             '<td><button class="b '+(p.letto?'b--sec':'b--pri')+' b--min" data-scarica="'+p.id+'">Scarica</button></td></tr>';
    }).join('') + '</tbody></table></div></div>');
  agganciaAzioni();
};

/* ============ azioni ============ */

function agganciaAzioni(){
  var v = document.getElementById('vista');
  v.querySelectorAll('[data-scheda-dip]').forEach(function(b){ b.onclick = function(){ fogliaScheda(b.dataset.schedaDip); }; });
  v.querySelectorAll('[data-vai]').forEach(function(b){ b.onclick = function(){ vaiA(b.dataset.vai); }; });
  v.querySelectorAll('[data-assegna]').forEach(function(b){ b.onclick = function(){ fogliaAssegna(b.dataset.assegna); }; });
  v.querySelectorAll('[data-nuovo]').forEach(function(b){ b.onclick = fogliaNuovo; });
  v.querySelectorAll('[data-modcod]').forEach(function(b){ b.onclick = function(){ fogliaCodice(b.dataset.modcod); }; });
  v.querySelectorAll('[data-modesi]').forEach(function(b){ b.onclick = function(){ fogliaEsigenza(b.dataset.modesi); }; });
  v.querySelectorAll('[data-elimcod]').forEach(function(b){ b.onclick = function(){
    D.codici.splice(+b.dataset.elimcod,1); salva(); vaiA('config'); }; });
  v.querySelectorAll('[data-elimesi]').forEach(function(b){ b.onclick = function(){
    D.esigenze.splice(+b.dataset.elimesi,1); salva(); vaiA('config'); }; });
  v.querySelectorAll('[data-turno]').forEach(function(b){ b.onclick = function(){ fogliaTurno(b.dataset.turno); }; });
  v.querySelectorAll('[data-nuovoturno]').forEach(function(b){ b.onclick = function(){
    var q = b.dataset.nuovoturno.split('|'); fogliaTurno(null, q[0], q[1] || null); }; });
  v.querySelectorAll('[data-scheda-dip]').forEach(function(b){ b.onclick = function(){ fogliaScheda(b.dataset.schedaDip); }; });
  v.querySelectorAll('[data-conferma]').forEach(function(b){ b.onclick = function(){ confermaTurno(b.dataset.conferma); }; });
  v.querySelectorAll('[data-scarica]').forEach(function(b){ b.onclick = function(){ scarica(b.dataset.scarica); }; });
}

var velo = document.getElementById('velo'), foglio = document.getElementById('foglio');
function apri(html){ foglio.innerHTML = html; velo.hidden = false; }
function chiudi(){ velo.hidden = true; }
velo.addEventListener('click', function(e){ if (e.target === velo) chiudi(); });
addEventListener('keydown', function(e){ if (e.key === 'Escape') chiudi(); });

/* --- editor del turno: location, mansione, orario e operatore sono tutti modificabili --- */
function fogliaTurno(idTurno, preData, preDip){
  var nuovo = !idTurno;
  var t = nuovo
    ? { id:null, data:preData || oggiISO(), inizio:'09:00', fine:'17:00',
        location:D.location[0].id, mansione:'portierato', dipendente:preDip || null, conferma:null, deroga:false }
    : D.turni.find(function(x){ return x.id === idTurno; });

  apri(
    '<h2>'+(nuovo ? 'Nuovo turno' : 'Modifica turno')+'</h2>' +
    '<p class="foglio__nota">Location e mansione si scelgono turno per turno: la stessa persona pu&ograve; ' +
      'coprire il portierato luned&igrave; e fare il moviere marted&igrave;.</p>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Data</span><input type="date" id="f-data" value="'+t.data+'"></label>' +
      '<label class="campo"><span>Location</span><select id="f-loc">' +
        D.location.map(function(l){
          return '<option value="'+l.id+'"'+(l.id===t.location?' selected':'')+'>'+l.nome+' &mdash; '+l.citta+'</option>';
        }).join('') + '</select></label>' +
    '</div>' +
    '<div class="duecol">' +
      '<label class="campo"><span>Inizio</span><input type="time" id="f-ini" value="'+t.inizio+'"></label>' +
      '<label class="campo"><span>Fine</span><input type="time" id="f-fin" value="'+t.fine+'"></label>' +
    '</div>' +
    '<label class="campo"><span>Mansione del turno</span><select id="f-mans">' +
      MANSIONI.map(function(m){
        return '<option value="'+m.id+'"'+(m.id===t.mansione?' selected':'')+'>'+m.nome+(m.abil?' \u00b7 richiede abilitazione':'')+'</option>';
      }).join('') + '</select></label>' +
    '<div id="f-operatori"></div>' +
    '<div class="azioni">' +
      (nuovo ? '' : '<button class="b b--sec" id="f-elimina">Elimina</button>') +
      '<button class="b b--sec" id="f-annulla">Annulla</button>' +
      '<button class="b b--pri" id="f-salva">'+(nuovo?'Crea turno':'Salva')+'</button>' +
    '</div>'
  );

  function operatori(){
    var mans = document.getElementById('f-mans').value;
    var m = mansione(mans);
    var val = D.dipendenti.map(function(d){ return { d:d, v:verifica(d, mans) }; });
    var idonei = val.filter(function(x){ return x.v.ok; });
    var esclusi = val.filter(function(x){ return !x.v.ok && x.d.mansioni.indexOf(mans) >= 0; });

    document.getElementById('f-operatori').innerHTML =
      (m.abil ? '<div class="campo"><span>Abilitazione richiesta</span><div><span class="p p--oro">'+ABILITAZIONI[m.abil]+'</span></div></div>' : '') +
      '<label class="campo"><span>Operatore &mdash; '+idonei.length+' idonei</span>' +
        '<select id="f-dip"><option value="">Lascia scoperto</option>' +
        idonei.map(function(x){
          return '<option value="'+x.d.id+'"'+(x.d.id===t.dipendente?' selected':'')+'>' +
                 esc(x.d.nome)+(x.v.avviso ? ' \u2014 ' + x.v.avviso : '')+'</option>';
        }).join('') + '</select></label>' +
      (esclusi.length ? '<div class="campo"><span>Bloccati dal sistema</span>' +
        esclusi.map(function(x){ return '<div class="errore"><b>'+esc(x.d.nome)+'</b> &mdash; '+x.v.motivo+'</div>'; }).join('') +
        (abilitata('deroga') ? '<label class="spunta"><input type="checkbox" id="f-deroga"> Assegna in deroga</label>' : '') +
        '<select id="f-dip-deroga" style="margin-top:8px">' +
          esclusi.map(function(x){ return '<option value="'+x.d.id+'">'+esc(x.d.nome)+'</option>'; }).join('') +
        '</select></div>' : '');
  }
  operatori();
  document.getElementById('f-mans').onchange = operatori;

  document.getElementById('f-annulla').onclick = chiudi;
  var el = document.getElementById('f-elimina');
  if (el) el.onclick = function(){
    D.turni = D.turni.filter(function(x){ return x.id !== t.id; });
    salva(); chiudi(); vaiA(vistaAttuale);
  };

  document.getElementById('f-salva').onclick = function(){
    var der = document.getElementById('f-deroga');
    t.data     = document.getElementById('f-data').value;
    t.inizio   = document.getElementById('f-ini').value;
    t.fine     = document.getElementById('f-fin').value;
    t.location = document.getElementById('f-loc').value;
    t.mansione = document.getElementById('f-mans').value;
    if (der && der.checked) { t.dipendente = document.getElementById('f-dip-deroga').value; t.deroga = true; }
    else { t.dipendente = document.getElementById('f-dip').value || null; t.deroga = false; }
    if (nuovo) { t.id = 'n'+Date.now(); D.turni.push(t); }
    salva(); chiudi(); vaiA(vistaAttuale);
  };
}
function fogliaAssegna(id){ fogliaTurno(id); }

/* --- creazione account --- */
function fogliaNuovo(){
  apri(
    '<h2>Crea account dipendente</h2>' +
    '<p class="foglio__nota">L\u2019operatore accede con la propria utenza e vede solo i propri turni, il proprio profilo e le proprie buste paga.</p>' +
    '<label class="campo"><span>Nome e cognome</span><input id="n-nome" placeholder="Es. Giulia Toffoli"></label>' +
    '<label class="campo"><span>Email di accesso</span><input id="n-mail" placeholder="g.toffoli@sicury.local"></label>' +
    '<label class="campo"><span>Password iniziale</span><input id="n-pw" type="text" placeholder="La cambier&agrave; al primo accesso"></label>' +
    '<div class="campo"><span>Mansioni abilitate</span><div class="spunte">' +
      MANSIONI.map(function(m){
        return '<label class="spunta"><input type="checkbox" value="'+m.id+'">'+m.nome+'</label>';
      }).join('') + '</div></div>' +
    '<div class="errore" id="n-err" hidden></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
    '<button class="b b--pri" id="crea">Crea account</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('crea').onclick = function(){
    var nome = document.getElementById('n-nome').value.trim();
    var mail = document.getElementById('n-mail').value.trim();
    var mans = [].slice.call(foglio.querySelectorAll('.spunte input:checked')).map(function(i){ return i.value; });
    var err = document.getElementById('n-err');
    var pw = document.getElementById('n-pw').value;
    if (!nome || !mail || !pw) { err.hidden = false; err.innerHTML = '<b>Mancano dei dati.</b> Nome, email e password sono obbligatori.'; return; }
    if (D.dipendenti.concat(D.accessi).some(function(x){ return x.email.toLowerCase() === mail.toLowerCase(); })) {
      err.hidden = false; err.innerHTML = '<b>Email gi&agrave; in uso.</b> Ogni account ha la sua.'; return; }
    D.dipendenti.push({ id:'d'+(Date.now()%100000), nome:nome, email:mail, mansioni:mans, abil:[], pw:sha256(pw) });
    salva(); chiudi(); vaiA('dipendenti');
  };
}

/* --- scheda con abilitazioni --- */
function fogliaScheda(id){
  var d = dip(id);
  var righe = d.abil.map(function(a){
    var s = statoAbil(a.s);
    return '<tr><td>'+ABILITAZIONI[a.t]+'</td><td>'+dataBreve(a.s)+'</td><td><span class="p p--'+s.cl+'">'+s.et+'</span></td></tr>';
  }).join('');
  apri(
    '<h2>'+esc(d.nome)+'</h2><p class="foglio__nota">'+esc(d.email)+'</p>' +
    '<div class="campo"><span>Mansioni</span><div class="spunte">' +
      d.mansioni.map(function(m){ return '<span class="p p--neutro">'+mansione(m).nome+'</span>'; }).join('') + '</div></div>' +
    '<div class="campo"><span>Abilitazioni</span>' +
      (d.abil.length ? '<div class="tabellone"><table><tbody>'+righe+'</tbody></table></div>'
                     : '<p style="color:var(--nebbia);font-size:.88rem">Nessuna registrata.</p>') + '</div>' +
    '<div class="campo"><span>Aggiungi abilitazione</span>' +
      '<select id="a-tipo">' + Object.keys(ABILITAZIONI).map(function(k){
        return '<option value="'+k+'">'+ABILITAZIONI[k]+'</option>'; }).join('') + '</select>' +
      '<input type="date" id="a-scad" style="margin-top:8px"></div>' +
    '<div class="campo"><span>Reimposta la password</span>' +
      '<div class="duecol"><input id="s-pw" type="text" placeholder="Nuova password">' +
      '<button class="b b--sec" id="s-pw-ok" type="button">Reimposta</button></div></div>' +
    '<div class="azioni"><button class="b b--sec" id="annulla">Chiudi</button>' +
    '<button class="b b--pri" id="agg">Aggiungi</button></div>'
  );
  document.getElementById('annulla').onclick = chiudi;
  document.getElementById('s-pw-ok').onclick = function(){
    var pw = document.getElementById('s-pw').value;
    if (!pw) return;
    d.pw = sha256(pw); salva();
    document.getElementById('s-pw').value = ''; document.getElementById('s-pw').placeholder = 'Password aggiornata';
  };
  document.getElementById('agg').onclick = function(){
    var s = document.getElementById('a-scad').value;
    if (!s) return;
    d.abil.push({ t:document.getElementById('a-tipo').value, s:s });
    salva(); chiudi(); vaiA('dipendenti');
  };
}

    var lng = l.lng + (Math.random()-0.5)*scarto;
    var m = distanza(l.lat, l.lng, lat, lng);
    var fuori = m > l.raggio;
    var ora = new Date().toTimeString().slice(0,5);

    // pianta di prossimita': anello = raggio consentito, punto = posizione rilevata
    var ang = Math.random()*Math.PI*2;
    var rr = Math.min(m / l.raggio, 1.4) * 62;
    var px = (100 + Math.cos(ang)*rr).toFixed(1), py = (100 + Math.sin(ang)*rr).toFixed(1);
    var col = fuori ? 'var(--att)' : 'var(--ok)';

    var pianta =
      '<svg class="pianta" viewBox="0 0 200 200" role="img" aria-label="Distanza dal punto di servizio">' +
        '<circle cx="100" cy="100" r="86" fill="none" stroke="var(--linea)" stroke-dasharray="2 6"/>' +
        '<circle cx="100" cy="100" r="62" fill="var(--ok-velo)" stroke="var(--ok)" stroke-dasharray="5 5" opacity=".85"/>' +
        '<line x1="100" y1="8" x2="100" y2="192" stroke="var(--linea)" stroke-width="1"/>' +
        '<line x1="8" y1="100" x2="192" y2="100" stroke="var(--linea)" stroke-width="1"/>' +
        '<circle cx="100" cy="100" r="5" fill="var(--marchio)"/>' +
        '<line x1="100" y1="100" x2="'+px+'" y2="'+py+'" stroke="'+col+'" stroke-width="1.5" stroke-dasharray="3 3"/>' +
        '<circle cx="'+px+'" cy="'+py+'" r="9" fill="'+col+'" opacity=".18"/>' +
        '<circle cx="'+px+'" cy="'+py+'" r="4.5" fill="'+col+'"/>' +
        '<text x="100" y="176" text-anchor="middle" font-size="9" fill="var(--tenue)" font-family="monospace">raggio '+l.raggio+' m</text>' +
      '</svg>';

    apri('<h2>'+(fuori ? 'Sei fuori dall&rsquo;area' : 'Servizio confermato')+'</h2>' +
      '<p class="foglio__nota">'+mansione(t.mansione).nome+' &middot; '+nomeLoc(t.location)+'</p>' +
      '<div class="pianta__box">'+pianta+
        '<div class="pianta__dati">' +
          '<div><span>Distanza</span><b style="color:'+col+'">'+m+' m</b></div>' +
          '<div><span>Raggio consentito</span><b>'+l.raggio+' m</b></div>' +
          '<div><span>Orario rilevato</span><b>'+ora+'</b></div>' +
          '<div><span>Postazione</span><b>'+l.citta+'</b></div>' +
        '</div></div>' +
      (fuori ? '<div class="errore">La conferma viene registrata come <b>fuori area</b> e segnalata al coordinatore. Il turno non viene bloccato.</div>' : '') +
      '<div class="azioni"><button class="b b--sec" id="annulla">Annulla</button>' +
      '<button class="b b--pri" id="ok">Registra la conferma</button></div>');

    document.getElementById('annulla').onclick = chiudi;
    document.getElementById('ok').onclick = function(){
      t.conferma = { ora:ora, distanza:m, fuoriArea:fuori };
      salva(); chiudi(); vaiA('mieiturni');
    };
  }, 1100);
}

function scarica(idCed){
  var p = D.cedolini.find(function(x){ return x.id === idCed; });
  if (!p.letto) { p.letto = oggiISO(); salva(); }
  apri('<h2>Busta paga '+p.mese+'</h2>' +
    '<p class="foglio__nota">Nel sistema definitivo qui si apre il PDF caricato dall\u2019amministrazione.</p>' +
    '<div class="campo"><span>Presa visione registrata</span><div><span class="p p--ok">'+dataBreve(p.letto)+'</span></div></div>' +
    '<div class="azioni"><button class="b b--pri" id="annulla">Chiudi</button></div>');
  document.getElementById('annulla').onclick = function(){ chiudi(); vaiA('miecedolini'); };
}

/* ============ avvio ============ */
elencoAccesso();

</script>
